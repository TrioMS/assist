<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assist</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Michroma&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Portal ailesinin (HSE / Kalite / Hukuk) jeton kümesi — aynı görünsün diye
   burada tekrar tanımlanır; uygulama tek dosya olarak taşınabilmeli. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --s-ink:#14181F; --s-2:#1B212B; --s-slate:#2A3340;
  --s-red:#D8232A; --s-red-deep:#A81A20;
  --s-concrete:#F4F5F7; --s-cloud:#FFFFFF; --s-line:#E3E6EB;
  --s-graphite:#5A6472; --s-graphite2:#8A94A3; --s-inktext:#1C2430;
  --s-green:#2E9E6B; --s-amber:#E8A13A; --s-blue:#3E77C2;
  --s-green-bg:#E7F5EE; --s-amber-bg:#FCF2E3; --s-blue-bg:#E9F1FA; --s-red-bg:#FBE9EA;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-display:'Archivo',var(--font);
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(20,24,31,.06),0 4px 16px rgba(20,24,31,.05);
}
body{font-family:var(--font);background:var(--s-concrete);color:var(--s-inktext);font-size:14px;line-height:1.55;min-height:100vh;padding-left:64px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.25}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── ÜST ŞERİT ── */
.topbar{background:var(--s-ink);color:#fff;padding:0 22px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s-red)}
/* Logodaki STFA yazisinin stili: genis geometrik harf, logo grisi (kenar cubugundaki logo gibi parlatilmis) */
.tb-brand{font-family:'Michroma','Bahnschrift',var(--font-display);font-weight:400;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#B5B7BA}   /* lang=en: Turkce buyuk harf 'ASSİST' yapmasin */
.tb-spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E6EAF0;
        height:34px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.tb-btn:hover{background:rgba(255,255,255,.15)}
a.tb-btn{text-decoration:none}
.tb-btn svg.i{width:15px;height:15px}
.tb-ikon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;background:rgba(255,255,255,.08);
         border:1px solid rgba(255,255,255,.16);color:#E6EAF0;border-radius:8px;cursor:pointer;padding:0}
.tb-ikon:hover{background:rgba(255,255,255,.16)}
.tb-ikon.acik{background:var(--s-red);border-color:var(--s-red)}
.tb-say{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--s-red);color:#fff;
        font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid var(--s-ink)}
.tb-say.var{display:inline-flex}
.tb-bld{position:relative}
.bld-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;color:var(--s-inktext);border:1px solid var(--s-line);border-radius:10px;
          box-shadow:0 10px 28px rgba(20,24,31,.22);z-index:200;display:none;width:min(420px,calc(100vw - 24px));max-height:70vh;overflow:auto}
.bld-menu.acik{display:block}
.bld-menu-h{padding:10px 14px;border-bottom:1px solid var(--s-line);font-weight:700;font-size:13px}
.bld-oge{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--s-line);cursor:pointer}
.bld-oge:last-child{border-bottom:none}
.bld-oge:hover{background:var(--s-concrete)}
.bld-nokta{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--s-blue)}
.bld-nokta.kritik{background:var(--s-red)} .bld-nokta.uyari{background:var(--s-amber)}
.bld-metin{flex:1;min-width:0}
.bld-metin b{display:block;font-size:12.5px;font-weight:500;color:var(--s-graphite)}
.bld-oge.yeni .bld-metin b{font-weight:800;color:var(--s-inktext)}
.bld-metin span{display:block;font-size:11.5px;color:var(--s-graphite);margin-top:1px}
.bld-bos{padding:18px 14px;font-size:12.5px;color:var(--s-graphite2)}

/* ── KENAR ÇUBUĞU (HSE/Hukuk kalıbı: 64 px ray, üzerine gelince açılır) ── */
.tabs{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--s-ink);z-index:45;display:flex;flex-direction:column;overflow:hidden;
      transition:width .18s ease;box-shadow:2px 0 0 rgba(255,255,255,.04)}
.tabs:hover{width:236px;box-shadow:12px 0 32px rgba(0,0,0,.28)}
/* Logo satırı HSE/Hukuk portallarıyla birebir: kapalı rayda yalnız soldaki bayrak
   işareti (logonun ilk ~40 px'i), ray açılınca tam logo. */
.sb-logo-row{display:flex;align-items:center;height:56px;box-sizing:border-box;padding:0 12px;flex-shrink:0;border-bottom:1px solid #2E3742;white-space:nowrap;overflow:hidden}
.sb-logo-row img{height:24px;width:auto;flex-shrink:0;display:block;filter:brightness(1.25)}
.sb-logo-kutu{display:block;width:40px;overflow:hidden;transition:width .18s ease}
.tabs:hover .sb-logo-kutu{width:140px}
.sn-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0}
.sn-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 22px;margin-top:2px;background:none;border:none;
         color:#C4CBD6;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;text-align:left;transition:background .12s,color .12s}
.sn-item svg.i{width:19px;height:19px}
.sn-item span{opacity:0;transition:opacity .12s}
.tabs:hover .sn-item span{opacity:1}
.sn-item:hover{background:linear-gradient(90deg,rgba(216,35,42,.18),transparent);color:#fff}
.sn-item.active{color:#fff;background:linear-gradient(90deg,rgba(216,35,42,.28),transparent)}
.sn-item:hover::before,.sn-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--s-red);border-radius:0 3px 3px 0}
.sn-say{margin-left:auto;font-size:11px;font-weight:800;min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:var(--s-red);color:#fff;
        display:inline-flex;align-items:center;justify-content:center}
.sn-say:empty{display:none}
/* Ray kapalıyken sayaç simgenin köşesine biner */
.tabs:not(:hover) .sn-say{position:absolute;left:36px;top:5px;min-width:16px;height:16px;font-size:10px;padding:0 4px}

/* ── GÖRÜNÜMLER ── */
.view{display:none;padding:22px;max-width:1420px;margin:0 auto}
.view.active{display:block}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.vhead h1{font-size:21px}
/* Notlar > Defter: günlük serbest yazı sayfaları (çizgili kâğıt) */
.not-sekme{display:inline-flex;margin-left:8px;background:#fff;border:1px solid var(--s-line);border-radius:9px;padding:3px;gap:2px}
.not-sekme button{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--s-graphite);cursor:pointer}
.not-sekme button.acik{background:var(--s-ink);color:#fff}
.defter{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.defter-liste{max-height:calc(100vh - 170px);overflow:auto;padding-bottom:6px}
.defter-gun{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 14px;border-left:3px solid transparent;cursor:pointer}
.defter-gun:hover{background:var(--s-paper)} .defter-gun.acik{border-left-color:var(--s-red);background:#FFF6F6}
.defter-gun > div{flex:1;min-width:0} .defter-gun b{display:block;font-size:12.5px}
.defter-gun span{display:block;font-size:12px;color:var(--s-graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.defter-gun .ikon-btn{opacity:0} .defter-gun:hover .ikon-btn{opacity:1}
.defter-durum{margin-left:auto;font-size:11.5px;color:var(--s-graphite)}
.defter-sayfa textarea.defter-metin{display:block;width:100%;box-sizing:border-box;min-height:calc(100vh - 230px);border:none;resize:vertical;outline:none;
  padding:0 22px 20px 54px;font:15px/28px var(--font);color:var(--s-ink);
  background-color:#FFFEF8;background-attachment:local;border-radius:0 0 var(--radius) var(--radius);
  background-image:linear-gradient(90deg,transparent 40px,#EFA3A6 40px,#EFA3A6 42px,transparent 42px),
                   repeating-linear-gradient(transparent 0 27px,#CFDBE8 27px 28px)}
@media (max-width:900px){.defter{grid-template-columns:1fr}}
/* Toplantı odaları: saat ızgarası (30 dk dilim) */
.oda-ust{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--s-line)}
.oda-tarih{font-size:14px;min-width:190px;text-align:center}
.oda-tablo-sar{overflow-x:auto;padding:12px 16px 4px}
.oda-tablo{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;table-layout:fixed}
.oda-tablo th{font-size:11px;font-weight:600;color:var(--s-graphite);text-align:left;padding:0 0 6px 2px;white-space:nowrap}
.oda-ad-b{width:120px}
.oda-ad{padding:4px 10px 4px 0;white-space:nowrap} .oda-ad b{display:block;font-size:13.5px} .oda-ad span{font-size:11px;color:var(--s-graphite)}
.oda-d{height:38px;border-top:3px solid #fff;border-bottom:3px solid #fff;border-right:1px solid #fff}
.oda-d.yarim{border-left:1px solid var(--s-line)}
.oda-d.od-bos{background:#E8F5EE;cursor:pointer} .oda-d.od-bos:hover{background:#BFE5CF}
.oda-d.od-dolu{background:#F3C9CB} .oda-d.od-bel{background:#F8E3B5} .oda-d.od-gecti{background:#EEF0F3}
.oda-d.secili{background:var(--s-green)!important}
.oda-lejant{display:flex;gap:16px;padding:6px 16px 10px;font-size:11.5px;color:var(--s-graphite)}
.oda-lejant span{display:inline-flex;align-items:center;gap:6px} .oda-lejant i{width:14px;height:10px;border-radius:2px;display:inline-block}
.oda-lejant i.od-bos{background:#E8F5EE;border:1px solid #BFE5CF} .oda-lejant i.od-dolu{background:#F3C9CB} .oda-lejant i.od-bel{background:#F8E3B5} .oda-lejant i.od-sec{background:var(--s-green)}
.oda-ipucu{padding:4px 16px 16px;font-size:12.5px;color:var(--s-graphite)}
.oda-form{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 16px 16px;padding:12px 14px;border:1px solid #CDE9DA;background:var(--s-green-bg);border-radius:var(--radius)}
.oda-form-baslik{font-size:13.5px} .oda-form select{padding:5px 8px;border:1px solid var(--s-line);border-radius:6px}
.oda-form input{flex:1;min-width:220px;padding:8px 11px;border:1px solid var(--s-line);border-radius:var(--radius-sm)}
.oda-not{flex-basis:100%;font-size:11.5px;color:var(--s-graphite)}
/* Ana ekran hava durumu (Open-Meteo; şehir Ayarlar > Kişiler ve Listeler) */
.hava{margin-left:auto;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--s-line);border-radius:var(--radius);padding:6px 14px}
.hava-simdi{display:flex;align-items:center;gap:8px}
.hava-simdi svg{width:30px;height:30px}
.hava-derece{font-size:22px;font-weight:800;font-family:var(--font-display);line-height:1}
.hava-yer{font-size:11.5px;color:var(--s-graphite);line-height:1.25}
.hava-yer b{display:block;color:var(--s-ink);font-size:12.5px}
.hava-gunler{display:flex;gap:10px;border-left:1px solid var(--s-line);padding-left:12px}
.hava-gun{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--s-graphite);gap:1px}
.hava-gun svg{width:18px;height:18px}
.hava-gun b{color:var(--s-ink);font-weight:700}
@media (max-width:900px){.hava-gunler{display:none}}

/* ── KART / KPI ── */
.card{background:var(--s-cloud);border:1px solid var(--s-line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{padding:12px 18px;border-bottom:1px solid var(--s-line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.card-h h3{font-size:14.5px}
.card-h .say{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s-concrete);color:var(--s-graphite)}
.sp{flex:1}
.card-b{padding:18px}
.card-b.tight{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--s-cloud);border:1px solid var(--s-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;
     transition:box-shadow .15s,transform .15s;border-left:3px solid transparent;text-align:left}
.kpi:hover{box-shadow:0 3px 14px rgba(20,28,40,.14);transform:translateY(-1px)}
.kpi.secili{border-left-color:var(--s-ink)}
.kpi .k-l{font-size:11.5px;font-weight:600;color:var(--s-graphite);text-transform:uppercase;letter-spacing:.4px}
.kpi .k-v{font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:4px}
.kpi.red .k-v{color:var(--s-red)} .kpi.amber .k-v{color:#C9831C} .kpi.blue .k-v{color:var(--s-blue)} .kpi.green .k-v{color:var(--s-green)}
.kpi.red.dolu{background:var(--s-red-bg);border-color:#F1C6C8}

/* ── TABLO ── */
.liste-kutu{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:9px 14px;background:var(--s-concrete);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
             color:var(--s-graphite);border-bottom:1px solid var(--s-line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:9px 14px;border-bottom:1px solid var(--s-line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.clickable:hover td{background:var(--s-concrete)}
table.tbl td.no{white-space:nowrap;font-weight:600;color:var(--s-graphite);width:1%}
table.tbl td.tarih{white-space:nowrap;width:1%}
table.tbl td.dar{white-space:nowrap;width:1%}
table.tbl td .alt{font-size:11.5px;color:var(--s-graphite2);margin-top:1px}
/* Özet başlığın altında, en çok 2 satır; tamamı üzerine gelince */
table.tbl td .ozet{font-size:12px;color:var(--s-graphite);margin-top:3px;line-height:1.45;max-width:640px;
                   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
table.tbl tr.grup td{background:var(--s-cloud);font-size:12px;font-weight:700;color:var(--s-graphite);text-transform:uppercase;letter-spacing:.4px;padding-top:14px}
table.tbl tr.grup td b{color:var(--s-inktext);margin-left:4px}
table.tbl tr.soluk td{color:var(--s-graphite2)}
table.tbl tr.okunmadi td.konu b{font-weight:800}
.bos{padding:34px 18px;text-align:center;color:var(--s-graphite2);font-size:13px}
.kalan{white-space:nowrap;font-weight:600}
.kalan.gecti{color:var(--s-red)} .kalan.yakin{color:#C9831C} .kalan.normal{color:var(--s-graphite)}
.oncelik{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-red);margin-right:7px;vertical-align:middle}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.gray{background:var(--s-concrete);color:var(--s-graphite)}
.badge.green{background:var(--s-green-bg);color:#1B6A46}
.badge.amber{background:var(--s-amber-bg);color:#8A5C12}
.badge.red{background:var(--s-red-bg);color:var(--s-red-deep)}
.badge.blue{background:var(--s-blue-bg);color:#2A5A96}
.ikon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border:1px solid transparent;background:none;border-radius:6px;
          color:var(--s-graphite);cursor:pointer;vertical-align:middle;margin-left:6px}
.ikon-btn:hover{background:var(--s-blue-bg);color:var(--s-blue);border-color:#CFE0F3}
.ikon-btn svg.i{width:15px;height:15px}
.p-ikonlar{white-space:nowrap}
.p-ikonlar .ikon-btn{margin-left:2px;width:30px;height:28px}
.p-ikonlar .ikon-btn svg.i{width:16px;height:16px}
.ikon-btn.bayrakli{color:var(--s-red)}
.ikon-btn.bayrakli svg.i{fill:currentColor}
/* Aksiyon / not alınmış postanın simgesi: bayrakla aynı kırmızı, içi açık ton */
.ikon-btn.yanik{color:var(--s-red)}
.ikon-btn.yanik svg.i{fill:var(--s-red-bg);stroke-width:2.1}
/* Hepsi kapandı: yeşil */
.ikon-btn.bitti{color:var(--s-green)}
.ikon-btn.bitti svg.i{fill:var(--s-green-bg);stroke-width:2.1}
.ikon-btn:disabled{opacity:.4;cursor:wait}
.ilet-panel{border:1px solid #CFE0F3;background:var(--s-blue-bg);border-radius:10px;padding:12px 14px 4px;margin-bottom:16px}
.ilet-panel .field input,.ilet-panel .field select,.ilet-panel .field textarea{background:#fff}
.pm-dugmeler{display:flex;gap:10px;margin-bottom:14px}
.pm-dugmeler .btn{flex:1;justify-content:center;padding:12px;font-size:14px}
.pm-dugmeler .btn svg.i{width:18px;height:18px}
.pm-blok{border:1px solid var(--s-line);border-radius:10px;padding:10px 14px 2px;margin-bottom:12px;background:#fff}
.pm-blok-h{display:flex;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px}
.pm-blok textarea{width:100%;padding:8px 11px;border:1px solid var(--s-line);border-radius:var(--radius-sm);margin-bottom:12px;resize:vertical;line-height:1.5}
#pmAksEkle{margin:-2px 0 14px}
.pm-onceki-kutu{margin-bottom:14px;border:1px solid var(--s-line);border-radius:10px;overflow:hidden}
.pm-onceki{display:flex;gap:10px;align-items:center;padding:7px 12px;font-size:12.5px;border-bottom:1px solid var(--s-line);cursor:pointer}
.pm-onceki:last-child{border-bottom:none}
.pm-onceki:hover{background:var(--s-concrete)}
.pm-onceki b{color:var(--s-graphite);white-space:nowrap}
.pm-onceki span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-onceki em{font-style:normal}
table.tbl td.not-metin{white-space:pre-line;max-width:520px}
.ikon-btn.sil:hover{background:var(--s-red-bg);color:var(--s-red);border-color:#F1C6C8}
.konu-on{display:block;font-size:11.5px;color:var(--s-graphite2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}

/* ── FİLTRE PANELİ + LİSTE (diğer portallardaki düzen) ── */
.ara-duzen{display:flex;gap:18px;align-items:flex-start}
.ara-panel{width:250px;flex-shrink:0;padding:14px;position:sticky;top:78px}
.ara-baslik{font-size:11px;font-weight:700;color:var(--s-graphite2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ara-panel .field{margin-bottom:10px}
.ara-panel .field label{font-size:11px;margin-bottom:4px}
.ara-panel .field input,.ara-panel .field select{padding:7px 9px;font-size:12.5px}
.ara-dugmeler{display:flex;gap:8px;margin-top:12px}
.ara-liste{flex:1;min-width:0}
@media (max-width:900px){.ara-duzen{flex-direction:column;align-items:stretch}.ara-panel{width:auto;position:static}}

/* ── FORM / DÜĞME ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--s-line);background:var(--s-cloud);
     font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--s-concrete)}
.btn.primary{background:var(--s-ink);border-color:var(--s-ink);color:#fff}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}

.secim{display:inline-flex;gap:4px;padding:4px;background:var(--s-concrete);border-radius:10px;margin-bottom:14px}

/* Anahtar (aç/kapa) */

.ray::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.anahtar input:checked + .ray{background:var(--s-green)}

.gun-sec{display:flex;flex-wrap:wrap;gap:8px}

/* Notlarım ve Aksiyonlarım: kartın içinde aralıklı iki ayrı çerçeve */

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s-ink);color:#fff;padding:10px 18px;border-radius:9px;
       font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.hata{background:var(--s-red-deep)}
.yukleniyor{padding:34px 18px;text-align:center;color:var(--s-graphite);font-size:13px}
@media (max-width:700px){body{padding-left:0}.tabs{top:auto;bottom:0;height:56px;width:100%}.tabs:hover{width:100%}.sb-logo-row{display:none}
  .sn-nav{display:flex;padding:0;width:100%}.sn-item{flex:1;justify-content:center;padding:0;height:56px;margin:0}.sn-item span{display:none}.tabs:not(:hover) .sn-say{left:calc(50% + 4px)}.view{padding:14px 12px 80px}.tb-btn span{display:none}}
</style>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   YARDIMCILAR
   ═══════════════════════════════════════════════════════════════ */
const $  = (s, k) => (k || document).querySelector(s);
const $$ = (s, k) => [...(k || document).querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
// Türkçe küçük harf: /i bayrağı ve toLowerCase() İ/ı'yı ıskalıyor.
const trK = s => String(s || '').toLocaleLowerCase('tr-TR');
const yerelTarih = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const bugun = () => yerelTarih(new Date());
const simdi = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function tarihNesne(t) { const [y, m, d] = t.split('-').map(Number); return new Date(y, m - 1, d); }
function gunFark(t) {
  if (!t) return null;
  const [y, m, d] = t.split('-').map(Number), b = new Date();
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5);
}
function trTarih(t) { if (!t) return ''; const [y, m, d] = String(t).slice(0, 10).split('-'); return d + '.' + m + '.' + y; }
function trTarihSaat(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return trTarih(yerelTarih(d)) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function kisaTarih(iso) {
  // Postalar: bugün → "Bugün 14:30", diğerleri → gg.aa.yyyy (yıl her zaman yazılır)
  const d = new Date(iso), t = yerelTarih(d);
  if (t === bugun()) return 'Bugün ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  return trTarih(t);
}
function svg(id) { return `<svg class="i"><use href="#ic-${id}"/></svg>`; }

/* ── Tarih / saat kutuları: gg.aa.yyyy ve 24 saat ──
   Tarayıcının kendi tarih kutusu biçimi dil ayarına bağlı (ay/gün/yıl çıkabiliyor)
   ve sayfadan değiştirilemiyor. Her <input type=date> görünmez kalır, değeri
   (yyyy-aa-gg) kod için aynen durur; üstüne gg.aa.yyyy yazılan bir kutu konur.
   Sağdaki simge, görünmez özgün kutunun takvimini açar. Saat kutuları da ss:dd. */
function tarihCoz(s) {
  s = trK(String(s || '').trim());
  if (!s) return '';
  if (s === 'bugün') return bugun();
  if (s === 'yarın') { const d = new Date(); d.setDate(d.getDate() + 1); return yerelTarih(d); }
  const m = s.match(/^(\d{1,2})[.\/\-\s](\d{1,2})(?:[.\/\-\s](\d{2,4}))?$/) || s.match(/^(\d{2})(\d{2})(\d{4})?$/);
  if (!m) return null;
  const g = +m[1], a = +m[2]; let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
  const d = new Date(y, a - 1, g);
  return d.getMonth() === a - 1 && d.getDate() === g ? yerelTarih(d) : null;
}
function saatCoz(s) {
  s = String(s || '').trim();
  if (!s) return '';
  const m = s.match(/^(\d{1,2})(?:[:.\s]?(\d{2}))?$/);
  if (!m || +m[1] > 23 || (m[2] && +m[2] > 59)) return null;
  return p2(+m[1]) + ':' + (m[2] || '00');
}
function tarihSaatKutulari(kok) {
  $$('input[type=date]:not([data-tg]), input[type=time]:not([data-tg])', kok).forEach(ozgun => {
    ozgun.dataset.tg = '1';
    const tarihMi = ozgun.type === 'date';
    const sar = document.createElement('span'); sar.className = 'tg' + (tarihMi ? '' : ' saat');
    const yazi = document.createElement('input'); yazi.type = 'text'; yazi.className = 'tg-yazi';
    yazi.placeholder = tarihMi ? 'gg.aa.yyyy' : 'ss:dd'; yazi.inputMode = 'numeric'; yazi.autocomplete = 'off';
    yazi.value = tarihMi ? trTarih(ozgun.value) : ozgun.value;
    ozgun.parentNode.insertBefore(sar, ozgun);
    sar.appendChild(yazi);
    if (tarihMi) { sar.insertAdjacentHTML('beforeend', `<span class="tg-ikon">${svg('plan')}</span>`); sar.appendChild(ozgun); ozgun.tabIndex = -1; }
    else { sar.appendChild(ozgun); ozgun.hidden = true; }
    const isle = () => {
      const v = tarihMi ? tarihCoz(yazi.value) : saatCoz(yazi.value);
      if (v === null) { yazi.classList.add('hatali'); toast(tarihMi ? 'Tarihi gg.aa.yyyy biçiminde yazın.' : 'Saati ss:dd biçiminde yazın.', true); return; }
      yazi.classList.remove('hatali');
      yazi.value = tarihMi ? trTarih(v) : v;
      if (ozgun.value !== v) { ozgun.value = v; ozgun.dispatchEvent(new Event('change', { bubbles: true })); }
    };
    yazi.addEventListener('change', isle);
    yazi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); isle(); } });
    // Takvimden seçilince yazıyı güncelle
    ozgun.addEventListener('change', () => { if (tarihMi) yazi.value = trTarih(ozgun.value); });
  });
}
new MutationObserver(() => tarihSaatKutulari(document)).observe(document.documentElement, { childList: true, subtree: true });
let toastZ;
function toast(m, hata) {
  const t = $('#toast'); t.textContent = m; t.className = 'toast show' + (hata ? ' hata' : '');
  clearTimeout(toastZ); toastZ = setTimeout(() => t.className = 'toast', hata ? 5000 : 2600);
}
// Sunucu metinleri ASCII yazılır; kullanıcıya Türkçe gösterilir.
const SUNUCU_METIN = {
  'Posta bulunamadi.': 'Posta Outlook\'ta bulunamadı.',
  "Posta Outlook'ta bulunamadi ve kopyasi yok.": 'Posta Outlook\'ta bulunamadı, kayıtlı kopyası da yok.',
  'Erisim reddedildi.': 'Erişim reddedildi.',
  'Bilinmeyen uc.': 'Sunucu eski sürümle çalışıyor. "Assist.bat" dosyasını yeniden çalıştırın.',
  "Outlook'ta secili posta yok.": 'Outlook\'ta seçili posta yok. Önce Outlook\'ta bir posta seçin.',
  'Secili oge posta degil.': 'Outlook\'ta seçili öğe bir posta değil.'
};
async function api(yol, opt = {}) {
  opt.headers = Object.assign({ 'X-IsTakip': '1', 'Content-Type': 'application/json' }, opt.headers || {});
  return fetch(yol, opt);
}
async function apiJson(yol, opt) {
  const r = await api(yol, opt);
  let j; try { j = await r.json(); } catch { throw new Error('Sunucu cevabı okunamadı (' + r.status + ').'); }
  if (!r.ok || j.ok === false) { const e = new Error(SUNUCU_METIN[j.hata] || j.hata || ('HTTP ' + r.status)); e.durum = r.status; e.j = j; throw e; }
  return j;
}

/* ═══════════════════════════════════════════════════════════════
   VERİ
   Tek belge (isler.json) sunucuda; her değişiklikte tümü yazılır.
   rev: iki pencere aynı anda yazarsa biri ötekini sessizce ezmesin.
   ═══════════════════════════════════════════════════════════════ */
const DURUM = { acik: 'Açık', beklemede: 'Beklemede', tamam: 'Tamamlandı', iptal: 'İptal' };
const DURUM_RENK = { acik: 'blue', beklemede: 'amber', tamam: 'green', iptal: 'gray' };
const TUR_AD = { talep: 'Talep', not: 'Not' };
const acikMi = k => k.durum === 'acik' || k.durum === 'beklemede';

function varsayilan() {
  return {
    surum: 1, sayac: {}, kayitlar: [], yoksay: [], hatirlaticilar: [], takipDisi: [], rehber: {},
    bildirim: { masaustu: {}, goruldu: {} },
    ayar: {
      yaklasanGun: 7, hatirlatGun: [3, 1, 0], gecikenHerGun: true, masaustu: true, kontrolDk: 15, saklamaAy: 0,
      adSoyad: '', sorumlular: [], varsayilanSorumlu: '', kategoriler: [],
      plan: { gunlukSaat: 6, gunler: [1, 2, 3, 4, 5], varsayilanSaat: 2 },
      sekteNedenleri: ['Bilgi / belge bekleniyor', 'Karşı taraf yanıt vermedi', 'Onay bekleniyor', 'Öncelik değişti / iş yükü', 'Kapsam değişti', 'Diğer'],
      posta: { kaynak: 'gelen', klasor: '', kategori: 'Assist', gun: 14, msgSakla: false, kategoriAta: false }
    }
  };
}
function birlestir(v) {
  const d = varsayilan();
  if (!v || typeof v !== 'object') return d;
  const o = Object.assign(d, v);
  o.ayar = Object.assign(varsayilan().ayar, v.ayar || {});
  o.ayar.posta = Object.assign(varsayilan().ayar.posta, (v.ayar || {}).posta || {});
  o.ayar.plan = Object.assign(varsayilan().ayar.plan, (v.ayar || {}).plan || {});
  o.hatirlaticilar = (o.hatirlaticilar || []).map(h => Object.assign({ ekler: [], gunler: [] }, h));
  o.rehber = Object.assign({}, v.rehber || {});
  o.bildirim = Object.assign({ masaustu: {}, goruldu: {} }, v.bildirim || {});
  o.kayitlar = (o.kayitlar || []).map(k => Object.assign({ postalar: [], aksiyonlar: [], gecmis: [] }, k));
  return o;
}
let V = varsayilan(), REV = 0, VERI_KOK = '';
async function yukle() {
  const j = await apiJson('/api/veri');
  REV = j.rev; VERI_KOK = j.veriKok || ''; V = birlestir(j.veri);
  // Aksiyon numarası sonradan geldi (A-yyyy-nnn): eski aksiyonlara bir kez verilir
  let d = false;
  V.kayitlar.forEach(k => k.aksiyonlar.forEach(a => { if (!a.no) { a.no = numaraVer('aksiyon'); d = true; } }));
  if (d) kaydet();
}
let kayitZinciri = Promise.resolve();
function kaydet() {
  kayitZinciri = kayitZinciri.then(async () => {
    const r = await api('/api/veri?rev=' + REV, { method: 'POST', body: JSON.stringify(V) });
    if (r.status === 409) {
      toast('Kayıtlar başka bir pencerede değişmiş; sayfa yenileniyor.', true);
      setTimeout(() => location.reload(), 1800);
      return;
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.hata || 'kaydedilemedi');
    REV = j.rev;
  }).catch(e => toast('Kaydedilemedi: ' + e.message, true));
  return kayitZinciri;
}
function numaraVer(tur) {
  const h = { talep: 'T', not: 'N', aksiyon: 'A', hatirlatici: 'H' }[tur], y = new Date().getFullYear(), a = h + y;
  V.sayac[a] = (V.sayac[a] || 0) + 1;
  return `${h}-${y}-${String(V.sayac[a]).padStart(3, '0')}`;
}
const kayitBul = id => V.kayitlar.find(k => k.id === id);

/* İş listesi: açık kayıtlar + açık aksiyonlar tek listede.
   Termin takibi ikisinde de aynı; ana ekran ve bildirimler bunu kullanır.
   'posta' kaydı yalnız postadan alınan aksiyonların taşıyıcısıdır, kendisi iş
   değildir; terminsiz not da iş sayılmaz (not listesinde durur). */
function isler() {
  const out = [];
  for (const k of V.kayitlar) {
    if (acikMi(k) && k.tur !== 'posta' && !(k.tur === 'not' && !k.termin)) out.push({ k, a: null, id: k.id, baslik: k.baslik, sorumlu: k.sorumlu, termin: k.termin, durum: k.durum });
    if (k.durum === 'iptal') continue;
    for (const a of k.aksiyonlar) if (a.durum !== 'tamam')
      out.push({ k, a, id: a.id, baslik: a.metin, sorumlu: a.sorumlu, termin: a.termin, durum: 'acik' });
  }
  return out;
}
function kova(t) {
  const g = gunFark(t);
  if (g === null) return 'yok';
  if (g < 0) return 'gecmis';
  if (g === 0) return 'bugun';
  return g <= V.ayar.yaklasanGun ? 'yaklasan' : 'ileri';
}
const terminSira = (a, b) => (a.termin || '9999') < (b.termin || '9999') ? -1 : (a.termin || '9999') > (b.termin || '9999') ? 1 : 0;
function kalanHtml(t) {
  const g = gunFark(t);
  if (g === null) return '';
  if (g < 0) return `<span class="kalan gecti">${-g} gün gecikti</span>`;
  if (g === 0) return '<span class="kalan yakin">Bugün</span>';
  if (g === 1) return '<span class="kalan yakin">Yarın</span>';
  return `<span class="kalan normal">${g} gün kaldı</span>`;
}
const durumHtml = d => `<span class="badge ${DURUM_RENK[d] || 'gray'}">${DURUM[d] || esc(d)}</span>`;
function aksDurumHtml(a) {
  if (a.durum === 'tamam') return '<span class="badge green">Kapandı</span>';
  const g = gunFark(a.termin);
  return g !== null && g < 0 ? '<span class="badge red">Gecikti</span>' : '<span class="badge blue">Açık</span>';
}
function postaDugme(k) {
  if (!k.postalar.length) return '';
  return `<button class="ikon-btn" data-posta-ac="${k.id}" title="Postayı Outlook'ta aç">${svg('posta')}</button>`;
}
const ozetHtml = k => k.ozet ? `<div class="ozet" title="${esc(k.ozet)}">${esc(k.ozet)}</div>` : '';
const oncelikHtml = k => k.oncelik === 'yuksek' ? '<span class="oncelik" title="Yüksek öncelik"></span>' : '';
// Kişi satırı: "Ad Soyad <eposta>" ya da yalnız ad. Alanlarda ad, iletimde e-posta kullanılır.
// Kişi satırı: "Ad Soyad <eposta> 2345" — e-posta (Teams) ve telefon/dahili (MiCollab) isteğe bağlı
function kisiAyir(x) {
  let s = String(x || '').trim(), eposta = '', tel = '';
  const t = s.match(/\s((?:\+|\(?\d)[\d\s()\-]{1,22}\d)\s*$/);   // sondaki numara
  if (t) { tel = t[1].trim(); s = s.slice(0, t.index).trim(); }
  const m = s.match(/^(.*?)\s*<\s*([^<>\s]+@[^<>\s]+)\s*>\s*$/);
  if (m) { s = m[1].trim() || m[2]; eposta = m[2]; }
  else if (/^[^\s@]+@[^\s@]+$/.test(s)) eposta = s;
  return { ad: s, eposta, tel };
}
const basHarf = ad => String(ad || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toLocaleUpperCase('tr-TR')).join('');
// Teams: msteams: bağlantısı masaüstü uygulamasını açar. Telefon: tel: bağlantısını
// bilgisayarda kayıtlı uygulama (MiCollab) açar ve numarayı çevirir.
// Tarayıcı değil SUNUCU açar: tarayıcının her seferki "uygulama açılsın mı" onayı çıkmaz.
async function iletisimAc(tur, deger, mesaj) {
  try { await apiJson('/api/iletisim', { method: 'POST', body: JSON.stringify({ tur, deger }) }); toast(mesaj); }
  catch (e) { toast(e.message, true); }
}
function teamsAc(tur, eposta) { iletisimAc(tur === 'chat' ? 'teams-yaz' : 'teams-ara', eposta, tur === 'chat' ? 'Teams sohbeti açılıyor…' : 'Teams araması başlıyor…'); }
function telefonAc(tel) { iletisimAc('tel', tel, `MiCollab arıyor: ${tel}`); }
// Kişi listesinde yalnız adı yazılanlar şirket rehberinden (Outlook) bir kez bulunur ve hatırlanır
const REHBER_SORULAN = new Set();
function rehberdenTamamla(L) {
  const eksik = L.filter(k => !k.eposta && !k.tel && !V.rehber[k.ad] && !REHBER_SORULAN.has(k.ad));
  if (!eksik.length) return;
  eksik.forEach(k => REHBER_SORULAN.add(k.ad));
  Promise.all(eksik.map(k => apiJson('/api/kisi/coz?ad=' + encodeURIComponent(k.ad))
    .then(j => { V.rehber[k.ad] = j.ok ? { eposta: j.eposta || '', tel: j.tel || '' } : { yok: true }; })
    .catch(() => {}))).then(() => { kaydet(); if (aktif === 'ana') kisilerCiz(); });
}
function kisiTam(k) { const r = V.rehber[k.ad]; return r && !r.yok ? { ad: k.ad, eposta: k.eposta || r.eposta, tel: k.tel || r.tel } : k; }
// Düğmeler uygulamaya göre gruplu: [Teams: Yaz Ara] ve [MiCollab: Ara] — iki "Ara" karışmasın
function micollabGrup(tel) {
  return `<span class="il-grup tel"><span class="il-etiket">MiCollab</span><button class="il-btn tel" data-tel="${esc(tel)}" title="MiCollab ile telefonla ara · ${esc(tel)}">${svg('telefon')}Ara</button></span>`;
}
function iletisimDugmeleri(k) {
  return '<span class="iletisim">' + (k.eposta ? `<span class="il-grup teams"><span class="il-etiket">Teams</span>` +
    `<button class="il-btn teams" data-teams-yaz="${esc(k.eposta)}" title="Teams'te yaz">${svg('sohbet')}Yaz</button>` +
    `<button class="il-btn teams" data-teams-ara="${esc(k.eposta)}" title="Teams'te sesli ara">${svg('telefon')}Ara</button></span>` : '') +
    (k.tel ? micollabGrup(k.tel) : '') + '</span>';
}
/* ── Kişiler kartı: sabitlenenler (yıldız) üstte + tam rehber (MiCollab + Outlook +
   şirket rehberi, sunucuda birleşir). Arama yazdıkça daralır. ── */
let REHBER = null, REHBER_YUKLENIYOR = false, KISI_Q = '';
async function rehberYukle(yenile) {
  if (REHBER_YUKLENIYOR) return;
  REHBER_YUKLENIYOR = true;
  if (!REHBER || yenile) $('#anaKisiler').innerHTML = '<div class="yukleniyor">MiCollab, Outlook ve şirket rehberinden kişiler alınıyor…</div>';
  try { REHBER = (await apiJson('/api/rehber' + (yenile ? '?yenile=1' : ''))).rehber.kisiler || []; }
  catch (e) { REHBER = REHBER || []; toast('Kişiler alınamadı: ' + e.message, true); }
  REHBER_YUKLENIYOR = false;
  kisilerCiz();
}
const kisiAnahtar = k => k.eposta ? 'e:' + trK(k.eposta) : 'a:' + trK(k.ad);
function sabitMi(k) { return kisiler().some(s => (s.eposta && k.eposta && trK(s.eposta) === trK(k.eposta)) || trK(s.ad) === trK(k.ad)); }
function kisiSabitle(k) {
  const satir = `${k.ad}${k.eposta ? ` <${k.eposta}>` : ''}${k.tel ? ' ' + k.tel : ''}`;
  if (sabitMi(k)) V.ayar.sorumlular = V.ayar.sorumlular.filter(x => { const s = kisiAyir(x); return !((s.eposta && k.eposta && trK(s.eposta) === trK(k.eposta)) || trK(s.ad) === trK(k.ad)); });
  else V.ayar.sorumlular.push(satir);
  kaydet(); dlSorumluDoldur(); kisilerCiz();
}
function kisilerCiz() {
  const sabit = kisiler();
  rehberdenTamamla(sabit);
  if (REHBER === null && !REHBER_YUKLENIYOR) rehberYukle();
  // Sabitlenenler üstte (rehber bilgisiyle tamamlanmış), ardından rehberdeki herkes
  const gorulen = new Set(), L = [];
  sabit.map(kisiTam).forEach(k => { const r = (REHBER || []).find(x => (k.eposta && x.eposta && trK(x.eposta) === trK(k.eposta)) || trK(x.ad) === trK(k.ad));
    const t = { ad: k.ad, eposta: k.eposta || (r && r.eposta) || '', tel: k.tel || (r && r.tel) || '', sabit: true };
    L.push(t); gorulen.add(kisiAnahtar(t)); if (r) gorulen.add(kisiAnahtar(r)); });
  (REHBER || []).forEach(r => { if (!gorulen.has(kisiAnahtar(r))) L.push(Object.assign({ sabit: false }, r)); });
  // Ulaşılabilir olanlar (e-posta ya da numara) ve aramaya uyanlar. Numara boşluksuz da eşleşir ("2 345" = "2345").
  const U = L.filter(k => k.eposta || k.tel || k.sabit), rakam = s => String(s || '').replace(/\D/g, '');
  const qRakam = rakam(KISI_Q), numaraMi = /^[\d\s()+\-]{2,}$/.test(KISI_Q);
  const G = U.filter(k => metinUygun(KISI_Q, k.ad, k.eposta, k.tel) || (qRakam.length >= 2 && rakam(k.tel).includes(qRakam)));
  $('#anaKisiSay').textContent = G.length === U.length ? U.length : `${G.length} / ${U.length}`;
  if (REHBER === null && !sabit.length) return;   // ilk yükleme sürüyor
  // Listede olmayan bir numara yazıldıysa doğrudan arama düğmesi
  const dogrudan = numaraMi && qRakam.length >= 2
    ? `<div class="kisi dogrudan"><span class="kisi-bas">${svg('telefon')}</span><div class="kisi-ad"><b>${esc(KISI_Q)}</b><span>Bu numarayı MiCollab ile ara</span></div>` +
      `<span class="iletisim">${micollabGrup(KISI_Q)}</span></div>` : '';
  $('#anaKisiler').innerHTML = dogrudan + (G.length ? `<div class="kisi-liste">${G.map((k, i) =>
    `<div class="kisi${k.sabit ? ' sabit' : ''}"><button class="kisi-yildiz" data-kisi-sabit="${i}" title="${k.sabit ? 'Sabitlemeyi kaldır' : 'Üste sabitle'}">${k.sabit ? '★' : '☆'}</button>` +
    `<span class="kisi-bas">${esc(basHarf(k.ad))}</span><div class="kisi-ad"><b>${esc(k.ad)}</b><span>${esc([k.eposta, k.tel].filter(Boolean).join(' · '))}</span></div>${iletisimDugmeleri(k)}</div>`).join('')}</div>`
    : `<div class="bos" style="padding:10px">${KISI_Q ? 'Aramaya uyan kişi yok.' : 'Kişi bulunamadı.'}</div>`);
  KISI_GORUNEN = G;
}
function kisiPanel(ac) {

let KISI_GORUNEN = [];

/* ═══════════════════════════════════════════════════════════════
   GEZİNME

const GORUNUMLER = ['ana', 'talep', 'not', 'aksiyon', 'posta', 'plan', 'hat', 'oda', 'ayar'];
let aktif = 'ana';
function git(v) {
  if (!GORUNUMLER.includes(v)) v = 'ana';
  aktif = v;
  $('#thMenu').classList.remove('acik');
  $$('.view').forEach(e => e.classList.toggle('active', e.id === 'v-' + v));
  $$('.sn-item').forEach(e => e.classList.toggle('active', e.dataset.v === v));

}
function ciz(v = aktif) {

  else if (v === 'aksiyon') aksiyonListeCiz();

  else if (v === 'plan') planCiz();

// Ana ekran başlığı: Ayarlar'daki ad > kurumsal hesap / Outlook adı
let KULLANICI_AD = '';
function hosgeldinYaz() { const ad = V.ayar.adSoyad || KULLANICI_AD; $('#anaHosgeldin').textContent = ad ? `Hoş Geldin ${ad}` : 'Hoş Geldin'; }
/* ═══ DEFTER (Notlar > Defter) ═════════════════════════════════════
   Diğer notlardan ayrı: her gün için serbest yazı sayfası (gerekli gereksiz günlük
   notlar). Yazdıkça kaydedilir (V.defter = { 'yyyy-aa-gg': metin }, şifreli veriyle
   birlikte). Boşaltılan sayfa silinir; sayfa ya da gün listesinden silinebilir. */
let DEFTER_GUN = new Date(), DEFTER_ZAMAN = 0;
const defterIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function defterTarih(iso, uzun) {
  const [y, a, g] = iso.split('-').map(Number), d = new Date(y, a - 1, g);
  const GUN = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  return `${String(g).padStart(2, '0')}.${String(a).padStart(2, '0')}.${y}` + (uzun ? ' ' + GUN[d.getDay()] : '');
}
function notSekme(s) {
  const kok = $('#v-not');
  $$('[data-not-sekme]', kok).forEach(b => b.classList.toggle('acik', b.dataset.notSekme === s));
  $('.ara-duzen', kok).style.display = s === 'defter' ? 'none' : '';   // .ara-duzen display:grid, hidden'ı ezer
  $('#defterKutu').hidden = s !== 'defter';
  if (s === 'defter') defterCiz();
}
function defterListeHtml(gun) {
  const gunler = Object.keys(V.defter).filter(k => V.defter[k].trim()).sort().reverse();
  return '<div class="ara-baslik" style="padding:12px 14px 6px">Sayfalar</div>' + (gunler.length ? gunler.map(k => {
    const ilk = V.defter[k].trim().split('\n')[0];
    return `<div class="defter-gun${k === gun ? ' acik' : ''}" data-defter-git="${k}"><div><b>${defterTarih(k, true)}</b><span>${esc(ilk.length > 60 ? ilk.slice(0, 60) + '…' : ilk)}</span></div>` +
      `<button class="ikon-btn" data-defter-sil="${k}" title="Bu günün sayfasını sil">${svg('cop')}</button></div>`;
  }).join('') : '<div class="bos" style="padding:14px">Henüz sayfa yok.</div>');
}
function defterCiz() {
  V.defter = V.defter || {};
  const gun = defterIso(DEFTER_GUN), bugun = gun === defterIso(new Date());
  $('#defterKutu').innerHTML = `<div class="defter">
    <aside class="card defter-liste">${defterListeHtml(gun)}</aside>
    <div class="card defter-sayfa">
      <div class="oda-ust">
        <button class="btn sm" data-defter-kay="-1" title="Önceki gün">‹</button>
        <b class="oda-tarih">${defterTarih(gun, true)}</b>
        <button class="btn sm" data-defter-kay="1" title="Sonraki gün">›</button>
        ${bugun ? '' : '<button class="btn sm" data-defter-kay="0">Bugün</button>'}
        <span class="defter-durum" id="defterDurum"></span>
        ${V.defter[gun] ? `<button class="btn sm" data-defter-sil="${gun}" style="margin-left:8px">${svg('cop')}Sayfayı sil</button>` : ''}
      </div>
      <textarea id="defterMetin" class="defter-metin" placeholder="Bugün aklınıza gelenleri yazın…" spellcheck="true">${esc(V.defter[gun] || '')}</textarea>
    </div></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-not-sekme],[data-defter-kay],[data-defter-git],[data-defter-sil]');
  if (!t || !t.closest('#v-not')) return;
  if (t.dataset.notSekme) return notSekme(t.dataset.notSekme);
  if (t.dataset.defterSil) {
    e.stopPropagation();
    if (!confirm(`${defterTarih(t.dataset.defterSil, true)} sayfası silinsin mi?`)) return;
    delete V.defter[t.dataset.defterSil]; kaydet(); toast('Sayfa silindi.'); return defterCiz();
  }
  if (t.dataset.defterGit) { const [y, a, g] = t.dataset.defterGit.split('-').map(Number); DEFTER_GUN = new Date(y, a - 1, g); return defterCiz(); }
  if (t.dataset.defterKay !== undefined) {
    const k = +t.dataset.defterKay;
    DEFTER_GUN = k === 0 ? new Date() : new Date(DEFTER_GUN.getFullYear(), DEFTER_GUN.getMonth(), DEFTER_GUN.getDate() + k);

  }
});
// Yazdıkça kaydet (0,8 sn bekleyip); boşaltılan sayfa defterden çıkar
document.addEventListener('input', e => {
  if (e.target.id !== 'defterMetin') return;

});

/* ═══ TOPLANTI ODALARI ════════════════════════════════════════════
   Odalar ve doluluk Outlook'tan (Exchange "All Rooms", 30 dk dilim). Boş dilime
   tıklanır → konu + bitiş seçilir → Outlook'ta oda eklenmiş davet HAZIR açılır;
   Gönder'e kullanıcı basar (Assist kendisi göndermez). Saatler 08:00–19:00. */
const ODA_ILK = 16, ODA_SON = 38;            // dilim no: 16 = 08:00, 38 = 19:00 (hariç)
let ODA_GUN = new Date(), ODA = null, ODA_SEC = null, ODA_YUK = false;
const odaIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const odaSaat = n => `${String(Math.floor(n / 2)).padStart(2, '0')}:${n % 2 ? '30' : '00'}`;
const odaKisa = ad => String(ad).replace(/^\s*\d+\.?\s*Kat\s*/i, '').replace(/\s*Toplant[ıi]\s*Odas[ıi]\s*$/i, '') || ad;
const odaKat = ad => { const m = String(ad).match(/(\d+)\.?\s*Kat/i); return m ? `${m[1]}. kat` : ''; };
async function odaYukle() {
  ODA_YUK = true; odaCiz();
  try { ODA = await apiJson('/api/oda?gun=' + odaIso(ODA_GUN)); }
  catch (e) { ODA = { hata: e.message }; }
  ODA_YUK = false; if (aktif === 'oda') odaCiz();
}
function odaCiz() {
  const kutu = $('#v-oda');
  if (!ODA && !ODA_YUK) { odaYukle(); return; }
  const bugun = odaIso(new Date()) === odaIso(ODA_GUN), simdiDilim = new Date().getHours() * 2 + (new Date().getMinutes() >= 30 ? 1 : 0);
  const GUNAD = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  const baslik = `${String(ODA_GUN.getDate()).padStart(2, '0')}.${String(ODA_GUN.getMonth() + 1).padStart(2, '0')}.${ODA_GUN.getFullYear()} ${GUNAD[ODA_GUN.getDay()]}`;
  let govde;
  if (ODA_YUK) govde = '<div class="yukleniyor">Odaların doluluğu Outlook\'tan alınıyor…</div>';
  else if (ODA.hata) govde = `<div class="note warn">Odalar alınamadı: ${esc(ODA.hata)}</div>`;
  else if (!ODA.odalar.length) govde = '<div class="bos">Outlook\'ta toplantı odası listesi ("All Rooms") bulunamadı.</div>';
  else {
    const saatler = []; for (let n = ODA_ILK; n < ODA_SON; n += 2) saatler.push(`<th colspan="2">${odaSaat(n)}</th>`);
    govde = `<div class="oda-tablo-sar"><table class="oda-tablo"><thead><tr><th class="oda-ad-b">Oda</th>${saatler.join('')}</tr></thead><tbody>` +
      ODA.odalar.map((o, i) => {
        let h = '';
        for (let n = ODA_ILK; n < ODA_SON; n++) {
          const d = o.dilim[n] || '0', gecti = bugun && n < simdiDilim;
          // Sınıf adları od-* : sayfanın genel .bos (boş liste) stili hücreleri bozmasın
          const sinif = gecti ? 'od-gecti' : d === '0' ? 'od-bos' : d === '1' ? 'od-bel' : 'od-dolu';
          const sec = ODA_SEC && ODA_SEC.i === i && n >= ODA_SEC.bas && n < ODA_SEC.bit ? ' secili' : '';
          const ipucu = `${odaSaat(n)}–${odaSaat(n + 1)} · ` + { 'od-bos': 'Boş', 'od-gecti': 'Geçti', 'od-bel': 'Belirsiz', 'od-dolu': 'Dolu' }[sinif];
          h += `<td class="oda-d ${sinif}${sec}${n % 2 ? '' : ' yarim'}" ${sinif === 'od-bos' ? `data-oda="${i}" data-dilim="${n}"` : ''} title="${ipucu}"></td>`;
        }
        return `<tr><td class="oda-ad"><b>${esc(odaKisa(o.ad))}</b><span>${esc(odaKat(o.ad))}</span></td>${h}</tr>`;
      }).join('') + '</tbody></table></div>' +
      '<div class="oda-lejant"><span><i class="od-bos"></i>Boş</span><span><i class="od-dolu"></i>Dolu</span><span><i class="od-bel"></i>Belirsiz</span><span><i class="od-sec"></i>Seçili</span></div>' +
      odaFormHtml();
  }
  kutu.innerHTML = `<div class="vhead"><h1>Toplantı Odaları</h1></div>
    <div class="card"><div class="oda-ust">
      <button class="btn sm" data-oda-gun="-1" title="Önceki gün">‹</button>
      <b class="oda-tarih">${baslik}</b>
      <button class="btn sm" data-oda-gun="1" title="Sonraki gün">›</button>
      ${bugun ? '' : '<button class="btn sm" data-oda-gun="0">Bugün</button>'}
      <button class="btn sm" data-oda-yenile style="margin-left:auto">${svg('yenile')}Yenile</button>
    </div>${govde}</div>`;
}
function odaFormHtml() {
  if (!ODA_SEC) return '<div class="oda-ipucu">Rezerve etmek için boş bir saate tıklayın.</div>';
  const o = ODA.odalar[ODA_SEC.i];
  let enGec = ODA_SEC.bas + 1;   // seçilen başlangıçtan sonraki ilk dolu dilime kadar
  while (enGec < ODA_SON && (o.dilim[enGec] || '0') === '0') enGec++;
  const secenek = []; for (let n = ODA_SEC.bas + 1; n <= enGec; n++) secenek.push(`<option value="${n}" ${n === ODA_SEC.bit ? 'selected' : ''}>${odaSaat(n)}</option>`);
  return `<div class="oda-form">
    <div class="oda-form-baslik"><b>${esc(odaKisa(o.ad))}</b> · ${odaSaat(ODA_SEC.bas)} – <select id="odaBit">${secenek.join('')}</select></div>
    <input id="odaKonu" placeholder="Toplantı konusu" value="${esc(ODA_SEC.konu || '')}">
    <button class="btn primary" data-oda-rezerve>Rezerve et</button>
    <button class="btn" data-oda-vazgec>Vazgeç</button>
    <div class="oda-not">Outlook'ta oda eklenmiş davet açılır; katılımcıları ekleyip Gönder'e basınca oda rezerve edilir.</div></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-oda],[data-oda-gun],[data-oda-yenile],[data-oda-rezerve],[data-oda-vazgec]');
  if (!t || !t.closest('#v-oda')) return;
  if (t.dataset.odaGun !== undefined) {
    const k = +t.dataset.odaGun; ODA_GUN = k === 0 ? new Date() : new Date(ODA_GUN.getFullYear(), ODA_GUN.getMonth(), ODA_GUN.getDate() + k);
    ODA_SEC = null; return odaYukle();
  }
  if (t.hasAttribute('data-oda-yenile')) { ODA_SEC = null; return odaYukle(); }
  if (t.hasAttribute('data-oda-vazgec')) { ODA_SEC = null; return odaCiz(); }
  if (t.dataset.oda !== undefined) {
    const i = +t.dataset.oda, n = +t.dataset.dilim, o = ODA.odalar[i];
    const konu = ODA_SEC ? ($('#odaKonu') || {}).value : '';
    // Varsayılan 1 saat; sonraki dilim doluysa yarım saat
    ODA_SEC = { i, bas: n, bit: (n + 1 < ODA_SON && (o.dilim[n + 1] || '0') === '0') ? n + 2 : n + 1, konu };
    odaCiz(); setTimeout(() => $('#odaKonu') && $('#odaKonu').focus(), 30); return;
  }
  if (t.hasAttribute('data-oda-rezerve')) {
    const o = ODA.odalar[ODA_SEC.i], bit = +$('#odaBit').value, konu = $('#odaKonu').value.trim();
    if (!konu) { toast('Toplantı konusunu yazın.', true); return $('#odaKonu').focus(); }
    const gun = odaIso(ODA_GUN), saatIso = n => `${gun}T${odaSaat(n)}`;
    apiJson('/api/oda/rezerve', { method: 'POST', body: JSON.stringify({ eposta: o.eposta, bas: saatIso(ODA_SEC.bas), bit: saatIso(bit), konu }) })
      .then(() => { toast(`${odaKisa(o.ad)} için davet Outlook'ta açıldı — Gönder'e basınca rezerve olur.`); ODA_SEC = null; odaCiz(); })
      .catch(er => toast(er.message, true));
  }
});
document.addEventListener('change', e => { if (e.target.id === 'odaBit' && ODA_SEC) { ODA_SEC.bit = +e.target.value; ODA_SEC.konu = $('#odaKonu').value; odaCiz(); } });

/* ── HAVA DURUMU: Open-Meteo (anahtar gerekmez). Tarayıcı yalnız şehrin koordinatını
   gönderir; kişisel veri gitmez. 30 dakikada bir tazelenir, ulaşılamazsa kutu gizlenir. ── */
const HAVA_VARS = { ad: 'İstanbul', lat: 41.0082, lon: 28.9784 };
function havaTur(kod, gunduz) {
  if (kod === 0) return { ad: 'Açık', s: gunduz === 0 ? 'ay' : 'gunes' };
  if (kod <= 2) return { ad: 'Parçalı bulutlu', s: gunduz === 0 ? 'ay' : 'parcali' };
  if (kod === 3) return { ad: 'Kapalı', s: 'bulut' };
  if (kod <= 48) return { ad: 'Sisli', s: 'sis' };
  if (kod <= 67 || (kod >= 80 && kod <= 82)) return { ad: kod <= 57 ? 'Çisenti' : 'Yağmurlu', s: 'yagmur' };
  if (kod <= 77 || kod === 85 || kod === 86) return { ad: 'Karlı', s: 'kar' };
  return { ad: 'Gök gürültülü', s: 'firtina' };
}
function havaSvg(s) {
  const gunes = '<circle cx="12" cy="12" r="4.2" fill="#F5B301"/><g stroke="#F5B301" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g>';
  const bulut = (x = 0, y = 0, r = '#A9B4C2') => `<path transform="translate(${x} ${y})" d="M7 18.5h10.2a3.8 3.8 0 0 0 .4-7.6A5.4 5.4 0 0 0 7.3 9.6 4.5 4.5 0 0 0 7 18.5z" fill="${r}"/>`;
  const damla = (c) => `<g stroke="${c}" stroke-width="1.8" stroke-linecap="round"><path d="M9 20.5l-1 2M13 20.5l-1 2M17 20.5l-1 2"/></g>`;
  const ic = {
    gunes, ay: '<path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.2A7 7 0 0 1 15.5 3.5z" fill="#8A97B0"/>',
    parcali: '<g transform="translate(-3 -3) scale(.8)">' + gunes + '</g>' + bulut(1, 1),
    bulut: bulut(0, 0, '#93A0B0'),
    sis: bulut(0, -3, '#B5BEC9') + '<g stroke="#B5BEC9" stroke-width="1.8" stroke-linecap="round"><path d="M5 19h14M7 22h10"/></g>',
    yagmur: bulut(0, -3, '#8C99AA') + damla('#3B82C4'),
    kar: bulut(0, -3, '#A9B4C2') + '<g fill="#7FB3E0"><circle cx="9" cy="21" r="1.2"/><circle cx="13" cy="22" r="1.2"/><circle cx="17" cy="21" r="1.2"/></g>',
    firtina: bulut(0, -3, '#6E7B8C') + '<path d="M13 15.5l-3 4h3l-2 4" fill="none" stroke="#F5B301" stroke-width="1.8" stroke-linejoin="round"/>'
  }[s];
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg>`;
}
let HAVA_ZAMAN = 0;
async function havaYukle() {
  clearTimeout(HAVA_ZAMAN); HAVA_ZAMAN = setTimeout(havaYukle, 30 * 60 * 1000);
  const k = (V && V.ayar && V.ayar.havaKonum) || HAVA_VARS, kutu = $('#anaHava');
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${k.lat}&longitude=${k.lon}` +
      '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=4&timezone=auto');
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(), c = j.current, d = j.daily, t = havaTur(c.weather_code, c.is_day);
    const GUN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    kutu.innerHTML = `<div class="hava-simdi" title="${esc(t.ad)}">${havaSvg(t.s)}<span class="hava-derece">${Math.round(c.temperature_2m)}°</span>` +
      `<span class="hava-yer"><b>${esc(k.ad)}</b>${esc(t.ad)} · ${Math.round(d.temperature_2m_min[0])}° / ${Math.round(d.temperature_2m_max[0])}°</span></div>` +
      '<div class="hava-gunler">' + [1, 2, 3].map(i => { const g = havaTur(d.weather_code[i], 1);
        return `<span class="hava-gun" title="${esc(g.ad)}">${GUN[new Date(d.time[i] + 'T12:00').getDay()]}${havaSvg(g.s)}<b>${Math.round(d.temperature_2m_max[i])}°</b>${Math.round(d.temperature_2m_min[i])}°</span>`; }).join('') + '</div>';
    kutu.hidden = false;

  if (!confirm(`${k.no} notu silinsin mi?`)) return;
  V.kayitlar = V.kayitlar.filter(x => x.id !== id);
  kaydet(); hepsiniCiz(); toast('Not silindi.');
}

/* ── AKSİYON PENCERESİ: alınacak aksiyon + alınan aksiyon, kapat ── */
let AK = null;
function aksiyonAc(kid, aid) {
  const k = kayitBul(kid), a = k && k.aksiyonlar.find(x => x.id === aid);
  if (!a) return;
  AK = { k, a };
  const kapali = a.durum === 'tamam', posta = k.postalar[k.postalar.length - 1];
  $('#maBaslik').innerHTML = `<span class="no">${esc(a.no || '')}</span>Aksiyon`;
  $('#maDurum').innerHTML = aksDurumHtml(a);
  $('#maGovde').innerHTML = `
    <div class="posta-ust"><h4>${esc(k.baslik)}</h4>${k.kimden ? `<b>${esc(k.kimden)}</b>` : ''}${k.tur !== 'posta' ? ` · ${esc(k.no)}` : ''}
      ${posta ? `<button class="btn sm" id="maPosta" style="margin-left:8px">${svg('posta')}Postayı aç</button>` : ''}</div>
    <div class="field"><label>Alınacak aksiyon</label><textarea id="maMetin" rows="2">${esc(a.metin)}</textarea></div>
    <div class="grid2">
      <div class="field"><label>Sorumlu</label><input id="maSorumlu" list="dlSorumlu" value="${esc(a.sorumlu || '')}"></div>
      <div class="field"><label>Termin</label><input type="date" id="maTermin" value="${esc(a.termin || '')}"></div>
      <div class="field"><label>Önem</label><select id="maOnem"><option value="normal">Normal</option><option value="yuksek">Yüksek</option></select></div>
      <div class="field"><label>Tahmini süre (saat)</label><input type="number" id="maTahmini" min="0" step="0.5" value="${a.tahminiSaat || ''}">${tahminIpucu(a.metin + ' ' + k.baslik, k.kimden)}</div>
    </div>
    <div class="bolum"><div class="bolum-h"><h4>Alınan aksiyon</h4></div>
      <div class="field"><textarea id="maAlinan" rows="3">${esc(a.alinan || '')}</textarea></div>
      <div class="grid2">
        <div class="field"><label>Tarih</label><input type="date" id="maAlinanTarih" value="${esc(a.alinanTarih || bugun())}"></div>
        <div class="field"><label>Harcanan süre (saat)</label><input type="number" id="maHarcanan" min="0" step="0.5" value="${a.harcananSaat || ''}"></div>
        <div class="field"><label>Sekteye uğradıysa neden</label><select id="maSekte"><option value="">—</option>${
          [...new Set([...V.ayar.sekteNedenleri, a.sekteNeden].filter(Boolean))].map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
        <div class="field"><label>Açıklama</label><input id="maSekteAcik" value="${esc(a.sekteAciklama || '')}"></div>
      </div>
    </div>`;
  $('#maOnem').value = a.onem || 'normal';
  $('#maSekte').value = a.sekteNeden || '';
  $('#maSil').style.display = ''; $('#maKapat').style.display = '';   // yeni aksiyon penceresi gizlemiş olabilir
  $('#maKapat').textContent = kapali ? 'Yeniden aç' : 'Aksiyonu kapat';
  $('#maKapat').className = kapali ? 'btn' : 'btn danger';
  $('#mAks').classList.add('show');
}
// Öğrenilen tahmin, dayanağıyla birlikte (kaç benzer iş). Yeterli veri yoksa hiçbir şey yazmaz.
function tahminIpucu(metin, kimden) {
  modelKur();
  const t = tahmin(metin, kimden);
  if (!t) return '';
  const p = [];
  if (t.saat) p.push(`~${saatYaz(t.saat)} (${t.saatN} benzer iş)`);
  p.push(`benzer ${t.n} iş ortanca ${t.gun} iş gününde kapandı`);
  return `<div class="ipucu ogr">Öğrenilen: ${p.join(' · ')}</div>`;
}
/* Yeni aksiyon (Aksiyonlar listesinden): tek başına ya da seçilen bir talebe bağlı.
   Tek başına olan, postadan alınan aksiyonlarla aynı taşıyıcıya ('posta' kaydı,
   postasız) konur — iş listesi, plan, bildirim ve saklama kuralları aynen geçerli. */
function aksiyonYeni() {
  const z = simdi();
  const k = { id: uid(), tur: 'posta', no: '', baslik: '', ozet: '', kimden: '', kimdenEposta: '', sorumlu: '', termin: '', oncelik: 'normal',
    kategori: '', durum: 'acik', postalar: [], aksiyonlar: [], gecmis: [], olusturma: z, guncelleme: z, kapanis: '' };
  const a = { id: uid(), no: '', metin: '', sorumlu: V.ayar.varsayilanSorumlu || '', termin: '', onem: 'normal', tahminiSaat: '', durum: 'acik', olusturma: z };
  AK = { k, a, yeni: true };
  const talepler = V.kayitlar.filter(x => x.tur === 'talep' && acikMi(x)).sort((x, y) => (y.olusturma || '').localeCompare(x.olusturma || ''));
  $('#maBaslik').textContent = 'Yeni Aksiyon';
  $('#maDurum').innerHTML = '';
  $('#maGovde').innerHTML = `
    <div class="field"><label>Alınacak aksiyon</label><textarea id="maMetin" rows="2"></textarea></div>
    <div class="grid2">
      <div class="field"><label>Sorumlu</label><input id="maSorumlu" list="dlSorumlu" value="${esc(a.sorumlu)}"></div>
      <div class="field"><label>Termin</label><input type="date" id="maTermin"></div>
      <div class="field"><label>Önem</label><select id="maOnem"><option value="normal">Normal</option><option value="yuksek">Yüksek</option></select></div>
      <div class="field"><label>Tahmini süre (saat)</label><input type="number" id="maTahmini" min="0" step="0.5"></div>
      ${talepler.length ? `<div class="field tam"><label>Bağlı talep (isteğe bağlı)</label><select id="maHedef"><option value="">—</option>${
        talepler.map(t => `<option value="${t.id}">${esc(t.no)} · ${esc(t.baslik)}</option>`).join('')}</select></div>` : ''}
    </div>`;
  $('#maSil').style.display = 'none'; $('#maKapat').style.display = 'none';
  $('#mAks').classList.add('show');
  setTimeout(() => $('#maMetin').focus(), 30);
}
function aksiyonFormOku() {
  const { k, a } = AK, z = simdi();
  const deger = id => $(id) ? $(id).value : '';
  const sayi = id => { const v = parseFloat((deger(id) || '').replace(',', '.')); return v > 0 ? Math.round(v * 10) / 10 : ''; };
  const yeni = { metin: deger('#maMetin').trim(), sorumlu: deger('#maSorumlu').trim(), termin: deger('#maTermin'),
    onem: deger('#maOnem') || 'normal', tahminiSaat: sayi('#maTahmini') };
  // Kapatma bölümü yalnız mevcut aksiyonda var
  if ($('#maAlinan')) Object.assign(yeni, { alinan: deger('#maAlinan').trim(), alinanTarih: deger('#maAlinanTarih'),
    harcananSaat: sayi('#maHarcanan'), sekteNeden: deger('#maSekte'), sekteAciklama: deger('#maSekteAcik').trim() });
  if (!yeni.metin) { toast('Alınacak aksiyon boş olamaz.', true); $('#maMetin').focus(); return false; }
  if (AK.yeni) { Object.assign(a, yeni); return true; }
  if ((a.termin || '') !== yeni.termin) k.gecmis.push({ t: z, m: `${a.no} termin: ${trTarih(a.termin) || '—'} → ${trTarih(yeni.termin) || '—'}` });
  if ((a.sorumlu || '') !== yeni.sorumlu) k.gecmis.push({ t: z, m: `${a.no} sorumlu: ${a.sorumlu || '—'} → ${yeni.sorumlu || '—'}` });
  Object.assign(a, yeni);
  k.guncelleme = z;
  return true;
}
// Satır/bildirim tıklaması: aksiyonsa aksiyon penceresi, değilse kayıt penceresi
function kaydiAc(kid, aid) { if (aid) aksiyonAc(kid, aid); else kayitAc(kid); }
function aksiyonPencereKapat() { $('#mAks').classList.remove('show'); AK = null; }
function aksiyonKaydet() {
  if (!aksiyonFormOku()) return;
  if (AK.yeni) {
    let { k, a } = AK;
    const z = simdi(), hedef = $('#maHedef') && $('#maHedef').value ? kayitBul($('#maHedef').value) : null;
    a.no = numaraVer('aksiyon');
    if (hedef) k = hedef;
    else { k.baslik = ''; V.kayitlar.push(k); }
    k.aksiyonlar.push(a);
    k.gecmis.push({ t: z, m: `${a.no} eklendi: ${a.metin}` });
    k.guncelleme = z;
    const no = a.no;
    aksiyonPencereKapat(); kaydet(); hepsiniCiz();
    return toast(`${no} kaydedildi.` + (hedef ? ` (${hedef.no})` : ''));
  }
  aksiyonPencereKapat(); kaydet(); hepsiniCiz(); toast('Aksiyon kaydedildi.');
}
function aksiyonKapatAc() {
  const { k, a } = AK;
  if (!aksiyonFormOku()) return;
  if (a.durum === 'tamam') {
    a.durum = 'acik'; a.tamamTarih = '';
    k.gecmis.push({ t: simdi(), m: `${a.no} yeniden açıldı` });
  } else {
    if (!a.alinan) { toast('Önce alınan aksiyonu yazın.', true); $('#maAlinan').focus(); return; }
    a.durum = 'tamam'; a.tamamTarih = simdi(); if (!a.alinanTarih) a.alinanTarih = bugun();
    k.gecmis.push({ t: simdi(), m: `${a.no} kapandı: ${a.alinan}` });
  }
  const no = a.no, kapandi = a.durum === 'tamam';
  aksiyonPencereKapat(); kaydet(); hepsiniCiz(); toast(`${no} ${kapandi ? 'kapandı' : 'yeniden açıldı'}.`);
}
function aksiyonSil() {
  const { k, a } = AK;
  if (!confirm(`${a.no} silinsin mi?`)) return;
  k.aksiyonlar = k.aksiyonlar.filter(x => x.id !== a.id);
  // Postadan alınan aksiyonların taşıyıcısı boş kaldıysa o da gider
  if (k.tur === 'posta' && !k.aksiyonlar.length) V.kayitlar = V.kayitlar.filter(x => x.id !== k.id);
  aksiyonPencereKapat(); kaydet(); hepsiniCiz(); toast('Aksiyon silindi.');
}
function aksiyonTamamla(k, a, tamam) {
  a.durum = tamam ? 'tamam' : 'acik';
  a.tamamTarih = tamam ? simdi() : '';
  k.gecmis.push({ t: simdi(), m: `Aksiyon ${tamam ? 'tamamlandı' : 'yeniden açıldı'}: ${a.metin}` });
  k.guncelleme = simdi();
}

/* ═══════════════════════════════════════════════════════════════
   KAYIT PENCERESİ (talep / not + aksiyonlar + postalar)
   Değişiklikler kopya üzerinde yapılır; "Kaydet" ile işlenir.
   ═══════════════════════════════════════════════════════════════ */
let K = null, K_ORJ = '', K_YENI = false, TERMIN_IPUCU = '';
function kayitYeni(tur, ek) {
  TERMIN_IPUCU = '';
  K = Object.assign({ id: uid(), tur, no: '', baslik: '', ozet: '', kimden: '', kimdenEposta: '', sorumlu: V.ayar.varsayilanSorumlu || '',
    termin: '', oncelik: 'normal', kategori: '', durum: 'acik', postalar: [], aksiyonlar: [], gecmis: [], olusturma: '', guncelleme: '', kapanis: '' }, ek || {});
  K_YENI = true; kayitPencere();
}
function kayitAc(id, aksiyonId) {
  const k = kayitBul(id); if (!k) return;
  K = JSON.parse(JSON.stringify(k)); K_YENI = false; TERMIN_IPUCU = ''; kayitPencere(aksiyonId);
}
function kayitPencere(vurgu) {
  const k = K, talep = k.tur === 'talep', not = k.tur === 'not';
  $('#mkBaslik').innerHTML = K_YENI ? `Yeni ${TUR_AD[k.tur]}` : `<span class="no">${esc(k.no)}</span>${esc(k.baslik)}`;
  $('#mkDurum').innerHTML = K_YENI || not ? '' : durumHtml(k.durum);
  $('#mkSil').style.display = K_YENI ? 'none' : '';
  $('#mkIlet').style.display = k.tur !== 'talep' ? 'none' : '';   // yeni talepte de: iletirken numara alınıp kaydedilir
  $('#mkNotKapat').style.display = K_YENI || !not ? 'none' : '';
  $('#mkNotKapat').lastChild.textContent = acikMi(k) ? 'Notu kapat' : 'Yeniden aç';
  const kat = V.ayar.kategoriler;
  // Not sade: başlık, kimden (postadan geldiyse), not metni, posta. Termin/sorumlu/durum yok.
  $('#mkGovde').innerHTML = `<div id="kIletPanel"></div>
    ${K_YENI ? `<div class="doldur"><span>E-postadan doldur</span>
      <button class="btn sm" id="kSecili">${svg('posta')}Outlook'ta seçili posta</button>
      <button class="btn sm" id="kListe">Listeden seç</button></div>` : ''}
    <div class="grid2">
      <div class="field tam"><label>${not ? 'Konu' : 'Başlık'}</label><input id="kBaslik" value="${esc(k.baslik)}"></div>
      ${talep || (not && k.kimden) ? `<div class="field"><label>Kimden</label><input id="kKimden" value="${esc(k.kimden)}"></div>` : ''}
      ${not ? `<div class="field"><label>Termin (isteğe bağlı)</label><input type="date" id="kTermin" value="${esc(k.termin)}"></div>` : `<div class="field"><label>Sorumlu</label><input id="kSorumlu" list="dlSorumlu" value="${esc(k.sorumlu)}"></div>
      <div class="field"><label>Termin</label><input type="date" id="kTermin" value="${esc(k.termin)}">${TERMIN_IPUCU ? `<div class="ipucu">${TERMIN_IPUCU}</div>` : ''}</div>
      <div class="field"><label>Öncelik</label><select id="kOncelik"><option value="normal">Normal</option><option value="yuksek">Yüksek</option></select></div>
      <div class="field"><label>Durum</label><select id="kDurum">${Object.entries(DURUM).map(([d, a]) => `<option value="${d}">${a}</option>`).join('')}</select></div>
      ${kat.length || k.kategori ? `<div class="field"><label>Kategori</label><select id="kKategori"><option value=""></option>${[...new Set([...kat, k.kategori].filter(Boolean))].map(x => `<option>${esc(x)}</option>`).join('')}</select></div>` : ''}`}
      <div class="field tam"><label>${talep ? 'Özet' : 'Not'}</label><textarea id="kOzet" rows="${not ? 6 : 4}">${esc(k.ozet)}</textarea></div>
    </div>
    ${talep || k.postalar.length ? `<div class="bolum"><div class="bolum-h"><h4>Postalar</h4><span class="sp"></span>${K_YENI || not ? '' : `<button class="btn sm" id="kPostaBagla">${svg('posta')}Posta bağla</button>`}</div><div id="kPostalar"></div></div>` : ''}
    ${not ? '' : '<div class="bolum"><div class="bolum-h"><h4>Aksiyonlar</h4></div><div id="kAksiyonlar"></div></div>'}
    ${k.gecmis.length && !not ? `<details class="gecmis"><summary>Geçmiş</summary><ul>${k.gecmis.slice().reverse().map(g => `<li><span>${trTarihSaat(g.t)}</span>${esc(g.m)}</li>`).join('')}</ul></details>` : ''}`;
  if ($('#kOncelik')) $('#kOncelik').value = k.oncelik || 'normal';
  if ($('#kDurum')) $('#kDurum').value = k.durum;
  if ($('#kKategori')) $('#kKategori').value = k.kategori || '';
  kPostaCiz(); kAksiyonCiz(vurgu);
  formOku(); K_ORJ = JSON.stringify(K);
  $('#mKayit').classList.add('show');
  if (K_YENI && !k.baslik) setTimeout(() => $('#kBaslik').focus(), 30);
}
/* ── E-postadan doldur (yeni talep / not) ──
   Yalnız BOŞ alanlar doldurulur: kullanıcının yazdığı ezilmez. Posta kayda
   bağlanır; .msg kopyası ve Outlook kategorisi "Kaydet"te işlenir. */
function postadanDoldur(p) {
  formOku();
  const orj = K_ORJ;
  const tb = p.bayrakTermin ? { tarih: p.bayrakTermin, kaynak: 'bayrak' } : terminBul(p.konu + '\n' + govdeTemizle(p.govde), p.tarih);
  if (!K.baslik) K.baslik = konuTemizle(p.konu);
  if (!K.ozet) K.ozet = ozetle(p.govde);
  if (K.tur === 'talep' && !K.kimden) { K.kimden = p.kimden; K.kimdenEposta = p.eposta || ''; }
  if (!K.termin && tb) {
    K.termin = tb.tarih;
    TERMIN_IPUCU = tb.kaynak === 'bayrak' ? 'Outlook bayrağındaki tarih.' : `Postada bulundu: <q>${esc(tb.alinti)}</q>${tb.emin ? '' : ' (kontrol edin)'}`;
  }
  if (/(acil|ivedi|urgent|önemli)/.test(trK(p.konu))) K.oncelik = 'yuksek';
  if (!K.postalar.some(x => x.id === p.id))
    K.postalar.push({ id: p.id, store: p.store, msgId: p.msgId, konu: p.konu, kimden: p.kimden, eposta: p.eposta, tarih: p.tarih, msg: '', yeni: true });
  kayitPencere();
  K_ORJ = orj;   // doldurulan alanlar kaydedilmemiş değişiklik sayılır
  toast('Postadan dolduruldu.');
}
async function seciliDoldur() {
  const b = $('#kSecili'); b.disabled = true;
  try { postadanDoldur(await apiJson('/api/posta/secili')); }
  catch (e) { toast(e.message, true); }
  finally { if ($('#kSecili')) $('#kSecili').disabled = false; }
}
// Posta seçici: kaynak + arama (yalnız Ara/Enter ile) + liste
let SEC = [], SEC_Q = '', SEC_HEDEF = 'kayit';   // hedef: kayıt penceresini doldur ya da hatırlatıcıya ekle
function secAc() {
  $('#secKaynak').innerHTML = postaKaynakSecenek().map(([v, a]) => `<option value="${v}">${esc(a)}</option>`).join('');
  $('#secKaynak').value = V.ayar.posta.kaynak;
  $('#secAra').value = ''; SEC_Q = '';
  $('#mSec').classList.add('show');
  secYukle();
}
async function secYukle() {
  $('#secListe').innerHTML = '<div class="yukleniyor">Outlook\'tan okunuyor…</div>';
  try { SEC = (await apiJson(postaSorgu($('#secKaynak').value))).postalar || []; secCiz(); }
  catch (e) { SEC = []; $('#secListe').innerHTML = `<div class="card-b"><div class="note warn" style="margin:0">Outlook'a bağlanılamadı: ${esc(e.message)}</div></div>`; }
}
function secCiz() {
  const bagli = bagliPostalar();
  const L = SEC.map((p, i) => ({ p, i })).filter(({ p }) => metinUygun(SEC_Q, p.konu, p.kimden, p.on));
  $('#secListe').innerHTML = L.length ? `<table class="tbl"><thead><tr><th>Tarih</th><th>Kimden</th><th>Konu</th><th></th></tr></thead><tbody>${
    L.map(({ p, i }) => { const k = bagli.get(p.id);
      return `<tr class="clickable${p.okunmadi ? ' okunmadi' : ''}" data-sec="${i}"><td class="tarih">${kisaTarih(p.tarih)}</td><td class="dar">${esc(p.kimden)}</td>` +
        `<td class="konu"><b>${esc(p.konu || '(konusuz)')}</b><span class="konu-on">${esc(p.on)}</span></td><td class="dar">${k ? `<span class="badge green">${esc(k.no)}</span>` : ''}</td></tr>`; }).join('')
  }</tbody></table>` : '<div class="bos">Posta bulunamadı.</div>';
}
async function secSec(i) {
  const p = SEC[i];
  $('#secListe').innerHTML = '<div class="yukleniyor">Posta okunuyor…</div>';
  try {
    const j = await apiJson('/api/posta/oku?id=' + encodeURIComponent(p.id) + '&store=' + encodeURIComponent(p.store));
    $('#mSec').classList.remove('show');
    if (SEC_HEDEF === 'hat') hatEkPosta(j); else postadanDoldur(j);
  } catch (e) { toast(e.message, true); secCiz(); }
}
function kPostaCiz() {
  const el = $('#kPostalar'); if (!el) return;
  el.innerHTML = K.postalar.length ? K.postalar.map((p, i) =>
    `<div class="posta-satir">${svg('posta')}<span class="ps-konu" title="${esc(p.konu)}">${esc(p.konu || '(konusuz)')}</span>` +
    `<span class="ps-ek">${esc(p.kimden || '')} · ${trTarihSaat(p.tarih)}</span>` +
    `<button class="btn sm" data-p-ac="${i}">Aç</button><button class="ikon-btn" data-p-sil="${i}" title="Bağlantıyı kaldır">${svg('x')}</button></div>`).join('')
    : '<div class="ps-ek" style="font-size:12.5px;color:var(--s-graphite2)">Bağlı posta yok.</div>';
}
function kAksiyonCiz(vurgu) {
  if (!$('#kAksiyonlar')) return;   // notta aksiyon bölümü yok
  const satir = (a, i) => `<tr class="${a.durum === 'tamam' ? 'tamam' : ''}${a.id === vurgu ? ' vurgu' : ''}" data-i="${i}">
      <td style="width:28px"><input type="checkbox" data-af="durum" ${a.durum === 'tamam' ? 'checked' : ''} title="Tamamlandı"></td>
      <td><input type="text" data-af="metin" value="${esc(a.metin)}"></td>
      <td style="width:190px"><input type="text" data-af="sorumlu" list="dlSorumlu" value="${esc(a.sorumlu || '')}"></td>
      <td style="width:150px"><input type="date" data-af="termin" value="${esc(a.termin || '')}"></td>
      <td style="width:96px">${a.durum === 'tamam' ? '' : kalanHtml(a.termin)}</td>
      <td style="width:36px"><button class="ikon-btn" data-a-sil="${i}" title="Sil">${svg('cop')}</button></td></tr>`;
  $('#kAksiyonlar').innerHTML = `<table class="tbl aks"><thead><tr><th></th><th>Aksiyon</th><th>Sorumlu</th><th>Termin</th><th>Kalan</th><th></th></tr></thead><tbody>
    ${K.aksiyonlar.map(satir).join('')}
    <tr class="yeni"><td></td><td><input type="text" id="yaMetin" placeholder="Yeni aksiyon"></td>
      <td><input type="text" id="yaSorumlu" list="dlSorumlu" value="${esc(V.ayar.varsayilanSorumlu || '')}"></td>
      <td><input type="date" id="yaTermin"></td><td colspan="2"><button class="btn sm" id="yaEkle">${svg('arti')}Ekle</button></td></tr>
  </tbody></table>`;
}
function aksiyonEkle() {
  const m = $('#yaMetin').value.trim();
  if (!m) { $('#yaMetin').focus(); return; }

function postaListeCiz() {

/* ── Posta Kutusu arama / sıralama ──
   PF: uygulanmış süzgeç (panel + başlık menüsü aynı durumu paylaşır)
   PS: sıralama (alan + yön) */
let PF = { q: '', kimden: '', konu: '', durum: '', tarih: '', okunmamis: false, bayrak: false }, PS = { alan: 'tarih', yon: -1 };
function postaUygun(p) {
  const o = postaOzet(p.id), ys = V.yoksay.includes(p.id);
  if (PF.q && !metinUygun(PF.q, p.konu, p.kimden, p.on)) return false;
  if (PF.kimden && !trK(p.kimden).includes(trK(PF.kimden))) return false;
  if (PF.konu && !trK(p.konu).includes(trK(PF.konu))) return false;
  if (PF.okunmamis && !p.okunmadi) return false;
  if (PF.bayrak && !p.bayrak) return false;
  if (PF.tarih) { const once = -gunFark(yerelTarih(new Date(p.tarih))); if (PF.tarih === 'bugun' ? once !== 0 : once >= +PF.tarih) return false; }
  switch (PF.durum) {
    case 'islenmemis': return !o.islenmis && !ys;
    case 'takipte': return takipteMi(p, o);
    case 'acik': return o.acik;
    case 'kapandi': return o.islenmis && !o.acik;
    case 'yoksay': return ys;
  }
  return true;
}

   içindeyse görünür — liste zamanla sonsuz büyümesin. */
let ANA_POSTA = [];
/* Takip kuralı (13.10.2026, kullanıcı):
   - Postadan iş alınmışsa (aksiyon / not / talep): AÇIK iş kaldıkça takipte; hepsi
     kapanınca takipten çıkar — Outlook'ta bayrağı dursa bile.
   - Hiç iş alınmamışsa: yalnız bayraklıyken takipte; bayrak kalkınca çıkar. */
function anaPostalar() {
  const m = new Map(), islenen = new Map();
  for (const k of V.kayitlar) for (const p of k.postalar) if (!islenen.has(p.id)) islenen.set(p.id, p);
  (BAYRAKLI || []).forEach(p => { if (takipteMi(p)) m.set(p.id, p); });
  for (const [id, p] of islenen) {
    if (m.has(id) || !takipteMi({ id, bayrak: false })) continue;
    m.set(id, { id, store: p.store, msgId: p.msgId, konu: p.konu, kimden: p.kimden, tarih: p.tarih, on: '', bayrak: false, bayrakTermin: '', okunmadi: false });
  }
  return [...m.values()].sort((a, b) => (b.tarih || '').localeCompare(a.tarih || ''));
}
function bayrakliCiz() {
  const el = $('#anaBayrak'); if (!el) return;
  $('#anaBayrakBaslik').textContent = 'Takipteki Postalar';
  ANA_POSTA = anaPostalar();
  if (!BAYRAKLI && !BAYRAKLI_HATA && !ANA_POSTA.length) return;   // ilk okuma sürüyor
  $('#anaBayrakSay').textContent = ANA_POSTA.length;
  const hata = BAYRAKLI_HATA ? `<div class="card-b" style="padding-bottom:0"><div class="note warn" style="margin:0 0 12px">Outlook'a bağlanılamadı; bayraklı postalar gösterilemiyor: ${esc(BAYRAKLI_HATA)}</div></div>` : '';
  el.innerHTML = hata + (ANA_POSTA.length ? `<table class="tbl"><thead><tr><th>Tarih</th><th>Kimden</th><th>Konu</th><th></th></tr></thead><tbody>${
    ANA_POSTA.map((p, i) => `<tr class="clickable${p.okunmadi ? ' okunmadi' : ''}" data-p="${i}">` +
      `<td class="tarih">${kisaTarih(p.tarih)}</td><td class="dar">${esc(p.kimden)}</td>` +
      `<td class="konu"><b>${esc(p.konu || '(konusuz)')}</b>${p.on ? `<span class="konu-on">${esc(p.on)}</span>` : ''}</td>` +
      postaIkonlar(p, i, postaOzet(p.id)) + '</tr>').join('')
  }</tbody></table>` : '<div class="bos">Takipte posta yok.</div>');
}
// Bir postadan ne alındı: aksiyon sayısı, not sayısı, bağlı talep numaraları
// acik: postada hâlâ açık iş var mı (açık aksiyon, açık not ya da açık talep) — takip bunu kullanır
function postaOzet(id) {
  const o = { aks: 0, aksAcik: 0, not: 0, notAcik: 0, talep: '', talepAcik: 0 }, t = [];
  for (const k of V.kayitlar) {
    if (!k.postalar.some(p => p.id === id)) continue;
    if (k.tur === 'not') { o.not++; if (acikMi(k)) o.notAcik++; continue; }
    o.aks += k.aksiyonlar.length;
    o.aksAcik += k.aksiyonlar.filter(a => a.durum !== 'tamam').length;
    if (k.tur === 'talep') { t.push(k.no); if (acikMi(k)) o.talepAcik++; }
  }
  o.talep = t.join(', ');
  o.islenmis = o.aks + o.not + t.length > 0;
  o.acik = o.aksAcik + o.notAcik + o.talepAcik > 0;
  return o;
}
// Bayraklı / kategorili postalar kayda bağlanana kadar zil hatırlatır.
function postaBekleyenHesapla() {
  if (!POSTALAR || POSTA_KAYNAK !== V.ayar.posta.kaynak || V.ayar.posta.kaynak === 'gelen') return;

  $('#snPostaSay').textContent = POSTA_BEKLEYEN || '';

}
async function postaArkaPlanKontrol() {
