        `<tr class="clickable" data-ol="${esc(o.id)}"><td class="tarih">${o.tumGun ? 'Tüm gün' : esc(o.bas.slice(11, 16) + ' – ' + o.bit.slice(11, 16))}</td>` +

        `<td class="dar"><span class="badge ${o.teams ? 'mor' : 'gray'}">${tur(o)}</span></td><td>${esc(o.yer || '')}</td>` +
        `<td class="dar">${esc(o.duzenleyen || '')}${o.katilimci > 1 ? `<span class="alt">${o.katilimci} kişi</span>` : ''}</td>` +
        `<td class="dar">${o.teams ? `<button class="btn sm teams-katil" data-teams-katil="${esc(o.teams)}">Katıl</button>` : ''}</td></tr>`).join('')}</tbody></table>`
      : '<div class="bos">Bu gün toplantı yok.</div>');
  };
  $('#mListe').classList.add('show');
  ciz(TOP_GUN[gun] || null);
  try { const j = await apiJson(`/api/takvim?bas=${gun}&gunSayi=1`); TOP_GUN[gun] = [].concat(j.olaylar || []).sort((a, b) => (a.bas || '').localeCompare(b.bas || '')); }
  catch (er) { TOP_GUN[gun] = TOP_GUN[gun] || []; toast(er.message, true); }
  ciz(TOP_GUN[gun]);
}
document.addEventListener('click', e => {

function anaListePencere(f) {
  if (f === 'toplanti') return anaToplantiPencere();   // Toplantı kartı: günün toplantıları (gün seçicili)
  if (f !== ANA_LISTE_F) { LF.ml = {}; LS.ml = {}; LF.mlp = {}; LS.mlp = {}; }   // başka liste açılınca başlık süzgeçleri sıfırlanır
  ANA_LISTE_F = f;
  const ad = { gecmis: 'Termini Geçen', bugun: 'Bugünkü İşler', yaklasan: 'Yaklaşan', acik: 'Açık İşler', kapanan: 'Bu Ay Kapanan',
    not: 'Notlarım', aksiyon: 'Aksiyonlarım', posta: 'Takipteki Postalar', bekleyen: 'Bekleyen İşler', talep: 'Bekleyen Talepler' }[f];
  // Takipteki postalar: anasayfa kartındaki tablonun tamamı (satır tıklamaları #mlPosta içinde de çalışır)
  if (f === 'posta') {
    $('#mlBaslik').textContent = ad; $('#mlSay').textContent = ANA_POSTA.length;
    $('#mlGovde').innerHTML = `<div id="mlPosta">${anaPostaTablo('mlp')}</div>`;
    return $('#mListe').classList.add('show');
  }
  // Notlarım / Aksiyonlarım: anasayfada yalnız geciken + yaklaşanlar; burada açık olanların tümü (termini olmayan ve ileri tarihliler dahil)
  const kayitSatir = k => ({ k, a: null, id: k.id, baslik: k.baslik, sorumlu: k.sorumlu, termin: k.termin, durum: k.durum });
  const notlar = () => V.kayitlar.filter(k => k.tur === 'not' && acikMi(k)).map(kayitSatir);
  const L = f === 'not' ? notlar()
    : f === 'aksiyon' ? isler().filter(i => i.a)
    : f === 'bekleyen' ? notlar().concat(isler().filter(i => i.a))   // tüm açık notlar (termini olmayanlar dahil) + açık aksiyonlar
    : f === 'talep' ? V.kayitlar.filter(k => k.tur === 'talep' && acikMi(k) && (k.yon || 'gelen') === ANA_TALEP_YON).map(kayitSatir)
    : isler();
  const hepsi = ['acik', 'not', 'aksiyon', 'bekleyen', 'talep'].includes(f);
  let satirlar = '', n = 0;
  // Bugünkü İşler: üstte gün seçici (‹ tarih ›); seçilen günün termini olan açık işler
  if (f === 'bugun' && !ANA_GUN) ANA_GUN = bugun();
  // Bekleyen Talepler: üstte Gelen ⇄ Giden seçici (gün seçici gibi oklarla)

      <button class="ikon-btn" data-talep-kay aria-label="Değiştir">›</button></div>`;
  })() : '';
  const gunSecici = f === 'talep' ? talepSecici : f === 'bugun' ? gunSeciciHtml() : '';
  const G = f === 'kapanan' ? kapananlar() : (hepsi ? L : f === 'bugun' ? L.filter(i => i.termin === ANA_GUN) : L.filter(i => kova(i.termin) === f)).sort(terminSira);
  const GS = mlSuzSirala(G);   // başlık okları: sütun süzgeçleri ve sıralama

    : `<div class="bos">${hepsi ? 'Açık iş yok.' : f === 'bugun' ? 'Bu gün termini olan açık iş yok.' : 'Bu grupta iş yok.'}</div>`);
  $('#mListe').classList.add('show');

// Açılır iş listelerinin başlık okları ('ml'): sütun değerleri isSatir'deki gösterimle aynı
function mlDeger(i, alan) {
  const k = i.k, a = i.a;
  return { no: a ? a.no : k.no, is: i.baslik, tur: a ? 'Aksiyon' : (TUR_AD[k.tur] || 'Talep'), kimden: k.kimden, sorumlu: i.sorumlu,
    termin: i.termin, durum: a ? (a.durum === 'tamam' ? 'Kapandı' : 'Açık') : (DURUM[i.durum] || i.durum) }[alan] || '';
}
function mlSuzSirala(G) {
  const f = LF.ml || {}, S = LS.ml || {};
  let L = G.filter(i => Object.entries(f).every(([alan, d]) => !d || d === 'hepsi' ||
    (alan === 'termin' ? kova(i.termin) === d : trK(mlDeger(i, alan)).includes(trK(d)))));
  if (S.alan) L = L.slice().sort((x, y) => S.yon * siraKarsilastir(mlDeger(x, S.alan), mlDeger(y, S.alan), S.alan === 'termin'));
  return L;
}
function isSatir(i, kapanan) {
  const k = i.k, a = i.a;
  // Tür ayrı sütunda; açıklama (aksiyonun kaydı / notun özeti) satırda değil, üzerine gelince
  const tur = a ? 'Aksiyon' : (TUR_AD[k.tur] || 'Talep');
  const ip = a ? (k.baslik && trK(k.baslik) !== trK(i.baslik) ? 'Kayıt: ' + k.baslik : '') : (k.ozet || '');
  const is = a ? esc(i.baslik) : `${esc(i.baslik)}${oncelikHtml(k)}${postaDugme(k)}`;
  return `<tr class="clickable" data-k="${k.id}" data-a="${a ? a.id : ''}"><td class="no">${esc(a ? a.no : k.no)}</td><td class="is-ad"${ip ? ` data-ipucu="${esc(ip)}"` : ''}>${is}</td><td class="dar">${tur}</td>` +
    `<td>${esc(k.kimden || '')}</td><td class="dar">${esc(i.sorumlu || '')}</td><td class="tarih">${trTarih(i.termin)}</td>` +
    `<td class="dar">${kapanan ? trTarih(i.kapanis) : kalanHtml(i.termin)}</td><td class="dar">${a ? aksDurumHtml(a) : durumHtml(i.durum)}</td></tr>`;
}

function postadanDoldur(p) {
  formOku();

  const tb = p.bayrakTermin ? { tarih: p.bayrakTermin, kaynak: 'bayrak' } : terminBul(p.konu + '\n' + govdeTemizle(p.govde), p.tarih);

  if (!K.ozet) K.ozet = ozetle(p.govde);

  if (!K.termin && tb) {
    K.termin = tb.tarih;
    TERMIN_IPUCU = tb.kaynak === 'bayrak' ? 'Outlook bayrağındaki tarih.' : `Postada bulundu: <q>${esc(tb.alinti)}</q>${tb.emin ? '' : ' (kontrol edin)'}`;
  }

    K.postalar.push({ id: p.id, store: p.store, msgId: p.msgId, konu: p.konu, kimden: p.kimden, eposta: p.eposta, tarih: p.tarih, msg: '', yeni: true });

async function kayitKaydet() {

  if (!K.baslik) { toast('Başlık boş olamaz.', true); $('#kBaslik').focus(); return; }
  // Pencerede "e-postadan doldur" ile eklenen postalar: kopya + kategori
  const yeniPosta = K.postalar.filter(p => p.yeni);
  let uyari = '';
  if (yeniPosta.length) {
    $('#mkKaydet').disabled = true;
    const ap = V.ayar.posta;
    for (const p of yeniPosta) {
      try {
        const j = await apiJson('/api/posta/bagla', { method: 'POST', body: JSON.stringify({ id: p.id, store: p.store, msgId: p.msgId, msgSakla: !!ap.msgSakla, kategori: ap.kategoriAta ? ap.kategori : '' }) });
        p.msg = j.msg || '';
        if (ap.msgSakla && !p.msg) uyari = 'Postanın kopyası saklanamadı.';
      } catch (e) { uyari = 'Outlook işlemi yapılamadı: ' + e.message; }
      delete p.yeni;
      V.yoksay = V.yoksay.filter(x => x !== p.id);
    }
    $('#mkKaydet').disabled = false;
    if (!K) return;
  }
  const eski = K_YENI ? null : kayitBul(K.id);
  const acikAks = K.aksiyonlar.filter(a => a.durum !== 'tamam');
  if (K.durum === 'tamam' && (!eski || eski.durum !== 'tamam') && acikAks.length &&
      confirm(`${acikAks.length} açık aksiyon var. Onlar da tamamlandı olarak işaretlensin mi?`))
    acikAks.forEach(a => { a.durum = 'tamam'; a.tamamTarih = simdi(); });
  const z = simdi();
  if (eski) {
    const d = [];
    if (eski.durum !== K.durum) d.push(`Durum: ${DURUM[eski.durum]} → ${DURUM[K.durum]}`);
    if ((eski.termin || '') !== (K.termin || '')) d.push(`Termin: ${trTarih(eski.termin) || '—'} → ${trTarih(K.termin) || '—'}`);
    if ((eski.sorumlu || '') !== (K.sorumlu || '')) d.push(`Sorumlu: ${eski.sorumlu || '—'} → ${K.sorumlu || '—'}`);
    const ea = new Map(eski.aksiyonlar.map(a => [a.id, a]));
    K.aksiyonlar.forEach(a => {
      const o = ea.get(a.id);
      if (!o) d.push(`Aksiyon eklendi: ${a.metin}`);
      else if (o.durum !== a.durum) d.push(`Aksiyon ${a.durum === 'tamam' ? 'tamamlandı' : 'yeniden açıldı'}: ${a.metin}`);
    });
    d.forEach(m => K.gecmis.push({ t: z, m }));
  } else {
    K.no = K.no || numaraVer(K.tur); K.olusturma = z;

  K.aksiyonlar.forEach(a => { if (a.durum === 'tamam' && !a.tamamTarih) a.tamamTarih = z; if (a.durum !== 'tamam') a.tamamTarih = ''; if (!a.no) a.no = numaraVer('aksiyon'); });
  if (!acikMi(K) && !K.kapanis) K.kapanis = z;
  if (acikMi(K)) K.kapanis = '';

}
// İlet: talep yeni ya da kaydedilmemiş değişiklik varsa önce kaydedilir, sonra iletme paneli açılır

/* ── ANA EKRAN: Outlook'taki bayraklı postalar (son N gün) ──
   Outlook sorgusu ~2 sn sürdüğü için her çizimde değil, kontrol aralığında
   bir (ya da "Yenile" ile) okunur; arada önbellekten çizilir. */
let BAYRAKLI = null, BAYRAKLI_HATA = '', BAYRAKLI_ZAMAN = 0, BAYRAKLI_YUKLENIYOR = false;
async function bayrakliYukle() {
  if (BAYRAKLI_YUKLENIYOR) return;
  BAYRAKLI_YUKLENIYOR = true;
  if (!BAYRAKLI) $('#anaBayrak').innerHTML = '<div class="yukleniyor">Outlook\'tan okunuyor…</div>';
  try { BAYRAKLI = (await apiJson(postaSorgu('bayrakli'))).postalar || []; BAYRAKLI_HATA = ''; bayrakliYukle.deneme = 0; }
  catch (e) {
    BAYRAKLI_HATA = e.message;
    // Açılışta Outlook henüz hazır değilse ('Klasör bulunamadı'): 15 sn arayla en çok 6 kez yeniden denenir
    if ((bayrakliYukle.deneme = (bayrakliYukle.deneme || 0) + 1) <= 6) setTimeout(bayrakliYukle, 15000);
  }
  BAYRAKLI_ZAMAN = Date.now(); BAYRAKLI_YUKLENIYOR = false;
  bayrakliCiz();
}
/* Ana ekrandaki posta listesi = Outlook'ta bayraklı olanlar + aksiyon ya da
   not alınmış olanlar. İşlenen postalardan açık aksiyonu olan HER ZAMAN
   görünür; aksiyonları kapanmış ya da yalnız notu olan posta "son N gün"
   içindeyse görünür — liste zamanla sonsuz büyümesin. */
let ANA_POSTA = [];
/* Takip kuralı (13.10.2026, kullanıcı):
   - Postadan iş alınmışsa (aksiyon / not / talep): AÇIK iş kaldıkça takipte; hepsi
     kapanınca takipten çıkar — Outlook'ta bayrağı dursa bile.
   - Hiç iş alınmamışsa: yalnız bayraklıyken takipte; bayrak kalkınca çıkar. */
function anaPostalar() {
  const m = new Map(), islenen = new Map();
  for (const k of V.kayitlar) for (const p of k.postalar) if (!islenen.has(p.id)) islenen.set(p.id, p);
  (BAYRAKLI || []).forEach(p => { if (takipteMi(p)) m.set(p.id, p); });
  for (const [id, p] of islenen) {
    if (m.has(id) || !takipteMi({ id, bayrak: false })) continue;
    m.set(id, { id, store: p.store, msgId: p.msgId, konu: p.konu, kimden: p.kimden, tarih: p.tarih, on: '', bayrak: false, bayrakTermin: '', okunmadi: false });
  }
  return [...m.values()].sort((a, b) => (b.tarih || '').localeCompare(a.tarih || ''));
}
function bayrakliCiz() {
  const el = $('#anaBayrak'); if (!el) return;
  $('#anaBayrakBaslik').textContent = 'Takipteki Postalar';
  ANA_POSTA = anaPostalar();
  if (!BAYRAKLI && !BAYRAKLI_HATA && !ANA_POSTA.length) return;   // ilk okuma sürüyor
  const hata = BAYRAKLI_HATA ? `<div class="card-b" style="padding-bottom:0"><div class="note warn" style="margin:0 0 12px">Outlook'a bağlanılamadı; bayraklı postalar gösterilemiyor: ${esc(BAYRAKLI_HATA)}</div></div>` : '';
  el.innerHTML = hata + anaPostaTablo();
  if (ANA_LISTE_F === 'posta' && $('#mListe').classList.contains('show')) anaListePencere('posta');   // açık pencere de tazelensin

// Takipteki postalar tablosu: anasayfa kartı ve "tüm liste" penceresi aynı satırları kullanır
// v verilirse (açılır pencere: 'mlp') başlıklar oklu: sıralama + sütun süzgeci. Satır numarası (data-p) ANA_POSTA'daki yer kalır.
function anaPostaTablo(v) {
  let L = ANA_POSTA.map((p, i) => ({ p, i }));
  if (v) {
    const f = LF[v] || {}, S = LS[v] || {}, dg = (p, a) => a === 'tarih' ? p.tarih : a === 'kimden' ? p.kimden : (p.konu || '') + ' ' + (p.on || '');
    L = L.filter(({ p }) => Object.entries(f).every(([a, d]) => {
      if (!d) return true;
      if (a !== 'tarih') return trK(dg(p, a)).includes(trK(d));
      const once = -gunFark(yerelTarih(new Date(p.tarih))); return d === 'bugun' ? once === 0 : once < +d;
    }));
    if (S.alan) L.sort((x, y) => S.yon * siraKarsilastir(dg(x.p, S.alan), dg(y.p, S.alan), S.alan === 'tarih'));
  }
  const bas = v ? thBas(v, 'tarih', 'Tarih', 'tarih') + thBas(v, 'kimden', 'Kimden', 'metin') + thBas(v, 'konu', 'Konu', 'metin') + '<th></th>'
    : '<th>Tarih</th><th>Kimden</th><th>Konu</th><th></th>';
  return ANA_POSTA.length ? `<table class="tbl"><thead><tr>${bas}</tr></thead><tbody>${
    L.map(({ p, i }) => `<tr class="clickable${p.okunmadi ? ' okunmadi' : ''}" data-p="${i}">` +
      `<td class="tarih">${kisaTarih(p.tarih)}</td><td class="dar">${esc(p.kimden)}</td>` +
      `<td class="konu"><b>${esc(p.konu || '(konusuz)')}</b>${p.on ? `<span class="konu-on">${esc(p.on)}</span>` : ''}</td>` +
      postaIkonlar(p, i, postaOzet(p.id)) + '</tr>').join('')
  }</tbody></table>` : '<div class="bos">Takipte posta yok.</div>';
}
// Bir postadan ne alındı: aksiyon sayısı, not sayısı, bağlı talep numaraları
// acik: postada hâlâ açık iş var mı (açık aksiyon, açık not ya da açık talep) — takip bunu kullanır
function postaOzet(id) {
  const o = { aks: 0, aksAcik: 0, not: 0, notAcik: 0, talep: '', talepAcik: 0 }, t = [];
  for (const k of V.kayitlar) {
    if (!k.postalar.some(p => p.id === id)) continue;
    if (k.tur === 'not') { o.not++; if (acikMi(k)) o.notAcik++; continue; }
    o.aks += k.aksiyonlar.length;
    o.aksAcik += k.aksiyonlar.filter(a => a.durum !== 'tamam').length;
    if (k.tur === 'talep') { t.push(k.no); if (acikMi(k)) o.talepAcik++; }
  }
  o.talep = t.join(', ');
  o.islenmis = o.aks + o.not + t.length > 0;
  o.acik = o.aksAcik + o.notAcik + o.talepAcik > 0;
  return o;
}
// Bayraklı / kategorili postalar kayda bağlanana kadar zil hatırlatır.

/* ── Postadan kayıt: özet ve termin önerisi (çevrimdışı, LLM yok) ── */
const AYLAR = ['ocak', 'şubat', 'mart', 'nisan', 'mayıs', 'haziran', 'temmuz', 'ağustos', 'eylül', 'ekim', 'kasım', 'aralık'];
const GUNLER = ['pazar', 'pazartesi', 'salı', 'çarşamba', 'perşembe', 'cuma', 'cumartesi'];
const HARF = 'a-zçğıöşü';
function govdeTemizle(g) {
  const satirlar = String(g || '').replace(/\r/g, '').split('\n'), out = [];
  const alintiBas = /^(from|kimden|gönderen|sent|gönderildi)\s*:|^-{2,}\s*(original|özgün|orijinal|forwarded|iletilen)|^_{6,}|^on .+wrote:?$|tarihinde .+ yazdı:?$/;
  const kapanis = /^(saygılarımla|saygılarımızla|saygılar|iyi çalışmalar|kolay gelsin|teşekkürler|teşekkür ederim|best regards|kind regards|regards|sevgiler|selamlar)\b/;
  const selam = /^([^\s,]+\s+)?(merhaba|selam|sayın|değerli|dear|hi|hello|günaydın|iyi günler)(?![a-zçğıöşü])/;
  const yasal = /(bu e-?posta|this e-?mail|gizlidir|confidential|yasal uyarı|disclaimer)/;
  for (const s of satirlar) {
    const t = trK(s.trim());
    if (alintiBas.test(t) || yasal.test(t)) break;
    if (t.startsWith('>')) continue;
    if (out.some(x => x) && kapanis.test(t)) break;
    if (!out.some(x => x) && selam.test(t)) {
      // Yalnız selamlama kısmı atılır ("Merhaba Elif Hanım, ..." → "...")
      const kalan = s.trim().replace(/^[^,!:\n]{0,45}[,!:]\s*/, '');
      if (kalan === s.trim() && t.length < 70) continue;
      if (kalan) out.push(kalan);
      continue;
    }
    out.push(s.trim());
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function ozetle(govde) {
  const t = govdeTemizle(govde).replace(/<?(https?:\/\/|mailto:|www\.)\S+>?/gi, ' ').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  const cumleler = t.split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ0-9"“(])/).filter(c => c.length > 3);
  const talep = /(rica|talep|gerek|lütfen|iletilmesi|hazırlanması|gönderilmesi|incelenmesi|değerlendirilmesi|istenmektedir|bekliyoruz|bilgi|onay|termin|en geç|son gün|please|request|kindly)/;
  const sec = new Set([0]);
  cumleler.forEach((c, i) => { if (sec.size < 3 && talep.test(trK(c))) sec.add(i); });
  let o = [...sec].sort((a, b) => a - b).map(i => cumleler[i]).join(' ');
  if (o.length > 420) o = o.slice(0, 417).replace(/\s+\S*$/, '') + '…';
  return o;
}
function terminBul(metin, refIso) {
  const ham = String(metin || ''), tl = trK(ham), ref = refIso ? new Date(refIso) : new Date();
  const r0 = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const ekle = n => new Date(r0.getFullYear(), r0.getMonth(), r0.getDate() + n);
  const aday = [];
  const koy = (d, i, n) => { if (d && !isNaN(d)) aday.push({ d, i, n }); };
  let m;
  const re1 = /(^|[^\d])(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4}|\d{2})(?!\d)/g;
  while ((m = re1.exec(tl))) { let y = +m[4]; if (y < 100) y += 2000; const mo = +m[3], g = +m[2]; if (mo >= 1 && mo <= 12 && g >= 1 && g <= 31) koy(new Date(y, mo - 1, g), m.index + m[1].length, m[0].length - m[1].length); }
  const re2 = new RegExp(`(^|[^\\d])(\\d{1,2})\\s+(${AYLAR.join('|')})(?:\\s+(\\d{4}))?`, 'g');
  while ((m = re2.exec(tl))) {
    let d = new Date(m[4] ? +m[4] : r0.getFullYear(), AYLAR.indexOf(m[3]), +m[2]);
    if (!m[4] && d < r0) d = new Date(d.getFullYear() + 1, d.getMonth(), d.getDate());
    koy(d, m.index + m[1].length, m[0].length - m[1].length);
  }
  const kelime = (k, f) => { const re = new RegExp(`(^|[^${HARF}])(${k})(?:'?(?:ya|ye|a|e|na|ne|da|de|dan|den|ndan|nden))?(?![${HARF}])`, 'g'); while ((m = re.exec(tl))) koy(f(m), m.index + m[1].length, m[2].length); };
  kelime('bugün', () => ekle(0));
  kelime('yarın', () => ekle(1));
  kelime('haftaya', () => ekle(7));
  kelime('bu hafta|hafta sonuna kadar|hafta içinde', () => ekle(((5 - r0.getDay()) + 7) % 7));
  kelime('ay sonuna kadar|ay sonu', () => new Date(r0.getFullYear(), r0.getMonth() + 1, 0));
  GUNLER.forEach((g, gi) => kelime(g, () => ekle(((gi - r0.getDay()) + 7) % 7 || 7)));
  const re3 = /(\d+)\s*(iş\s*)?gün(ü)?\s*(içinde|içerisinde|zarfında)/g;
  while ((m = re3.exec(tl))) {
    let n = +m[1], d = new Date(r0);
    if (m[2]) { while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } } else d = ekle(n);
    koy(d, m.index, m[0].length);
  }
  const anahtar = /(en geç|termin|son gün|kadar|deadline|due|teslim|tarihine|tarihinde|itibar|önce|içinde|içerisinde|zarfında)/;
  let enIyi = null;
  for (const a of aday) {
    if (a.d < r0 || a.d > ekle(400)) continue;
    const pencere = tl.slice(Math.max(0, a.i - 45), a.i + a.n + 30);
    a.puan = anahtar.test(pencere) ? 2 : 0;
    if (!enIyi || a.puan > enIyi.puan || (a.puan === enIyi.puan && a.i < enIyi.i)) enIyi = a;
  }
  if (!enIyi) return null;
  const bas = Math.max(0, ham.lastIndexOf(' ', Math.max(0, enIyi.i - 30)) + 1);
  let alinti = ham.slice(bas, Math.min(ham.length, enIyi.i + enIyi.n + 25)).replace(/\s+/g, ' ').trim();
  return { tarih: yerelTarih(enIyi.d), alinti, emin: enIyi.puan > 0 };
}
function konuTemizle(s) { s = String(s || ''); const m = trK(s).match(/^\s*((re|fw|fwd|ynt|ilt|yanıt|ilet|cevap)\s*:\s*)+/); return (m ? s.slice(m[0].length) : s).trim(); }

/* ── POSTA PENCERESİ ──
   Solda posta, sağda yalnız iki düğme: Aksiyon ve Not.
   Aksiyon: alınacak aksiyon + sorumlu + termin bölümü açılır; "Aksiyon ekle"
   ile aynı sayfada yeni bölüm eklenir. Not: altta not kutusu açılır.
   Kaydet: aksiyonlar postaya bağlı olarak Aksiyonlar listesine, not Notlar
   listesine düşer. Konu ve kimden postadan gelir. */
let P = null, P_TB = null;   // açık posta + termin önerisi

  } catch (e) { $('#mpGovde').innerHTML = `<div class="note warn">${esc(e.message)}</div>`; P = null; return; }
  P_TB = P.bayrakTermin ? { tarih: P.bayrakTermin, kaynak: 'bayrak' } : terminBul(P.konu + '\n' + govdeTemizle(P.govde), P.tarih);
  // Bu postadan daha önce alınanlar (aynı aksiyonu ikinci kez açmamak için)

    if (k.tur === 'not') onceki.push(`<div class="pm-onceki" data-k="${k.id}"><b>${esc(k.no)}</b><span>${esc(k.ozet)}</span><em>${acikMi(k) ? 'Not' : '<span class="badge green">Kapandı</span>'}</em></div>`);
    else k.aksiyonlar.forEach(a => onceki.push(`<div class="pm-onceki" data-k="${k.id}" data-a="${a.id}"><b>${esc(a.no || '')}</b><span>${esc(a.metin)}</span><em>${aksDurumHtml(a)}</em></div>`));
  });
  $('#mpGovde').innerHTML = `<div class="aktar">
    <div>
      <div class="posta-ust"><h4>${esc(P.konu || '(konusuz)')}</h4>
        <b>${esc(P.kimden)}</b>${P.eposta ? ' &lt;' + esc(P.eposta) + '&gt;' : ''}${P.eposta ? ' ' + iletisimDugmeleri(Object.assign({ eposta: P.eposta }, kisiler().map(kisiTam).find(k => k.eposta && trK(k.eposta) === trK(P.eposta)) || {})) : ''} · ${trTarihSaat(P.tarih)}
        ${P.ekler.length ? `<br>Ekler: ${P.ekler.map(esc).join(', ')}` : ''}
        <button class="btn sm" id="mpOutlook" style="margin-left:8px">Outlook'ta aç</button></div>
      <div class="posta-govde">${esc(P.govde.trim())}</div>
    </div>
    <div>
      <div class="pm-dugmeler">
        <button class="btn" id="pmAks">${svg('aksiyon')}Aksiyon</button>
        <button class="btn" id="pmNot">${svg('not')}Not</button>
      </div>
      ${onceki.length ? `<div class="pm-onceki-kutu">${onceki.join('')}</div>` : ''}
      <div id="pmAksBloklar"></div>
      <button class="btn sm" id="pmAksEkle" style="display:none">${svg('arti')}Aksiyon ekle</button>
      <div id="pmNotBlok"></div>
    </div></div>`;
  $('#mpYoksay').style.display = onceki.length ? 'none' : '';
  if (ac === 'aksiyon') pmAksiyonEkle();
  if (ac === 'not') pmNotAc();
}
function pmAksiyonEkle() {
  const kutu = $('#pmAksBloklar'), n = $$('.pm-blok[data-aks]', kutu).length;
  const ilk = n === 0, tb = P_TB;
  const ipucu = !ilk || !tb ? '' : tb.kaynak === 'bayrak' ? 'Outlook bayrağındaki tarih.'
    : `Postada bulundu: <q>${esc(tb.alinti)}</q>${tb.emin ? '' : ' (kontrol edin)'}`;
  kutu.insertAdjacentHTML('beforeend', `<div class="pm-blok" data-aks>
      <div class="pm-blok-h">Aksiyon<span class="sp"></span><button class="ikon-btn" data-pm-sil title="Kaldır">${svg('x')}</button></div>

/* ═══════════════════════════════════════════════════════════════
   ÖĞRENME MOTORU (çevrimdışı, arka planda)
   Kapanmış aksiyon ve taleplerden öğrenir: kapanma süresi (iş günü,
   kendisi hesaplar), harcanan süre (kullanıcı yazdıysa), gecikme ve
   sekte nedenleri. Yeni iş için benzer işlerden (ortak kelime kökü +
   aynı gönderen) süre tahmin eder.
   KURAL: bulgular yalnız eldeki veriden (sayım, medyan, oran). Uydurma

const OGR_SURUM = '2026.10.13';

  'çok', 'her', 'hakkında', 'ilgili', 'göre', 'kadar', 'sonra', 'önce', 'tarafından', 'yapılması', 'edilmesi', 'olması', 'konu', 'konusu',

function kokler(metin) {

    .filter(w => w.length >= 3 && !DURAK.has(w) && !/^\d+$/.test(w)).map(w => w.slice(0, 5)))];

function isGunuSay(basIso, bitIso) {
  const g = V.ayar.plan.gunler, b = new Date(basIso), s = new Date(bitIso);
  let d = new Date(b.getFullYear(), b.getMonth(), b.getDate()), n = 0;
  const son = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  while (d < son && n < 2000) { d.setDate(d.getDate() + 1); if (g.includes(d.getDay())) n++; }
  return n;
}
let MODEL = null, MODEL_IMZA = '';
function ornekler() {
  const O = [];
  for (const k of V.kayitlar) {
    for (const a of k.aksiyonlar) {
      if (a.durum !== 'tamam' || !a.tamamTarih || !a.olusturma) continue;
      O.push({ no: a.no, kok: kokler(a.metin + ' ' + (k.baslik || '')), kimden: k.kimden || '', sorumlu: a.sorumlu || '',
        gun: isGunuSay(a.olusturma, a.tamamTarih), saat: +a.harcananSaat || null,
        gecikme: a.termin ? Math.round((new Date(a.tamamTarih.slice(0, 10)) - new Date(a.termin)) / 864e5) : null, neden: a.sekteNeden || '' });
    }
    if (k.tur === 'talep' && k.durum === 'tamam' && k.kapanis && k.olusturma && !k.aksiyonlar.length)
      O.push({ no: k.no, kok: kokler(k.baslik + ' ' + (k.ozet || '')), kimden: k.kimden || '', sorumlu: k.sorumlu || '',
        gun: isGunuSay(k.olusturma, k.kapanis), saat: null, gecikme: k.termin ? Math.round((new Date(k.kapanis.slice(0, 10)) - new Date(k.termin)) / 864e5) : null, neden: '' });
  }

}
function modelKur() {
  const O = ornekler();
  const imza = OGR_SURUM + '|' + V.ayar.plan.gunler.join('') + '|' + O.map(o => o.no + ':' + o.gun + ':' + o.saat + ':' + o.neden + ':' + o.kok.join('')).join(',');
  if (imza === MODEL_IMZA && MODEL) return false;
  const kimden = {};
  O.forEach(o => { if (!o.kimden) return; (kimden[o.kimden] = kimden[o.kimden] || []).push(o); });
  MODEL = { O, kimden, gunMed: medyan(O.map(o => o.gun)), saatMed: medyan(O.filter(o => o.saat).map(o => o.saat)) };

// Benzer işler: ortak kök oranı (Jaccard) + aynı gönderen. Dayanağı (kaç iş) her zaman döner.
function tahmin(metin, kimden) {

  const k = kokler(metin);

  if (puanli.length < 2) return null;

/* ═══════════════════════════════════════════════════════════════
   HAFTALIK PLAN
   Sıra kuralı (sabit, açık): 1) termini geçmiş  2) önemi Yüksek
   3) termini yakın  4) termini olmayan en sonda, eskisi önce.
   Süre: girilen tahmin > öğrenilen (≥2 benzer işte harcanan süre) >
   varsayılan. İşler çalışma günlerine, günlük kapasite kadar dağıtılır;
   bir iş birden çok güne bölünebilir. Plandaki bitişi terminden sonraya
   düşen iş "termin riski" olarak işaretlenir.
   ═══════════════════════════════════════════════════════════════ */
let PLAN_HAFTA = 0;   // 0 bu hafta, 1 gelecek hafta
function planOgeleri() {
  const L = [];
  for (const k of V.kayitlar) {
    if (k.durum === 'iptal') continue;
    const acikAks = k.aksiyonlar.filter(a => a.durum !== 'tamam');
    acikAks.forEach(a => L.push({ k, a, no: a.no, metin: a.metin, ust: k.baslik, termin: a.termin || '', onem: a.onem || (k.oncelik === 'yuksek' ? 'yuksek' : 'normal'),
      tahmini: +a.tahminiSaat || 0, olusturma: a.olusturma || k.olusturma || '' }));
    if (k.tur === 'talep' && acikMi(k) && !acikAks.length)
      L.push({ k, a: null, no: k.no, metin: k.baslik, ust: '', termin: k.termin || '', onem: k.oncelik === 'yuksek' ? 'yuksek' : 'normal', tahmini: 0, olusturma: k.olusturma || '' });
  }
  for (const o of L) {
    const t = tahmin(o.metin + ' ' + o.ust, o.k.kimden);
    o.tahminDayanak = t;
    if (o.tahmini) { o.saat = o.tahmini; o.kaynak = 'girilen'; }
    else if (t && t.saat) { o.saat = t.saat; o.kaynak = 'ogrenilen'; }
    else { o.saat = V.ayar.plan.varsayilanSaat; o.kaynak = 'varsayilan'; }
  }
  const bg = bugun();
  return L.sort((x, y) => {
    const gx = x.termin && x.termin < bg, gy = y.termin && y.termin < bg;
    if (gx !== gy) return gx ? -1 : 1;
    if (x.onem !== y.onem) return x.onem === 'yuksek' ? -1 : 1;
    if ((x.termin || '9') !== (y.termin || '9')) return (x.termin || '9') < (y.termin || '9') ? -1 : 1;
    return (x.olusturma || '').localeCompare(y.olusturma || '');
  });
}
function haftaBasi(n) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * n); return d; }
function planKur(sonGun) {

  const bas = new Date(); bas.setHours(0, 0, 0, 0);
  sonGun = sonGun || haftaBasi(2);   // takvimde görünen aralığın sonuna kadar simüle edilir
  for (let d = new Date(bas); d < sonGun; d.setDate(d.getDate() + 1)) {
    const g = { tarih: yerelTarih(d), calisma: P.gunler.includes(d.getDay()), kap: P.gunler.includes(d.getDay()) ? P.gunlukSaat : 0, dolu: 0, parca: [] };

function tkPazarBasi(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - x.getDay()); return x; }

/* ═══════════════════════════════════════════════════════════════
   HATIRLATICILAR
   Belli gün ve saatte; tek seferlik ya da tekrarlı. Ekler: e-posta,
   belge (şifreli saklanır), iş (aksiyon/talep/not), bağlantı.
   Windows bildirimini SUNUCU verir (tarayıcı kapalıyken de); bildirimde
   başlık yazmaz. Zaman kuralı sunucudaki Hat-GunUygun ile AYNI.
   ═══════════════════════════════════════════════════════════════ */
const TEKRAR = { yok: 'Tek seferlik', gunluk: 'Her gün', isgunu: 'İş günleri', haftalik: 'Her hafta', aylik: 'Her ay' };
function hatBas(h) { const [t, s] = h.baslangic.split('T'); const d = tarihNesne(t); const [hh, mm] = (s || '09:00').split(':').map(Number); d.setHours(hh, mm, 0, 0); return d; }
function hatGunUygun(h, d, bas) {
  const gun = new Date(d.getFullYear(), d.getMonth(), d.getDate()), bg = new Date(bas.getFullYear(), bas.getMonth(), bas.getDate());
  if (gun < bg) return false;
  if (h.bitis && yerelTarih(gun) > h.bitis) return false;
  switch (h.tekrar) {
    case 'gunluk': return true;
    case 'isgunu': return gun.getDay() >= 1 && gun.getDay() <= 5;
    case 'haftalik': return (h.gunler || []).includes(gun.getDay());
    case 'aylik': return gun.getDate() === Math.min(bas.getDate(), new Date(gun.getFullYear(), gun.getMonth() + 1, 0).getDate());
    default: return +gun === +bg;
  }
}
function hatOlusum(h, gun) { const b = hatBas(h), o = new Date(gun); o.setHours(b.getHours(), b.getMinutes(), 0, 0); return o; }
function hatSonraki(h, from = new Date()) {
  const b = hatBas(h); let d = new Date(Math.max(+new Date(from.getFullYear(), from.getMonth(), from.getDate()), +new Date(b.getFullYear(), b.getMonth(), b.getDate())));
  for (let i = 0; i < 400; i++, d.setDate(d.getDate() + 1)) if (hatGunUygun(h, d, b)) { const o = hatOlusum(h, d); if (o >= from) return o; }
  return null;
}
function hatSon(h, until = new Date()) {
  const b = hatBas(h); let d = new Date(until.getFullYear(), until.getMonth(), until.getDate());
  for (let i = 0; i < 400 && d >= new Date(b.getFullYear(), b.getMonth(), b.getDate()); i++, d.setDate(d.getDate() - 1))
    if (hatGunUygun(h, d, b)) { const o = hatOlusum(h, d); if (o <= until) return o; }
  return null;
}
// Bir günün hatırlatıcıları (plan ekranı için), saat sırasıyla
function hatOlusumlar(tarih) {
  const d = tarihNesne(tarih);
  return V.hatirlaticilar.filter(h => h.aktif !== false && hatGunUygun(h, d, hatBas(h)))
    .map(h => ({ h, saat: h.baslangic.slice(11, 16) })).sort((a, b) => a.saat.localeCompare(b.saat));
}
const saatYazHat = o => trTarih(yerelTarih(o)) + ' ' + p2(o.getHours()) + ':' + p2(o.getMinutes());
// "5'inde", "3'ünde", "6'sında", "20'sinde" — ek, sayının okunuşunun son sesine göre
function gunEki(n) {
  const birler = ['', "'inde", "'sinde", "'ünde", "'ünde", "'inde", "'sında", "'sinde", "'inde", "'unda"];
  const onlar = { 10: "'unda", 20: "'sinde", 30: "'unda" };
  return n + (n % 10 ? birler[n % 10] : onlar[n] || "'inde");
}
function hatTekrarMetni(h) {
  if (h.tekrar === 'haftalik') return 'Her ' + (h.gunler || []).slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(g => GUN_AD[g]).join(', ');
  if (h.tekrar === 'aylik') return `Her ayın ${gunEki(hatBas(h).getDate())}`;
  return TEKRAR[h.tekrar] || TEKRAR.yok;
}

/* ── Yazıdan hatırlatıcı (çevrimdışı, kural tabanlı) ──
   "Yarın 14:30'da Ahmet Bey'i ara", "her pazartesi 9'da haftalık rapor",
   "iş günleri 08:30 posta kontrolü", "her ayın 5'inde kira", "2 saat sonra
   dosyayı gönder", "25 Ekim 10:00 duruşma için hatırlat". Anlaşılan tarih/
   saat/tekrar formda gösterilir; kullanıcı onaylayıp kaydeder. */
function hatCumleCoz(metin) {
  // Küçük yazım hatası: "har" → "her" (uzunluk aynı kalır; konumlar başlıktan silmede kullanılıyor)
  const ham = String(metin || ''), t = trK(ham).replace(/(^|[^a-zçğıöşü])h[ae]r(?=\s)/g, '$1her'), simdi = new Date(), sil = [];
  const bul = (re, f) => { re.lastIndex = 0; const m = re.exec(t); if (m) { sil.push([m.index, m.index + m[0].length]); return f(m); } return undefined; };
  const H = 'a-zçğıöşü', EK = `(?:'?(?:inde|ında|unda|ünde|nde|nda|ine|ına|una|üne|de|da|te|ta|ye|ya|e|a|i|ı|u|ü))?`;
  const sonr = { tekrar: 'yok', gunler: [] };
  // Tekrar
  // Uzun ad önce: 'pazar' 'pazartesi'nin, 'cuma' 'cumartesi'nin içinde kalmasın
  const gunRe = [...GUNLER].sort((a, b) => b.length - a.length).join('|');
  bul(new RegExp(`(^|[^${H}])(her\\s*gün|hergün|günlük\\s+olarak|her\\s*sabah|her\\s*akşam)(?![${H}])`), m => { sonr.tekrar = 'gunluk'; if (/sabah/.test(m[2])) sonr.saat = '09:00'; if (/akşam/.test(m[2])) sonr.saat = '18:00'; });
  bul(new RegExp(`(^|[^${H}])(iş\\s*günleri|hafta\\s*içi(?:leri)?|her\\s*iş\\s*günü)(?![${H}])`), () => sonr.tekrar = 'isgunu');
  bul(new RegExp(`(^|[^${H}])her\\s+((?:(?:${gunRe})${EK}(?:\\s*,\\s*|\\s+ve\\s+|\\s+)?)+)`), m => {
    sonr.tekrar = 'haftalik';
    sonr.gunler = GUNLER.map((g, i) => new RegExp(`(^|[^${H}])${g}${EK}(?![${H}])`).test(m[2]) ? i : -1).filter(i => i >= 0);
  });
  if (sonr.tekrar === 'yok') bul(new RegExp(`(^|[^${H}])(her\\s*hafta|haftalık\\s+olarak)(?![${H}])`), () => sonr.tekrar = 'haftalik');
  // Ayın günü: "5'inde", "5 inde", "5inde", "20'sinde", "5. günü" — ek ile sayı arasında boşluk/kesme olabilir
  bul(/(?:her\s*ay(?:ın)?|aylık)\s+(\d{1,2})\s*['.]?\s*(?:sinde|sında|inci|ıncı|uncu|üncü|inde|ında|unda|ünde|unde|nci|ncı|ncu|ncü|nde|nda|si|sı|i|ı|ü|u)?(?:\s*gün(?:ü|ünde)?)?(?![a-zçğıöşü\d])/, m => { sonr.tekrar = 'aylik'; sonr.ayGun = Math.min(31, +m[1]); });
  if (sonr.tekrar === 'yok') bul(new RegExp(`(^|[^${H}])(her\\s*ay|aylık\\s+olarak)(?![${H}])`), () => sonr.tekrar = 'aylik');
  // Göreli: "2 saat sonra", "30 dakika sonra", "3 gün sonra"
  let tarih = null;
  bul(/(\d+|yarım)\s*(dakika|dk|saat|gün|hafta)\s*sonra/, m => {
    const n = m[1] === 'yarım' ? 0.5 : +m[1], d = new Date(simdi);
    if (/dakika|dk/.test(m[2])) d.setMinutes(d.getMinutes() + n);
    else if (m[2] === 'saat') d.setMinutes(d.getMinutes() + Math.round(n * 60));
    else if (m[2] === 'gün') d.setDate(d.getDate() + n); else d.setDate(d.getDate() + 7 * n);
    tarih = yerelTarih(d); if (/dakika|dk|saat/.test(m[2])) sonr.saat = p2(d.getHours()) + ':' + p2(d.getMinutes());
  });
  // Saat: "14:30", "saat 9", "9'da", "sabah/öğlen/akşam"
  if (!sonr.saat) bul(/(?:saat\s*)?(\d{1,2})[:](\d{2})(?:'?(?:de|da|te|ta))?/, m => sonr.saat = p2(Math.min(23, +m[1])) + ':' + m[2]);
  if (!sonr.saat) bul(/saat\s*(\d{1,2})(?:[.](\d{2}))?(?:'?(?:de|da|te|ta))?(?!\d)/, m => sonr.saat = p2(Math.min(23, +m[1])) + ':' + (m[2] || '00'));
  if (!sonr.saat) bul(/(?:^|\s)(\d{1,2})(?:[.](\d{2}))?'(?:de|da|te|ta)(?![a-zçğıöşü])/, m => sonr.saat = p2(Math.min(23, +m[1])) + ':' + (m[2] || '00'));
  if (!sonr.saat) bul(new RegExp(`(^|[^${H}])(sabah|öğle(?:n|den sonra)?|akşam)(?![${H}])`), m => sonr.saat = /sabah/.test(m[2]) ? '09:00' : /sonra/.test(m[2]) ? '14:00' : /öğle/.test(m[2]) ? '12:00' : '18:00');
  // Tarih (terminBul ile aynı kalıplar); haftalıkta gün zaten tekrardan gelir
  if (!tarih && sonr.tekrar !== 'haftalik' && sonr.tekrar !== 'aylik') {
    const tb = terminBul(ham, simdi.toISOString());
    if (tb) tarih = tb.tarih;
    // tarih ifadesini başlıktan çıkarmak için ayrıca bul
    [/(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?/, new RegExp(`\\d{1,2}\\s+(${AYLAR.join('|')})(\\s+\\d{4})?${EK}`),
     new RegExp(`(^|[^${H}])(bugün|yarın|öbür\\s*gün|yarından\\s*sonra|haftaya|bu\\s*hafta|ay\\s*sonu(?:na kadar)?)${EK}(?![${H}])`),
     new RegExp(`(^|[^${H}])(?:bu\\s+|gelecek\\s+|önümüzdeki\\s+)?(${gunRe})(?:\\s*günü)?${EK}(?![${H}])`)]
      .forEach(re => bul(re, () => 0));
    if (/(öbür\s*gün|yarından\s*sonra)/.test(t)) { const d = new Date(); d.setDate(d.getDate() + 2); tarih = yerelTarih(d); }
  }
  if (sonr.tekrar === 'haftalik' && !sonr.gunler.length) sonr.gunler = [(tarih ? tarihNesne(tarih) : simdi).getDay()];
  const saat = sonr.saat || '09:00';
  if (!tarih) {
    if (sonr.tekrar === 'aylik' && sonr.ayGun) {
      const d = new Date(simdi.getFullYear(), simdi.getMonth(), Math.min(sonr.ayGun, 28));
      d.setDate(Math.min(sonr.ayGun, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
      if (yerelTarih(d) + 'T' + saat < yerelTarih(simdi) + 'T' + p2(simdi.getHours()) + ':' + p2(simdi.getMinutes())) d.setMonth(d.getMonth() + 1);
      tarih = yerelTarih(d);
    } else {
      // Saati bugün geçtiyse yarın (tekrarlılarda bugün başlar, ilk olusum sonraki uygun güne düşer)
      const d = new Date(); const [hh, mm] = saat.split(':').map(Number);
      if (sonr.tekrar === 'yok' && (d.getHours() * 60 + d.getMinutes()) >= hh * 60 + mm) d.setDate(d.getDate() + 1);
      tarih = yerelTarih(d);
    }
  }
  // Başlık: tanınan zaman ifadeleri ve "hatırlat / oluştur" kalıpları çıkarılır
  let b = ham.split('');
  sil.forEach(([s, e]) => { for (let i = s; i < e; i++) b[i] = ' '; });
  b = b.join('');
  const kalip = /(bana|beni|lütfen|bir\s+)?\s*hatırlat(ıcı|ma)?\s*(oluştur|kur|ekle|yap|ayarla)?|hatırlatıcı|diye|için\s*$|^\s*için|\s+ile\s*$|(^|\s)(bu|gelecek|önümüzdeki)\s*$/g;
  let tb2 = trK(b);
  let son = b;
  for (const m of [...tb2.matchAll(kalip)].reverse()) son = son.slice(0, m.index) + ' '.repeat(m[0].length) + son.slice(m.index + m[0].length);
  son = son.replace(/^\s*(bana|beni|lütfen)\s+/i, '').replace(/\s+/g, ' ').replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g, '').replace(/\s+(için|diye)$/i, '').trim();
  // "X başlıklı / adlı / isimli / konulu" → X ; tırnak içindeki başlık varsa o alınır
  const tirnak = son.match(/["“'‘]([^"”'’]{2,})["”'’]/);
  if (tirnak && /(başlık|adlı|isimli|konulu)/.test(trK(son))) son = tirnak[1];
  son = son.replace(/\s+(başlıklı|başlığıyla|başlığı\s+ile|adlı|adıyla|isimli|ismiyle|konulu|konusunda)\s*$/i, '')
           .replace(/^(başlığı|başlık|adı|konu)\s*:?\s+/i, '').trim();
  son = son ? son.charAt(0).toLocaleUpperCase('tr-TR') + son.slice(1) : 'Hatırlatıcı';
  return { baslik: son, tarih, saat, tekrar: sonr.tekrar, gunler: sonr.gunler, ayGunBelirsiz: sonr.tekrar === 'aylik' && !sonr.ayGun };
}

function hatEkSimgeleri(h) {

function hatFormGorunum() {

// Hatırlatıcının sade cümlesi: "14.10.2026 14:30 Ahmet Bey'i ara", "Her ayın 5'inde 09:00 HSE raporu"
function hatCumleYaz(h) {
  const [t, s] = h.baslangic.split('T');
  return `${h.tekrar === 'yok' ? trTarih(t) : hatTekrarMetni(h)} ${s} ${h.baslik}`.replace(/\s+/g, ' ').trim();
}
function hatYazidanDoldur(metin) {
  if (!metin.trim()) return;
  if (HT && $('#mHat').classList.contains('show')) hatFormOku(); else hatYeni();
  const c = hatCumleCoz(metin);
  Object.assign(HT, { baslik: c.baslik, baslangic: c.tarih + 'T' + c.saat, tekrar: c.tekrar, gunler: c.gunler });
  hatPencere(true);
  // Anlaşılan, "Yazarak doldur" kutusuna sade cümle olarak geri yazılır; kullanıcı
  // gerekirse düzeltip yeniden "Doldur"a basar (cümle tekrar okununca aynı sonucu verir).
  const kutu = $('#mhYazi');
  if (kutu) { kutu.value = hatCumleYaz(HT); kutu.classList.add('dolduruldu'); setTimeout(() => kutu.classList.remove('dolduruldu'), 1800); }
  // Alanları ayrıca doldur ve kısa süre vurgula (neyin dolduğu görünsün)
  const [tarih, saat] = HT.baslangic.split('T');
  const yaz = (id, v) => {
    const el = $(id); if (!el) return;
    el.value = v;
    const gorunen = el.closest('.tg') ? el.closest('.tg').querySelector('.tg-yazi') : el;
    if (gorunen !== el) gorunen.value = id === '#hTarih' ? trTarih(v) : v;
    gorunen.classList.add('dolduruldu'); setTimeout(() => gorunen.classList.remove('dolduruldu'), 1800);
  };
  yaz('#hBaslik', c.baslik); yaz('#hTarih', tarih); yaz('#hSaat', saat); yaz('#hTekrar', c.tekrar);
  hatFormGorunum();
}
function hatEkCiz() {
  const s = { posta: 'posta', belge: 'ek', is: 'aksiyon', link: 'link' };
  $('#hEkler').innerHTML = HT.ekler.length ? HT.ekler.map((e, i) =>
    `<div class="posta-satir">${svg(s[e.tur])}<span class="ps-konu" title="${esc(e.ad)}">${esc(e.ad)}</span>` +
    `<span class="ps-ek">${e.tur === 'posta' ? esc(e.kimden || '') + ' · ' + trTarihSaat(e.tarih) : e.tur === 'belge' ? Math.max(1, Math.round(e.boyut / 1024)) + ' KB' : ''}</span>` +
    `<button class="btn sm" data-hek-ac="${i}">Aç</button><button class="ikon-btn" data-hek-sil="${i}" title="Kaldır">${svg('x')}</button></div>`).join('')

function hatEkPosta(p) {
  if (HT.ekler.some(e => e.tur === 'posta' && e.id === p.id)) return toast('Bu posta zaten ekli.');
  HT.ekler.push({ tur: 'posta', id: p.id, store: p.store, msgId: p.msgId || '', ad: p.konu || '(konusuz)', kimden: p.kimden, tarih: p.tarih });
  hatEkCiz();
}
async function hatEkBelge(dosyalar) {
  for (const f of dosyalar) {
    try {
      const r = await fetch('/api/belge/yukle', { method: 'POST', body: f, headers: { 'X-IsTakip': '1', 'X-Assist-Anahtar': ASSIST_ANAHTAR, 'X-Ad': encodeURIComponent(f.name), 'Content-Type': 'application/octet-stream' } });
      const j = await r.json(); if (!r.ok || !j.ok) throw new Error(SUNUCU_METIN[j.hata] || j.hata || 'yüklenemedi');
      HT.ekler.push({ tur: 'belge', belgeId: j.id, ad: f.name, boyut: j.boyut });
    } catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  hatEkCiz();
}
function hatIsSecici() {

    if (k.tur === 'not') L.push({ v: k.id + '|', ad: `${k.no} · ${k.baslik}` });

  $('#hIsSec').innerHTML = L.length ? `<div class="doldur" style="background:var(--s-concrete)"><select id="hIsSecim" style="flex:1;padding:6px 8px;border:1px solid var(--s-line);border-radius:7px">${
    L.map(x => `<option value="${x.v}">${esc(x.ad)}</option>`).join('')}</select><button class="btn sm primary" id="hIsEkle">Ekle</button></div>` : '<div class="note">Bağlanacak açık iş yok.</div>';
}
function hatKaydet() {

}
function hatKapat(sor) {

function hatSil(id) {

/* ═══════════════════════════════════════════════════════════════
   BİLDİRİMLER — zil + masaüstü
   Zil: termini geçen, bugün ve ilk hatırlatma gününden itibaren
   yaklaşan işler. Masaüstü: yalnız seçilen hatırlatma günlerinde,
   termin günü ve termin geçince (bir kez ya da her gün).
   ═══════════════════════════════════════════════════════════════ */
function bildirimHesapla() {
  const A = V.ayar, enUzak = A.hatirlatGun.length ? Math.max(...A.hatirlatGun) : 0, B = [];
  for (const i of isler()) {
    const g = gunFark(i.termin);
    if (g === null || g > enUzak) continue;
    const ad = (i.a ? 'Aksiyon: ' : '') + i.baslik;
    if (g < 0) B.push({ seviye: 'kritik', g, baslik: ad, metin: `${i.a ? i.a.no : i.k.no} · termini ${-g} gün geçti`, k: i.k.id, a: i.a && i.a.id,
      anahtar: `${i.id}|gecti|${A.gecikenHerGun ? bugun() : i.termin}`, masaustu: true });
    else B.push({ seviye: g === 0 ? 'uyari' : 'bilgi', g, baslik: ad, metin: `${i.a ? i.a.no : i.k.no} · ${g === 0 ? 'termin bugün' : g === 1 ? 'termin yarın' : g + ' gün kaldı'}`,
      k: i.k.id, a: i.a && i.a.id, anahtar: `${i.id}|${g}|${i.termin}`, masaustu: A.hatirlatGun.includes(g) });
  }
  B.sort((x, y) => x.g - y.g);
  // Zamanı gelmiş hatırlatıcılar (son 24 saat) en üstte
  const simdiD = new Date();
  V.hatirlaticilar.filter(h => h.aktif !== false).forEach(h => {
    const o = hatSon(h, simdiD);
    if (o && simdiD - o < 864e5) B.unshift({ seviye: 'uyari', baslik: h.baslik, metin: ` · ${p2(o.getHours())}:${p2(o.getMinutes())}`, hat: h.id,
      anahtar: `H|${h.id}|${yerelTarih(o)}T${p2(o.getHours())}:${p2(o.getMinutes())}` });
  });
  if (POSTA_BEKLEYEN) B.unshift({ seviye: 'bilgi', baslik: `${POSTA_BEKLEYEN} posta kayda eklenmedi`, metin: postaKaynakSecenek().find(x => x[0] === A.posta.kaynak)[1],
    hedef: 'posta', anahtar: `posta|${POSTA_BEKLEYEN}|${bugun()}`, masaustu: true });
  return B;
}

/* ── SAKLAMA SÜRESİ (KVKK: gereğinden uzun tutma) ──
   Seçilen süreden eski: kapanmış (Tamamlandı/İptal) talepler, kapanmış
   aksiyonlar ve notlar silinir. Açık işe dokunulmaz. Kayıtlı posta kopyaları
   bağlı kayıt silinince sunucuda temizlenir. Her açılışta uygulanır. */
function saklamaSinir(ay) { const d = new Date(); d.setMonth(d.getMonth() - ay); return d.toISOString(); }
function saklamaUygula(ay, sadeceSay) {
  if (!ay) return 0;
  const s = saklamaSinir(ay), eski = t => !!t && t < s;
  let n = 0;
  const kalan = [];
  for (const k of V.kayitlar) {
    if (k.tur === 'not' && eski(k.olusturma)) { n++; continue; }
    if (k.tur === 'talep' && !acikMi(k) && eski(k.kapanis || k.guncelleme)) { n += 1 + k.aksiyonlar.length; continue; }
    if (k.tur === 'posta') {
      const ak = k.aksiyonlar.filter(a => !(a.durum === 'tamam' && eski(a.tamamTarih)));
      n += k.aksiyonlar.length - ak.length;
      if (!sadeceSay) k.aksiyonlar = ak;
      if (!ak.length) continue;   // aksiyonu kalmayan posta taşıyıcısı da gider
    }
    kalan.push(k);
  }

/* ═══════════════════════════════════════════════════════════════
   ORTAK İŞLER (15.10.2026): şirket kişileriyle konu + alt alta, değiştirilemez kayıt defteri.
   Veri sunucuda (ortak.dat, şifreli); katılımcılar arasında Exchange iletisiyle eşitlenir.
   Kurallar: katılımcı ekleme ve kapatma yalnız konuyu açan; ek yok; yeni katılan katıldığı
   andan sonrasını görür, açan "Geçmişi paylaş" ile önceki girişleri gönderebilir.
   ═══════════════════════════════════════════════════════════════ */
let ORTAK = null, ORTAK_BEN = null, ORTAK_SECILI = '', ORTAK_REV = -1, ORTAK_BEKLEYEN = 0, OK_KISILER = [], ORTAK_KURAL = '';
const ortakBenMi = e => (e || '').toLowerCase() === (ORTAK_BEN && ORTAK_BEN.eposta || '');
const ortakAcanMi = k => ortakBenMi(k.acan && k.acan.eposta);
const ortakSonT = k => { const g = k.girisler || []; return g.length ? g[g.length - 1].t : (k.olusturma || ''); };
const ortakOkunmamis = k => (k.girisler || []).filter(g => g.t > (k.okunan || '') && !ortakBenMi(g.yazar && g.yazar.eposta)).length;
function ortakZaman(t) {
  if (!t) return '';
  const d = new Date(t), bg = bugun();
  return (yerelTarih(d) === bg ? 'Bugün' : trTarih(yerelTarih(d))) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
async function ortakYukle() {
  try { const j = await apiJson('/api/ortak'); ORTAK = j.konular || []; ORTAK_BEN = j.ben || null; ORTAK_BEKLEYEN = j.bekleyen || 0; ORTAK_KURAL = j.kural || ''; }
  catch (e) { if (ORTAK === null) ORTAK = []; }
  ortakSayac();
  if (aktif === 'ortak' && !$('#v-ortak textarea:focus') && !$('#v-ortak input:focus')) ortakCiz();
}
function ortakSayac() {
  const n = (ORTAK || []).reduce((s, k) => s + ortakOkunmamis(k), 0), e = $('#snOrtakSay');
  if (e) e.textContent = n ? (n > 99 ? '99+' : n) : '';
}
function ortakCiz() {
  const v = $('#v-ortak'); if (!v) return;
  if (ORTAK === null) { v.innerHTML = '<div class="vhead"><h1>Ortak İşler</h1></div><div class="yukleniyor">Yükleniyor…</div>'; ortakYukle(); return; }
  const L = [...ORTAK].sort((a, b) => ((a.durum === 'acik' ? 0 : 1) - (b.durum === 'acik' ? 0 : 1)) || ortakSonT(b).localeCompare(ortakSonT(a)));
  if (!L.find(k => k.id === ORTAK_SECILI)) ORTAK_SECILI = L.length ? L[0].id : '';
  const k = L.find(x => x.id === ORTAK_SECILI);
  const liste = L.length ? L.map(x => { const n = ortakOkunmamis(x);
    return `<button class="ortak-oge${x.id === ORTAK_SECILI ? ' sec' : ''}${x.durum !== 'acik' ? ' kapali' : ''}" data-ortak="${esc(x.id)}">
      <div class="oo-ust"><b>${esc(x.baslik)}</b>${n ? `<span class="oo-say">${n}</span>` : ''}</div>
      <div class="oo-alt">${(x.katilimcilar || []).length} kişi${x.durum !== 'acik' ? ' · Kapalı' : ''} · ${esc(ortakZaman(ortakSonT(x)))}</div></button>`; }).join('')
    : '<div class="od-not">Henüz ortak iş yok. "Yeni Ortak İş" ile başlayın.</div>';
  v.innerHTML = `<div class="vhead"><h1>Ortak İşler</h1><span class="sp"></span>${ORTAK_BEKLEYEN ? `<span class="badge amber" data-ipucu="Outlook'a ulaşılınca kendiliğinden gönderilir">${ORTAK_BEKLEYEN} gönderim bekliyor</span>` : ''}
    <button class="btn primary" id="okYeni"><svg class="i"><use href="#ic-arti"/></svg>Yeni Ortak İş</button></div>
    ${ORTAK_KURAL === 'hata' ? `<div class="note warn" style="margin:0 0 12px">Outlook kuralı otomatik eklenemedi (Outlook'unuzda web'den oluşturulmuş kurallar var). Kural yokken ortak iş iletileri birkaç saniye Gelen Kutusu'nda görünür. Bir kez elle ekleyin:
      <b>Dosya › Kuralları ve Uyarıları Yönet › Yeni Kural</b> › Aldığım iletilere kural uygula › <b>konusunda belirli sözcükler geçen</b>: <code>[Assist] Ortak iş:</code> › <b>belirtilen klasöre taşı</b>: Gelen Kutusu › Assist ve <b>başka kural işlemeyi durdur</b> › ad: <code>Assist ortak işler</code>.
      <button class="btn sm" id="okKuralBak" style="margin-left:8px">Kontrol et</button></div>` : ''}
    <div class="ortak-duzen"><div class="card ortak-liste">${liste}</div><div class="card ortak-detay">${k ? ortakDetayHtml(k) : '<div class="od-not">Soldan bir konu seçin.</div>'}</div></div>`;
  if (k && ortakOkunmamis(k)) {   // görülen konu okundu sayılır (sarı vurgu bu çizimde kalır)
    const son = ortakSonT(k);
    apiJson('/api/ortak/okundu', { method: 'POST', body: JSON.stringify({ id: k.id }) }).catch(() => {});
    setTimeout(() => { k.okunan = son; ortakSayac(); }, 0);
  }
  const d = $('#v-ortak .od-defter'); if (d) d.scrollTop = d.scrollHeight;
}
function ortakDetayHtml(k) {
  const acan = ortakAcanMi(k), acik = k.durum === 'acik';
  const kisiler = (k.katilimcilar || []).map(p => {
    const ben = ortakBenMi(p.eposta), sahip = (p.eposta || '').toLowerCase() === (k.acan.eposta || '').toLowerCase();
    return `<span class="od-kisi" data-ipucu="${esc(p.eposta || '')}">${esc(p.ad || p.eposta)}${sahip ? ' <i>açan</i>' : ''}${ben ? ' <i>siz</i>' : ''}${acan && !ben && acik ? ` <button data-ortak-gecmis="${esc(p.eposta)}" data-ipucu="Önceki bütün girişleri bu kişiye gönder">Geçmişi paylaş</button>` : ''}</span>`;
  }).join('');
  const defter = (k.girisler || []).map(g => `<li class="${g.tur !== 'not' ? 'sistem' : ''}${g.t > (k.okunan || '') && !ortakBenMi(g.yazar && g.yazar.eposta) ? ' yeni' : ''}">
      <div class="ust"><b>${esc(g.yazar && g.yazar.ad || '')}</b>${g.aktaran ? '<small class="aktarildi" title="Bu girişi konuyu açan kişi aktardı; yazarı doğrulanamaz.">aktarılan</small>' : ''}<span>${esc(ortakZaman(g.t))}</span></div><div class="metin">${esc(g.metin || '')}</div></li>`).join('');
  return `<div class="od-bas"><div class="od-bas-ust"><h2>${esc(k.baslik)}</h2>
      ${acan ? `<button class="btn sm" data-ortak-durum="${acik ? 'kapat' : 'ac'}">${acik ? 'Konuyu kapat' : 'Yeniden aç'}</button>` : ''}</div>
    <div class="od-bilgi"><span>Açan: <b>${esc(k.acan.ad || '')}</b></span><span>Açılış: ${esc(ortakZaman(k.olusturma))}</span>${k.termin ? `<span>Termin: <b>${esc(trTarih(k.termin))}</b> ${kalanHtml(k.termin)}</span>` : ''}<span>Durum: <b>${acik ? 'Açık' : 'Kapalı'}</b></span></div>
    <div class="od-kisiler">${kisiler}${acan && acik ? `<span class="od-ekle"><input id="okEkleGir" data-kisi-sec autocomplete="off" placeholder="+ Katılımcı ekle"></span>` : ''}</div></div>
    <ul class="od-defter">${defter || '<li class="sistem"><div class="metin">Henüz giriş yok.</div></li>'}</ul>
    ${acik ? `<div class="od-yaz"><textarea id="okGiris" placeholder="Ne yapıldı? (Ctrl+Enter ile gönder)"></textarea><button class="btn primary" id="okGonder">Gönder</button></div>`
      : '<div class="od-not">Konu kapalı; yeni giriş eklenemez.</div>'}`;
}
// Rehberden e-posta: kişi seçicisi yalnız adı yazar
function ortakKisiBul(ad) {
  const r = (REHBER || []).find(x => trK(x.ad) === trK(ad));
  return r && r.eposta ? { ad: r.ad, eposta: r.eposta.toLowerCase() } : null;
}
function ortakYeniAc() {
  OK_KISILER = [];
  $('#moGovde').innerHTML = `<div class="field"><label>Başlık</label><input id="moBaslikGir" maxlength="200"></div>
    <div class="field"><label>Katılımcılar <small style="font-weight:400;color:var(--s-graphite)">(yalnız Assist kullanan şirket kişileri)</small></label><input id="moKisiGir" data-kisi-sec autocomplete="off" placeholder="Ad yazın, listeden seçin"><div class="mo-kisiler" id="moKisiler"></div></div>
    <div class="grid2"><div class="field"><label>Termin <small style="font-weight:400;color:var(--s-graphite)">(isteğe bağlı)</small></label><input id="moTermin" type="date"></div></div>
    <div class="field"><label>Açıklama <small style="font-weight:400;color:var(--s-graphite)">(isteğe bağlı; defterin ilk girişi olur)</small></label><textarea id="moAciklama" rows="3"></textarea></div>`;
  $('#moSonuc').textContent = ''; $('#moSonuc').className = 'ayar-sonuc';
  $('#mOrtak').classList.add('show'); setTimeout(() => $('#moBaslikGir').focus(), 50);
  if (REHBER === null && !REHBER_YUKLENIYOR) rehberYukle();
}
function ortakYeniKisiCiz() {
  $('#moKisiler').innerHTML = OK_KISILER.map((p, i) => `<span class="oda-cip">${esc(p.ad)}<button class="ikon-btn" data-mo-sil="${i}" title="Çıkar" style="width:20px;height:20px">${svg('x')}</button></span>`).join('');
}
async function ortakYeniKaydet() {
  const s = $('#moSonuc'), baslik = $('#moBaslikGir').value.trim();
  if (!baslik) { s.className = 'ayar-sonuc hata'; s.textContent = 'Başlık yazın.'; return; }
  if (!OK_KISILER.length) { s.className = 'ayar-sonuc hata'; s.textContent = 'En az bir katılımcı seçin.'; return; }
  s.className = 'ayar-sonuc'; s.textContent = 'Gönderiliyor…'; $('#moKaydet').disabled = true;
  try {
    const j = await apiJson('/api/ortak/yeni', { method: 'POST', body: JSON.stringify({ baslik, termin: $('#moTermin').value, aciklama: $('#moAciklama').value, katilimcilar: OK_KISILER }) });
    $('#mOrtak').classList.remove('show'); ORTAK_SECILI = j.id;
    toast(j.gonderildi ? 'Ortak iş oluşturuldu ve katılımcılara gönderildi.' : 'Ortak iş oluşturuldu; Outlook\'a ulaşılınca gönderilecek.');
    await ortakYukle(); git('ortak');
  } catch (e) { s.className = 'ayar-sonuc hata'; s.textContent = e.message; }
  $('#moKaydet').disabled = false;
}
async function ortakGirisGonder() {
  const g = $('#okGiris'), metin = g.value.trim(); if (!metin) return;
  $('#okGonder').disabled = true;
  try { const j = await apiJson('/api/ortak/giris', { method: 'POST', body: JSON.stringify({ id: ORTAK_SECILI, metin }) }); g.value = ''; if (!j.gonderildi) toast('Giriş kaydedildi; Outlook\'a ulaşılınca gönderilecek.'); await ortakYukle(); ortakCiz(); }
  catch (e) { toast(e.message, true); $('#okGonder').disabled = false; }
}
async function ortakYonet(govde, soru) {
  if (soru && !confirm(soru)) return;
  try { const j = await apiJson('/api/ortak/yonet', { method: 'POST', body: JSON.stringify(Object.assign({ id: ORTAK_SECILI }, govde)) }); if (!j.gonderildi) toast('Kaydedildi; Outlook\'a ulaşılınca gönderilecek.'); await ortakYukle(); ortakCiz(); }
  catch (e) { toast(e.message, true); }
}
document.addEventListener('click', e => {
  const c = s => e.target.closest(s); let x;
  if (c('#okYeni')) return ortakYeniAc();
  if (c('#okKuralBak')) return apiJson('/api/ortak/kural', { method: 'POST', body: '{}' }).then(j => { ORTAK_KURAL = j.kural || ''; toast(ORTAK_KURAL === 'var' || ORTAK_KURAL === 'kuruldu' ? 'Outlook kuralı bulundu.' : 'Kural hâlâ bulunamadı; adı tam olarak \"Assist ortak işler\" olmalı.', !(ORTAK_KURAL === 'var' || ORTAK_KURAL === 'kuruldu')); ortakCiz(); }).catch(er => toast(er.message, true));
  if (c('#moKaydet')) return ortakYeniKaydet();
  if (c('#mOrtak [data-kapat]') || e.target.id === 'mOrtak') return $('#mOrtak').classList.remove('show');
  if ((x = c('[data-mo-sil]'))) { OK_KISILER.splice(+x.dataset.moSil, 1); return ortakYeniKisiCiz(); }
  if ((x = c('[data-ortak]'))) { ORTAK_SECILI = x.dataset.ortak; return ortakCiz(); }
  if (c('#okGonder')) return ortakGirisGonder();
  if ((x = c('[data-ortak-durum]'))) return ortakYonet({ islem: x.dataset.ortakDurum }, x.dataset.ortakDurum === 'kapat' ? 'Konu kapatılsın mı? Katılımcılar artık giriş ekleyemez.' : 'Konu yeniden açılsın mı?');
  if ((x = c('[data-ortak-gecmis]'))) { const p = (ORTAK.find(k => k.id === ORTAK_SECILI).katilimcilar || []).find(k => (k.eposta || '') === x.dataset.ortakGecmis); return ortakYonet({ islem: 'gecmis', eposta: x.dataset.ortakGecmis }, `${p ? p.ad : x.dataset.ortakGecmis} kişisine bu konunun önceki bütün girişleri gönderilsin mi?`); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'moKisiGir') {
    const p = ortakKisiBul(e.target.value); e.target.value = '';
    if (!p) return toast('Bu kişinin e-posta adresi rehberde yok.', true);
    if (ortakBenMi(p.eposta)) return toast('Kendinizi eklemenize gerek yok; konuyu açan olarak zaten katılımcısınız.');
    if (!OK_KISILER.some(k => k.eposta === p.eposta)) OK_KISILER.push(p);
    ortakYeniKisiCiz();
  }
  if (e.target.id === 'okEkleGir') {
    const p = ortakKisiBul(e.target.value); e.target.value = '';
    if (!p) return toast('Bu kişinin e-posta adresi rehberde yok.', true);
    ortakYonet({ islem: 'katilimci', kisiler: [p] }, `${p.ad} katılımcı olarak eklensin mi? Yalnız bundan sonraki girişleri görür; önceki girişler için "Geçmişi paylaş"ı kullanın.`);
  }
});
document.addEventListener('keydown', e => { if (e.target.id === 'okGiris' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ortakGirisGonder(); } });

let postaZ = null;
function postaZamanlayici() {
  clearInterval(postaZ);
  postaZ = setInterval(postaArkaPlanKontrol, Math.max(5, V.ayar.kontrolDk) * 60000);
}

// Açılış ekranı en az 0,9 sn görünür (anında kaybolup göz kırpmasın), sonra solar ve kaldırılır
const ACILIS_T0 = performance.now();
function acilisBitir() {
  const a = $('#acilis'); if (!a) return;
  // İzleme modu (?acilis=1): açılış ekranı tıklanana kadar kalır (tasarımı incelemek için)
  if (new URLSearchParams(location.search).has('acilis')) { a.style.cursor = 'pointer'; a.title = 'Kapatmak için tıklayın'; a.onclick = () => { a.classList.add('bitti'); setTimeout(() => a.remove(), 500); }; return; }
  const kapat = () => setTimeout(() => { a.classList.add('bitti'); setTimeout(() => a.remove(), 500); }, Math.max(0, 900 - (performance.now() - ACILIS_T0)));
  // İlk açılış (Assist.bat, ?ilk=1): logo, Outlook ve MiCollab kullanılabilir olana kadar döner (sunucu
  // uygulamaların kendi kayıtlarından anlar). Ayarlar'da kapalı / yüklü olmayan beklenmez; en çok 30 sn.
  // Adres düzeltilir: sayfa yenilenince yeniden beklemesin.
  if (!new URLSearchParams(location.search).has('ilk')) return kapat();
  const u = new URL(location.href); u.searchParams.delete('ilk'); history.replaceState(history.state, '', u);
  const yazi = document.createElement('div'); yazi.className = 'acilis-durum'; a.appendChild(yazi);
  const ad = { outlook: 'Outlook', micollab: 'MiCollab' }, en = DIL === 'en';
  const bak = async () => {
    try {
      const j = await apiJson('/api/acilis/durum');
      const bekleyen = Object.entries(j.uygulamalar).filter(([, v]) => !v.hazir).map(([k]) => ad[k] || k);
      if (!bekleyen.length) return kapat();
      yazi.textContent = en ? `Waiting for ${bekleyen.join(' and ')}…` : `${bekleyen.join(' ve ')} açılıyor…`;
    } catch { }
    if (performance.now() - ACILIS_T0 > 30000) return kapat();
    setTimeout(bak, 700);
  };
  bak();
}
(async function basla() {
  setTimeout(() => { const a = document.getElementById('acilis'); if (a) { a.classList.add('bitti'); setTimeout(() => a.remove(), 500); } }, 32000);   // ne olursa olsun takılı kalmasın
  if (location.protocol === 'file:') {
    acilisBitir();
    document.querySelector('main').innerHTML = '<div class="view active"><div class="note warn">Bu sayfa doğrudan açılmaz. Klasördeki <b>Assist.bat</b> dosyasını çalıştırın.</div></div>';
    return;
  }
  try { await yukle(); }
  catch (e) {
    acilisBitir();
    document.querySelector('main').innerHTML = `<div class="view active"><div class="note warn">Sunucuya ulaşılamadı: ${esc(e.message)}<br>Klasördeki <b>Assist.bat</b> dosyasını çalıştırın.</div></div>`;
    return;
  }
  bildirimTemizle();
  const silinen = saklamaUygula(V.ayar.saklamaAy);
  if (silinen) { kaydet(); setTimeout(() => toast(`Saklama süresi dolan ${silinen} kayıt silindi.`), 800); }
  dlSorumluDoldur();
  hosgeldinYaz();
  temaUygula();
  dilUygula();
  havaYukle();
  sayacYukle();   // balon sayaçları: okunmamış posta, cevapsız arama
  postaRevBak();   // yeni posta anında
  gelenTalepAl();
  apiJson('/api/kullanici').then(j => { KULLANICI_AD = j.ad || ''; hosgeldinYaz(); }).catch(() => {});
  kisiStilYukle();   // kişiye özel ad görünümü (paylaşılan dosyadan)
  hashIsle();
  acilisBitir();
  bildirimKontrol();
  setInterval(() => { bildirimKontrol(); if (aktif === 'ana') anaCiz(); }, 60000);
  postaZamanlayici();
  setTimeout(postaArkaPlanKontrol, 2500);
})();
