<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STFA Assist</title>
<link rel="icon" href="/favicon.ico?v=20261015">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Lexend+Exa:wght@300&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Portal ailesinin (HSE / Kalite / Hukuk) jeton kümesi — aynı görünsün diye
   burada tekrar tanımlanır; uygulama tek dosya olarak taşınabilmeli. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --s-ink:#14181F; --s-2:#1B212B; --s-slate:#2A3340;
  --s-red:#D8232A; --s-red-deep:#A81A20;
  --s-concrete:#F4F5F7; --s-cloud:#FFFFFF; --s-line:#E3E6EB;
  --s-graphite:#5A6472; --s-graphite2:#8A94A3; --s-inktext:#1C2430;
  --s-green:#2E9E6B; --s-amber:#E8A13A; --s-blue:#3E77C2;
  --s-green-bg:#E7F5EE; --s-amber-bg:#FCF2E3; --s-blue-bg:#E9F1FA; --s-red-bg:#FBE9EA;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-display:'Archivo',var(--font);
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(20,24,31,.06),0 4px 16px rgba(20,24,31,.05);
}
/* Kaydırma çubuğunun yeri HER sayfada ayrılır: uzun sayfada çubuk çıkınca sayfa daralıp sağdaki
   düğmeler (üst bar, balonlar) 15px kayıyordu (kullanıcı, 14.10.2026). Eski tarayıcıda overflow-y yedek. */
html{overflow-y:scroll;scrollbar-gutter:stable}
@supports (scrollbar-gutter:stable){html{overflow-y:auto}}
body{font-family:var(--font);background:var(--s-concrete);color:var(--s-inktext);font-size:14px;line-height:1.55;min-height:100vh;padding-left:64px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.25}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── ÜST ŞERİT ── */
.topbar{background:var(--s-ink);color:#fff;padding:0 22px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s-red)}
/* Logodaki STFA yazisinin stili: genis geometrik harf, logo grisi (kenar cubugundaki logo gibi parlatilmis) */
/* Geniş geometrik harf, ince (Lexend Exa 300, 21px): logodaki A ile aynı kalınlık (kullanıcı 300'ü seçti, 15.10.2026). */
.tb-brand{font-family:'Lexend Exa','Bahnschrift',var(--font-display);font-weight:300;font-size:21px;letter-spacing:.04em;text-transform:uppercase;color:#C3C5C8}   /* lang=en: Turkce buyuk harf 'ASSİST' yapmasin */
.tb-spacer{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E6EAF0;
        height:34px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.tb-btn:hover{background:rgba(255,255,255,.15)}
a.tb-btn{text-decoration:none}
.tb-dil{font-size:11.5px;font-weight:800;letter-spacing:.04em;width:auto;padding:0 9px;gap:5px}
.tb-dil .ok{width:9px;height:6px}
.tb-dil-sar{position:relative}
.dil-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:#fff;color:var(--s-ink);border:1px solid var(--s-line);border-radius:9px;
  box-shadow:0 10px 26px rgba(15,23,32,.2);padding:4px;min-width:140px}
.dil-menu[hidden]{display:none}
.dil-menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;background:none;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:inherit}
.dil-menu button:hover{background:var(--s-paper)} .dil-menu button.acik{background:var(--s-ink);color:#fff}
.dil-menu small{font-size:10.5px;opacity:.6;font-weight:800}
.tb-kisi{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--s-red);color:#fff;font-size:12.5px;font-weight:800;
  cursor:pointer;display:grid;place-items:center;letter-spacing:.02em;margin-left:2px}
.tb-kisi:hover{border-color:#fff}
/* GECE MODU: sayfa tek filtreyle koyulaşır (açık renkler tersine döner, renk tonları korunur);
   zaten koyu olan üst bar, kenar menü, balonlar ve görseller geri çevrilip aslına döner. */
html[data-tema="koyu"]{filter:invert(1) hue-rotate(180deg);background:#fff}
html[data-tema="koyu"] :is(.topbar,.tabs,.kisi-balon,.toast,.arama-pencere,.acilis),
html[data-tema="koyu"] img:not(.tabs img):not(.topbar img){filter:invert(1) hue-rotate(180deg)}
/* Üst bardaki açılır menüler (bildirimler, dil) beyaz zeminli: üst bar geri çevrildiği için bunlar bir kez daha çevrilir, sayfa gibi koyu görünür */
html[data-tema="koyu"] .topbar :is(.bld-menu,.dil-menu){filter:invert(1) hue-rotate(180deg)}
.tb-btn svg.i{width:15px;height:15px}
.tb-ikon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:34px;background:rgba(255,255,255,.08);
         border:1px solid rgba(255,255,255,.16);color:#E6EAF0;border-radius:8px;cursor:pointer;padding:0}
.tb-ikon:hover{background:rgba(255,255,255,.16)}
.tb-ikon.acik{background:var(--s-red);border-color:var(--s-red)}
/* Açılış ekranı: koyu zemin, yuvarlak Assist logosu, etrafında dönen bordo halka, altında ASSIST */
.acilis{position:fixed;inset:0;z-index:9999;background:var(--s-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  transition:opacity .45s ease,visibility .45s}
.acilis.bitti{opacity:0;visibility:hidden}
.acilis-logo{position:relative;width:236px;height:236px;display:grid;place-items:center}
.acilis-daire{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 34px rgba(0,0,0,.4);
  animation:acilisNabiz 1.8s ease-in-out infinite}
.acilis-daire img{width:100%;height:100%;display:block}
.acilis-halka{position:absolute;inset:0;border-radius:50%;border:5px solid rgba(255,255,255,.1);border-top-color:var(--s-red);border-right-color:var(--s-red);
  animation:acilisDon 1s linear infinite}
.acilis-ad{font-family:'Lexend Exa','Bahnschrift',var(--font-display);font-weight:300;font-size:36px;letter-spacing:.16em;text-transform:uppercase;color:#C3C5C8}
.acilis-durum{min-height:18px;margin-top:-8px;font:500 13px var(--font);color:#8B93A0;letter-spacing:.02em}
html:has(#acilis:not(.bitti)){overflow:hidden;scrollbar-gutter:auto}   /* açılışta kaydırma çubuğu görünmesin */
@keyframes acilisDon{to{transform:rotate(360deg)}}
@keyframes acilisNabiz{50%{transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){.acilis-halka{animation-duration:2.5s}.acilis-daire{animation:none}}
/* ORTAK İŞLER */
.ortak-duzen{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.ortak-liste{max-height:calc(100vh - 160px);overflow:auto}
.ortak-oge{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--s-line);background:none;padding:10px 14px;cursor:pointer;color:inherit;font:inherit}
.ortak-oge:hover{background:var(--s-concrete)} .ortak-oge.sec{background:#FBEFF0;box-shadow:inset 3px 0 0 var(--s-red-deep)}
.oo-ust{display:flex;gap:8px;align-items:center} .oo-ust b{flex:1;font-weight:600;font-size:13.5px}
.ortak-oge.kapali .oo-ust b{color:var(--s-graphite);font-weight:500}
.oo-say{background:var(--s-red);color:#fff;border-radius:99px;font-size:11px;font-weight:500;min-width:18px;height:18px;padding:0 6px;display:inline-grid;place-items:center}
.oo-alt{font-size:12px;color:var(--s-graphite);margin-top:2px}
.od-bas{padding:14px 18px;border-bottom:1px solid var(--s-line)}
.od-bas-ust{display:flex;gap:10px;align-items:flex-start} .od-bas h2{font-size:18px;margin:0 0 6px;flex:1}
.od-bilgi{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--s-graphite)}
.od-kisiler{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.od-kisi{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s-line);border-radius:99px;padding:3px 10px;font-size:12px;background:#fff}
.od-kisi i{font-style:normal;color:var(--s-graphite);font-size:11px}
.od-kisi button{border:none;background:none;color:var(--s-red-deep);font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
.od-ekle{display:flex;gap:6px;align-items:center} .od-ekle input{width:200px;padding:4px 8px;font-size:12.5px}
.od-defter{list-style:none;margin:0;padding:4px 18px;max-height:calc(100vh - 390px);min-height:120px;overflow:auto}
.od-defter li{padding:9px 0;border-bottom:1px dashed var(--s-line)}
.od-defter li:last-child{border-bottom:none}
.od-defter .ust{display:flex;gap:10px;font-size:12px;color:var(--s-graphite)} .od-defter .ust b{color:var(--s-inktext);font-weight:600}
.od-defter .metin{white-space:pre-wrap;font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.od-defter li.sistem .metin{font-style:italic;color:var(--s-graphite)}
.od-defter li.yeni{background:#FFF8E6;margin:0 -18px;padding:9px 18px}
.od-yaz{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--s-line);align-items:flex-end}
.od-yaz textarea{flex:1;min-height:46px;resize:vertical}
.od-not{padding:10px 18px;font-size:12.5px;color:var(--s-graphite)}
.mo-kisiler{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media (max-width:900px){.ortak-duzen{grid-template-columns:1fr}}
/* Uygulama penceresi düğmeleri (geri/ileri solda, tam ekran/çıkış sağda) */
.tb-gez{display:flex;gap:6px}
.tb-gez[hidden]{display:none}
#tbGez{margin-right:8px}
#tbPencere{margin-left:6px;padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}
.tb-ikon:disabled{opacity:.35;cursor:default;background:rgba(255,255,255,.08)}
.tb-cikis:hover{background:var(--s-red);border-color:var(--s-red)}
/* Bildirim sayıları (zil, kenar menü, balonlar, bildirim listesi) aynı ince kalınlıkta: 500 (15.10.2026) */
.tb-say{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--s-red);color:#fff;
        font-size:10.5px;font-weight:500;display:none;align-items:center;justify-content:center;border:2px solid var(--s-ink)}   /* ince rakam (kullanıcı istedi, 15.10.2026; önceden 800) */
.tb-say.var{display:inline-flex}
.tb-bld{position:relative}
.bld-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;color:var(--s-inktext);border:1px solid var(--s-line);border-radius:10px;
          box-shadow:0 10px 28px rgba(20,24,31,.22);z-index:200;display:none;width:min(420px,calc(100vw - 24px));max-height:70vh;overflow:auto}
.bld-menu.acik{display:block}
.bld-menu-h{padding:10px 14px;border-bottom:1px solid var(--s-line);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.bld-menu-h .sp{flex:1}
.bld-yeni-say{background:var(--s-red);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:500}
.bld-okundu{border:1px solid var(--s-line);background:#fff;border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--s-ink)}
.bld-okundu:hover{border-color:var(--s-ink)}
.bld-oge.yeni{background:#FFF7F7}
.bld-oge{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--s-line);cursor:pointer}
.bld-oge:last-child{border-bottom:none}
.bld-oge:hover{background:var(--s-concrete)}
.bld-nokta{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--s-blue)}
.bld-nokta.kritik{background:var(--s-red)} .bld-nokta.uyari{background:var(--s-amber)}
.bld-metin{flex:1;min-width:0}
.bld-metin b{display:block;font-size:12.5px;font-weight:500;color:var(--s-graphite)}
.bld-oge.yeni .bld-metin b{font-weight:800;color:var(--s-inktext)}
.bld-metin span{display:block;font-size:11.5px;color:var(--s-graphite);margin-top:1px}
.bld-bos{padding:18px 14px;font-size:12.5px;color:var(--s-graphite2)}

/* ── KENAR ÇUBUĞU (HSE/Hukuk kalıbı: 64 px ray, üzerine gelince açılır) ── */
.tabs{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--s-ink);z-index:45;display:flex;flex-direction:column;overflow:hidden;
      transition:width .18s ease;box-shadow:2px 0 0 rgba(255,255,255,.04)}
.tabs:hover{width:236px;box-shadow:12px 0 32px rgba(0,0,0,.28)}
/* Logo satırı HSE/Hukuk portallarıyla birebir: kapalı rayda yalnız soldaki bayrak
   işareti (logonun ilk ~40 px'i), ray açılınca tam logo. */
.sb-logo-row{display:flex;align-items:center;height:56px;box-sizing:border-box;padding:0 12px;flex-shrink:0;border-bottom:1px solid #2E3742;white-space:nowrap;overflow:hidden}
/* Kenar menü logosu: yuvarlak Assist logosu A harfidir; menü açılınca yanında "SSIST" belirir (Ⓐ + SSIST = ASSIST) */
.sb-logo-kutu{display:flex;align-items:center;gap:3px;width:40px;overflow:hidden;transition:width .18s ease}
.sb-logo-simge{width:38px;height:38px;flex-shrink:0;display:block}
.sb-logo-simge svg{display:block}
.sb-logo-yazi{font-family:'Lexend Exa','Bahnschrift',var(--font-display);font-weight:300;font-size:25px;line-height:1;letter-spacing:.04em;text-transform:uppercase;color:#C3C5C8;
  opacity:0;transition:opacity .18s ease;transform:translateY(1px)}
.tabs:hover .sb-logo-yazi{opacity:1}
.tabs:hover .sb-logo-kutu{width:180px}
.sn-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0}
.sn-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 22px;margin-top:2px;background:none;border:none;
         color:#C4CBD6;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;text-align:left;transition:background .12s,color .12s}
.sn-item svg.i{width:19px;height:19px}
.sn-item span{opacity:0;transition:opacity .12s}
.tabs:hover .sn-item span{opacity:1}
.sn-item:hover{background:linear-gradient(90deg,rgba(216,35,42,.18),transparent);color:#fff}
.sn-item.active{color:#fff;background:linear-gradient(90deg,rgba(216,35,42,.28),transparent)}
.sn-item:hover::before,.sn-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--s-red);border-radius:0 3px 3px 0}
.sn-say{margin-left:auto;font-size:11px;font-weight:500;min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:var(--s-red);color:#fff;
        display:inline-flex;align-items:center;justify-content:center}
.sn-say:empty{display:none}
/* Ray kapalıyken sayaç simgenin köşesine biner */
.tabs:not(:hover) .sn-say{position:absolute;left:36px;top:5px;min-width:16px;height:16px;font-size:10px;padding:0 4px}

/* ── GÖRÜNÜMLER ── */
.view{display:none;padding:22px;max-width:1420px;margin:0 auto}
.view.active{display:block}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.vhead h1{font-size:21px}
/* Anasayfa selamı: "Hoş Geldin" küçük, ad eski boyutunda (kullanıcı istedi, 15.10.2026); kişiye özel ad stili span'e satır içi uygulanır */
.vhead h1#anaHosgeldin{font-size:16px} #hosgeldinAd{font-size:21px}
/* Talepler: gelen / giden işareti */
.yon{display:inline-block;width:18px;font-weight:800;margin-right:2px} .yon.giden{color:var(--s-blue)} .yon.gelen{color:var(--s-green)}
#talepYon{margin-left:8px}
/* Notlar > Defter: günlük serbest yazı sayfaları (çizgili kâğıt) */
.not-sekme{display:inline-flex;margin-left:8px;background:#fff;border:1px solid var(--s-line);border-radius:9px;padding:3px;gap:2px}
.not-sekme button{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--s-graphite);cursor:pointer}
.not-sekme button.acik{background:var(--s-ink);color:#fff}
.defter{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.defter-liste{max-height:calc(100vh - 170px);overflow:auto;padding-bottom:6px}
.defter-gun{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 14px;border-left:3px solid transparent;cursor:pointer}
.defter-gun:hover{background:var(--s-paper)} .defter-gun.acik{border-left-color:var(--s-red);background:#FFF6F6}
.defter-gun > div{flex:1;min-width:0} .defter-gun b{display:block;font-size:12.5px}
.defter-gun span{display:block;font-size:12px;color:var(--s-graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.defter-gun .ikon-btn{opacity:0} .defter-gun:hover .ikon-btn{opacity:1}
.defter-durum{margin-left:auto;font-size:11.5px;color:var(--s-graphite)}
.defter-secim{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 8px;border-bottom:1px solid var(--s-line)}
.defter-sec{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--s-line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--s-ink)}
.defter-sec.acik{background:var(--s-ink);border-color:var(--s-ink);color:#fff}
.defter-sec.arti{color:var(--s-graphite);border-style:dashed} .defter-sec svg.i{width:12px;height:12px}
.defter-yeni{display:flex;gap:6px;width:100%} .defter-yeni input{flex:1;min-width:0;padding:5px 9px;border:1px solid var(--s-line);border-radius:6px}
.defter-ust{display:flex;align-items:center;gap:4px;padding:8px 10px 4px 14px} .defter-ust .sp{flex:1}
.defter-yazi-sar{position:relative}
.defter-tarih-sar{position:relative}
.defter-tarih{border:none;background:none;font-size:14px;font-weight:800;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--s-ink);min-width:190px}
.defter-tarih:hover{background:var(--s-paper)}
.defter-takvim{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:30;width:262px;background:#fff;border:1px solid var(--s-line);
  border-radius:var(--radius);box-shadow:0 10px 30px rgba(15,23,32,.16);padding:10px}
.dt-ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px} .dt-ust b{font-size:13px}
.dt-izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dt-bas{font-size:10.5px;font-weight:700;color:var(--s-graphite);text-align:center;padding:3px 0}
.dt-gun{position:relative;border:none;background:none;height:32px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--s-ink)}
.dt-gun:hover{background:var(--s-paper)} .dt-gun.disari{color:#B4BAC3}
.dt-gun.bugun{font-weight:800;color:var(--s-red)} .dt-gun.secili{background:var(--s-ink);color:#fff}
.dt-gun.dolu::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--s-red)}
.dt-gun.secili.dolu::after{background:#fff}
.dt-bugun{display:block;width:100%;margin-top:8px;border:1px solid var(--s-line);background:#fff;border-radius:7px;padding:6px;font-size:12px;font-weight:600;cursor:pointer}
.defter-satir-dugme{position:absolute;right:14px;display:flex;gap:4px;height:28px;align-items:center;z-index:2}
.defter-satir-dugme[hidden]{display:none}   /* display:flex hidden'ı ezmesin */
.defter-satir-dugme button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--s-line);
  background:#fff;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--s-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.defter-satir-dugme button:hover{border-color:var(--s-ink)}
.defter-satir-dugme button.sil{color:var(--s-red-deep)} .defter-satir-dugme button.sil:hover{border-color:var(--s-red);background:#FFF4F4} .defter-satir-dugme svg.i{width:12px;height:12px}
.defter-sayfa textarea.defter-metin{display:block;width:100%;box-sizing:border-box;min-height:calc(100vh - 230px);border:none;resize:vertical;outline:none;
  padding:0 22px 20px 54px;font:15px/28px var(--font);color:var(--s-ink);
  background-color:#FFFEF8;background-attachment:local;border-radius:0 0 var(--radius) var(--radius);
  background-image:linear-gradient(90deg,transparent 40px,#EFA3A6 40px,#EFA3A6 42px,transparent 42px),
                   repeating-linear-gradient(transparent 0 27px,#CFDBE8 27px 28px)}
@media (max-width:900px){.defter{grid-template-columns:1fr}}
/* Toplantı odaları: saat ızgarası (30 dk dilim) */
.oda-ust{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--s-line)}
.oda-tarih{font-size:14px;min-width:190px;text-align:center}
.oda-tablo-sar{overflow-x:auto;padding:12px 16px 4px}
.oda-tablo{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;table-layout:fixed}
.oda-tablo th{font-size:11px;font-weight:600;color:var(--s-graphite);text-align:left;padding:0 0 6px 2px;white-space:nowrap}
.oda-ad-b{width:120px}
.oda-ad{padding:4px 10px 4px 0;white-space:nowrap} .oda-ad b{display:block;font-size:13.5px} .oda-ad span{font-size:11px;color:var(--s-graphite)}
.oda-d{height:38px;border-top:3px solid #fff;border-bottom:3px solid #fff;border-right:1px solid #fff}
.oda-d.yarim{border-left:1px solid var(--s-line)}
.oda-d.od-bos{background:#E8F5EE;cursor:pointer} .oda-d.od-bos:hover{background:#BFE5CF}
.oda-d.od-dolu{background:#F3C9CB} .oda-d.od-bel{background:#F8E3B5} .oda-d.od-gecti{background:#EEF0F3}
.oda-d.secili{background:var(--s-green)!important}
/* Oda sekmeleri ve hafta ızgarası (satır = yarım saat, sütun = gün) */
.oda-sekme button{display:inline-flex;align-items:baseline;gap:6px} .oda-sekme small{font-size:10.5px;opacity:.7;font-weight:600}
.oda-kip button{padding:5px 12px;font-size:12px}
.oda-yukleniyor{padding:6px 16px 0;font-size:11.5px;color:var(--s-graphite)}
.oda-hafta{border-collapse:separate;border-spacing:3px 0;width:100%;min-width:720px;table-layout:fixed}
.oda-hafta th{font-size:11.5px;font-weight:600;color:var(--s-graphite);padding:0 0 8px;text-align:center}
.oda-hafta th b{font-size:15px;color:var(--s-ink);margin-left:3px} .oda-hafta th.hs{opacity:.7}
.oda-hafta th.bugun{color:var(--s-red)} .oda-hafta th.bugun b{color:#fff;background:var(--s-red);border-radius:99px;padding:1px 7px}
.oda-saat-b{width:54px}
.oda-saat{font-size:11px;color:var(--s-graphite);text-align:right;padding-right:8px;vertical-align:top;line-height:1;transform:translateY(-5px)}
.oda-hafta .oda-d{height:17px;border:none}
.oda-hafta tr.tam .oda-d{border-top:1px solid #fff} .oda-hafta tr.yarim .oda-d{border-top:1px dashed rgba(255,255,255,.7)}
/* Ay görünümü: günler küçük kareler; içinde 08–19 doluluk şeridi */
.oda-ay{padding:12px 16px 4px}
.oda-ay-bas{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11.5px;font-weight:600;color:var(--s-graphite);margin-bottom:6px;text-align:center}
.oda-ay-izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.oda-ay-gun{display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left;border:1px solid var(--s-line);background:#fff;border-radius:8px;padding:7px 8px;cursor:pointer;min-height:64px}
.oda-ay-gun:hover{border-color:var(--s-ink)} .oda-ay-gun b{font-size:13px}
.oda-ay-gun.disari{opacity:.45} .oda-ay-gun.bugun{border-color:var(--s-red);box-shadow:inset 0 0 0 1px var(--s-red)}
.oda-ay-gun.gecti{background:#F6F7F9} .oda-ay-gun.gecti .oda-serit{opacity:.4}
.oda-ay-gun small{font-size:10.5px;color:var(--s-graphite)} .oda-ay-gun.tam-bos small{color:#1B6A46;font-weight:700} .oda-ay-gun.cok-dolu small{color:var(--s-red-deep);font-weight:700}
.oda-serit{display:flex;gap:1px;height:8px} .oda-serit i{flex:1;border-radius:1px;background:#CFEBDB} .oda-serit i.d{background:#E9999D} .oda-serit i.e{background:#F2CC7A}
.oda-lejant{display:flex;gap:16px;padding:6px 16px 10px;font-size:11.5px;color:var(--s-graphite)}
.oda-lejant span{display:inline-flex;align-items:center;gap:6px} .oda-lejant i{width:14px;height:10px;border-radius:2px;display:inline-block}
.oda-lejant i.od-bos{background:#E8F5EE;border:1px solid #BFE5CF} .oda-lejant i.od-dolu{background:#F3C9CB} .oda-lejant i.od-bel{background:#F8E3B5} .oda-lejant i.od-sec{background:var(--s-green)}
.oda-ipucu{padding:4px 16px 16px;font-size:12.5px;color:var(--s-graphite)}
.oda-form{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 16px 16px;padding:12px 14px;border:1px solid #CDE9DA;background:var(--s-green-bg);border-radius:var(--radius)}
.oda-form-baslik{font-size:13.5px} .oda-form select{padding:5px 8px;border:1px solid var(--s-line);border-radius:6px}
.oda-form input{flex:1;min-width:220px;padding:8px 11px;border:1px solid var(--s-line);border-radius:var(--radius-sm)}
.oda-not{flex-basis:100%;font-size:11.5px;color:var(--s-graphite)}
.oda-katilim{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border:1px solid var(--s-line);border-radius:var(--radius-sm);padding:5px 6px}
.oda-katilim input{flex:1;min-width:220px;border:none;padding:4px 6px;outline:none;background:transparent}
.oda-cip{display:inline-flex;align-items:center;gap:4px;background:var(--s-blue-bg);color:#1F3F6B;border-radius:99px;padding:3px 4px 3px 10px;font-size:12px;font-weight:600}
.oda-cip button{border:none;background:none;cursor:pointer;font-size:14px;line-height:1;color:inherit;padding:0 4px}
/* Ana ekran hava durumu (Open-Meteo; şehir Ayarlar > Genel) */
.hava{margin-left:auto;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--s-line);border-radius:var(--radius);padding:6px 14px}
.ana-ust{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;margin-bottom:14px}
/* selam satırı eski yüksekliğinde (hava kutusu kadar) kalır: sayı kartlarıyla arasında önceki boşluk */
.ana-ust .vhead{grid-column:1;grid-row:1;min-height:86px;margin-bottom:16px} .ana-ust .kpis{grid-column:1;grid-row:2;margin-bottom:0}
.ana-ust .hava{grid-column:2;grid-row:1 / 3;align-self:end;margin-left:0}
.ana-ust .hava[hidden]{display:none}
/* Kartlar hava kutusunun yanına sığmazsa alt satıra düşmez, biraz daralır (hava kutusu aşağı kaymasın) */
.ana-ust .kpis{flex-wrap:nowrap} .ana-ust .kpis .kpi{flex:0 1 140px;min-width:104px;width:auto;padding:8px 12px}
/* Dar kart (kullanıcı istedi, 15.10.2026): sığmayan etiket alt satıra iner; kartlar aynı yükseklikte kalır */
.ana-ust .kpis .kpi .k-l{line-height:1.25}
@media (max-width:1100px){ .ana-ust .kpis{flex-wrap:wrap} }
.hava-simdi{display:flex;align-items:center;gap:8px}
.hava-simdi svg{width:30px;height:30px}
.hava-derece{font-size:22px;font-weight:800;font-family:var(--font-display);line-height:1}
.hava-yer{font-size:11.5px;color:var(--s-graphite);line-height:1.25}
.hava-yer b{display:block;color:var(--s-ink);font-size:12.5px}
.hava-gunler{display:flex;gap:10px;border-left:1px solid var(--s-line);padding-left:12px}
.hava-gun{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--s-graphite);gap:1px}
.hava-gun svg{width:18px;height:18px}
.hava-gun b{color:var(--s-ink);font-weight:700}
@media (max-width:900px){.hava-gunler{display:none}}

/* ── KART / KPI ── */
.card{background:var(--s-cloud);border:1px solid var(--s-line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card-h{padding:12px 18px;border-bottom:1px solid var(--s-line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.card-h h3{font-size:14.5px}
.card-h .say{font-size:12px;font-weight:600;color:var(--s-graphite)} .card-h .say:empty{display:none}
.sp{flex:1}
.card-b{padding:18px}
.card-b.tight{padding:0}
/* Kartlar sabit dar genişlikte (kullanıcı: yanlardan da daralt), ekrana yayılmaz */
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.kpis .kpi{width:180px;flex:0 0 auto}
.kpi{position:relative;background:var(--s-cloud);border:1px solid var(--s-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 14px;cursor:pointer;
     transition:box-shadow .15s,transform .15s;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
/* Yaklaşan: üzerine gelince gün gün dağılım */
.kpi-ipucu{position:absolute;left:0;top:calc(100% + 6px);z-index:30;min-width:190px;background:var(--s-ink);color:#fff;border-radius:9px;padding:9px 12px;
  box-shadow:0 10px 26px rgba(15,23,32,.25);font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;opacity:0;pointer-events:none;transition:opacity .12s}
.kpi-ipucu div{display:flex;gap:6px;align-items:baseline;padding:2px 0} .kpi-ipucu b{min-width:16px;text-align:right;font-weight:800} .kpi-ipucu span{opacity:.75}
.kpi:hover .kpi-ipucu{opacity:1}
.kpi:hover{box-shadow:0 3px 14px rgba(20,28,40,.14);transform:translateY(-1px)}
/* Seçili kartta sol çizgi yok (kullanıcı istedi); sayılar tek renk siyah */
.kpi .k-l{font-size:11.5px;font-weight:600;color:var(--s-graphite);text-transform:uppercase;letter-spacing:.4px}
.kpi .k-v{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.1}
.kpi .k-v{color:var(--s-ink)}

/* ── TABLO ── */
.liste-kutu{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;padding:9px 14px;background:#E8EBF0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
             color:var(--s-inktext);border-bottom:2px solid #C9CED6;white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:9px 14px;border-bottom:1px solid var(--s-line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tbody tr.clickable:hover td{background:var(--s-concrete)}
table.tbl td.no{white-space:nowrap;font-weight:600;color:var(--s-graphite);width:1%}
table.tbl td.tarih{white-space:nowrap;width:1%}
table.tbl td.dar{white-space:nowrap;width:1%}
/* Açılır iş listeleri: "İş" sütunu tüm boşluğu yutmasın, Tür hemen yanında dursun */
#mlGovde td.is-ad,#anaListe td.is-ad{width:30%}
table.tbl td .alt{font-size:11.5px;color:var(--s-graphite2);margin-top:1px}
/* Özet başlığın altında, en çok 2 satır; tamamı üzerine gelince */
table.tbl td .ozet{font-size:12px;color:var(--s-graphite);margin-top:3px;line-height:1.45;max-width:640px;
                   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
table.tbl tr.grup td{background:#F1F3F6;font-size:12.5px;font-weight:700;color:var(--s-inktext);border-left:3px solid var(--s-graphite);text-transform:uppercase;letter-spacing:.4px;padding-top:14px}
table.tbl tr.grup td b{color:var(--s-inktext);margin-left:4px}
table.tbl tr.soluk td{color:var(--s-graphite2)}
table.tbl tr.okunmadi td.konu b{font-weight:800}
.bos{padding:34px 18px;text-align:center;color:var(--s-graphite2);font-size:13px}
/* Kalan gün de Durum gibi balon (kullanıcı istedi) */
/* Termin durumu: balon yok, yalnız renkli yazı (kullanıcı istedi, 15.10.2026) */
.kalan{display:inline-block;white-space:nowrap;font-weight:600;font-size:12px}
.kalan.gecti{color:var(--s-red-deep)} .kalan.yakin{color:#B26B00} .kalan.normal{color:var(--s-graphite)}
td.tarih.kalan{display:table-cell;font-size:inherit}   /* tablo hücresi kendi iç boşluğunu korur (padding:inherit tarihi yukarı kaydırıyordu) */
.oncelik{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-red);margin:0 4px 0 7px;vertical-align:middle;position:relative;cursor:help}
.oncelik::before{content:'';position:absolute;inset:-6px}   /* küçük noktanın üzerine gelmek kolay olsun */
/* Hızlı ipucu (data-ipucu): tarayıcı title'ından hemen açılır, çok satır olabilir */
.ipucu-kutu{position:fixed;z-index:450;background:#1F2328;color:#fff;font-size:12px;line-height:1.45;padding:6px 9px;border-radius:4px;max-width:360px;white-space:pre-line;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ipucu-kutu[hidden]{display:none}
/* Etiketler balonsuz: yalnız renkli yazı (kullanıcı istedi, 15.10.2026) */
.badge{display:inline-block;padding:0;border-radius:0;background:none;font-size:12px;font-weight:600;white-space:nowrap}
.badge.gray{color:var(--s-graphite)}
.badge.mor{color:#3C3489}
/* Teams "Katıl": STFA bordosu; üzerine gelince renk değişmez, hafif kabarır */
.btn.teams-katil{background:var(--s-red-deep);color:#fff;border-color:var(--s-red-deep)}
.badge.green{color:#1B6A46}
.badge.amber{color:#B26B00}
.badge.red{color:var(--s-red-deep)}
.badge.blue{color:#2A5A96}
.ikon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border:1px solid transparent;background:none;border-radius:6px;
          color:var(--s-graphite);cursor:pointer;vertical-align:middle;margin-left:6px}
.ikon-btn:hover{background:var(--s-blue-bg);color:var(--s-blue);border-color:#CFE0F3}
.ikon-btn svg.i{width:15px;height:15px}
.p-ikonlar{white-space:nowrap}
.p-ikonlar .ikon-btn{margin-left:2px;width:30px;height:28px}
.p-ikonlar .ikon-btn svg.i{width:16px;height:16px}
.ikon-btn.bayrakli{color:var(--s-red)}
.ikon-btn.bayrakli svg.i{fill:currentColor}
/* Aksiyon / not alınmış postanın simgesi: bayrakla aynı kırmızı, içi açık ton */
.ikon-btn.yanik{color:var(--s-red)}
.ikon-btn.yanik svg.i{fill:var(--s-red-bg);stroke-width:2.1}
/* Hepsi kapandı: yeşil */
.ikon-btn.bitti{color:var(--s-green)}
.ikon-btn.bitti svg.i{fill:var(--s-green-bg);stroke-width:2.1}
.ikon-btn:disabled{opacity:.4;cursor:wait}
.ilet-panel{border:1px solid #CFE0F3;background:var(--s-blue-bg);border-radius:10px;padding:12px 14px 4px;margin-bottom:16px}
.ilet-panel .field input,.ilet-panel .field select,.ilet-panel .field textarea{background:#fff}
.pm-dugmeler{display:flex;gap:10px;margin-bottom:14px}
.pm-dugmeler .btn{flex:1;justify-content:center;padding:12px;font-size:14px}
.pm-dugmeler .btn svg.i{width:18px;height:18px}
.pm-blok{border:1px solid var(--s-line);border-radius:10px;padding:10px 14px 2px;margin-bottom:12px;background:#fff}
.pm-blok-h{display:flex;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px}
.pm-blok textarea{width:100%;padding:8px 11px;border:1px solid var(--s-line);border-radius:var(--radius-sm);margin-bottom:12px;resize:vertical;line-height:1.5}
#pmAksEkle{margin:-2px 0 14px}
.pm-onceki-kutu{margin-bottom:14px;border:1px solid var(--s-line);border-radius:10px;overflow:hidden}
.pm-onceki{display:flex;gap:10px;align-items:center;padding:7px 12px;font-size:12.5px;border-bottom:1px solid var(--s-line);cursor:pointer}
.pm-onceki:last-child{border-bottom:none}
.pm-onceki:hover{background:var(--s-concrete)}
.pm-onceki b{color:var(--s-graphite);white-space:nowrap}
.pm-onceki span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-onceki em{font-style:normal}
table.tbl td.not-metin{white-space:pre-line;max-width:520px}
.ikon-btn.sil:hover{background:var(--s-red-bg);color:var(--s-red);border-color:#F1C6C8}
.konu-on{display:block;font-size:11.5px;color:var(--s-graphite2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Konu sütunu esnek: max-width:0 tablonun kalan genişliği almasını sağlar, dar ekranda
   önizleme "…" ile kısalır; yoksa önizleme tabloyu genişletip simgeleri kart dışına itiyordu */
table.tbl td.konu{max-width:0;width:100%}
table.tbl td.konu b{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:400;color:#111}   /* okunmuş: ince siyah; okunmamış kalın (yukarıda) */

/* ── FİLTRE PANELİ + LİSTE (diğer portallardaki düzen) ── */
.ara-duzen{display:flex;gap:18px;align-items:flex-start}
.ara-panel{width:250px;flex-shrink:0;padding:14px;position:sticky;top:56px}   /* sağdaki yapışkan araç çubuğuyla aynı hizada */
.ara-baslik{font-size:11px;font-weight:700;color:var(--s-graphite2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ara-panel .field{margin-bottom:10px}
.ara-panel .field label{font-size:11px;margin-bottom:4px}
.ara-panel .field input,.ara-panel .field select{padding:7px 9px;font-size:12.5px}
.ara-dugmeler{display:flex;gap:8px;margin-top:12px}
.ara-liste{flex:1;min-width:0}
/* Freeze: liste kartının üst çubuğu ve sütun başlıkları kaydırırken üst barın (56px) altında sabit kalır.
   Liste kutusu kendi kaydırma alanı OLMAMALI, yoksa başlık sayfaya değil kutuya yapışır. */
.ara-liste > .card > .card-h{position:sticky;top:56px;z-index:15;background:var(--s-cloud);border-radius:var(--radius) var(--radius) 0 0}
/* overflow-x:clip kart dışına taşmayı keser ama kaydırma alanı oluşturmaz (sabit başlıklar çalışır) */
.ara-liste .liste-kutu{overflow:visible;overflow-x:clip}
/* Başlık satırı tam üst çubuğun altına: çubuğun gerçek yüksekliği --kh ile ölçülür (stickyKur) */
.ara-liste table.tbl thead th{position:sticky;top:calc(56px + var(--kh, 55px) - 1px);z-index:14}   /* 1px bindirme: kesirli yükseklikte satır sızmasın */
/* Dar ekran (dizüstü, büyütülmüş ekran): filtre paneli listenin ÜSTÜNE yatay şerit olarak geçer,
   tablo tam genişlik alır; hücre boşlukları azalır. Yoksa çok sütunlu tablolar kart dışına taşıyordu. */
@media (max-width:1300px){
  .ara-duzen{flex-direction:column;align-items:stretch;gap:12px}
  .ara-panel{width:auto;position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;align-items:end;padding:10px 14px}
  .ara-panel .ara-baslik{grid-column:1/-1;margin-bottom:0}
  .ara-panel .field{margin-bottom:0}
  .ara-panel .ara-dugmeler{margin-top:0;padding-bottom:2px}
  table.tbl th,table.tbl td{padding-left:9px;padding-right:9px}
}
/* İçerik (en çok 1420px) balon sütununa yetişiyorsa sağda balon payı bırakılır: simgeler balonların altında kalmasın */
@media (max-width:1620px){ .view{padding-right:88px} }
/* Çok dar ekran: sütunlar hiçbir şekilde sığmıyorsa tablo kart içinde yatay kaydırılır (kesilmez) */
@media (max-width:1000px){ .ara-liste .liste-kutu{overflow-x:auto} }

/* ── FORM / DÜĞME ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--s-line);background:var(--s-cloud);
     font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--s-concrete)}
.btn.primary{background:var(--s-ink);border-color:var(--s-ink);color:#fff}
.btn.primary:hover{background:var(--s-ink)}
/* Dolgulu düğmeler: üzerine gelince renk aynı kalır (genel .btn:hover açık zemini beyaz yazıyı siliyordu), hafif kabarır */
.btn:is(.primary,.danger,.teams-katil){transition:transform .12s ease,box-shadow .12s ease}
.btn:is(.primary,.danger,.teams-katil):hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(20,24,31,.22)}
.btn.teams-katil:hover{background:var(--s-red-deep)}
.btn.danger{background:var(--s-red);border-color:var(--s-red);color:#fff}
.btn.danger:hover{background:var(--s-red)}
.btn.hayalet-kirmizi{color:var(--s-red-deep);border-color:#F1C6C8;background:#fff}
.btn.hayalet-kirmizi:hover{background:var(--s-red-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg.i{width:15px;height:15px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--s-graphite);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--s-line);border-radius:var(--radius-sm);background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--s-blue);outline-offset:-1px}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field .ipucu{font-size:11.5px;color:var(--s-graphite);margin-top:5px}
.field .ipucu q{font-style:italic}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 16px}
.grid2 .tam{grid-column:1 / -1}
.secim{display:inline-flex;gap:4px;padding:4px;background:var(--s-concrete);border-radius:10px;margin-bottom:14px}
.secim label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--s-graphite)}
.secim input{display:none}
.secim label:has(input:checked){background:#fff;color:var(--s-inktext);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.note{font-size:12.5px;color:var(--s-graphite);background:var(--s-concrete);border-left:3px solid var(--s-graphite2);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.note.warn{background:var(--s-amber-bg);border-left-color:var(--s-amber);color:#7A5410}
.note.info{background:var(--s-blue-bg);border-left-color:var(--s-blue);color:#2A5A96}
.note .btn{margin-left:10px}

/* Anahtar (aç/kapa) */
.anahtar{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;margin-bottom:14px}
.anahtar input{position:absolute;opacity:0;width:0;height:0}
.ray{position:relative;width:40px;height:22px;border-radius:99px;background:#C7CFDA;transition:background .15s;flex:none}
.ray::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.anahtar input:checked + .ray{background:var(--s-green)}
.anahtar input:checked + .ray::after{left:21px}
.anahtar input:focus-visible + .ray{outline:2px solid var(--s-blue);outline-offset:2px}
.gun-sec{display:flex;flex-wrap:wrap;gap:8px}
.gun-sec label{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--s-line);border-radius:8px;font-size:12.5px;cursor:pointer;background:#fff}
.gun-sec label:has(input:checked){border-color:var(--s-ink);background:var(--s-ink);color:#fff}
.gun-sec input{display:none}

/* ── AYARLAR (solda başlıklar, sağda bölüm) ── */
.ayar-duzen{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.ayar-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:78px;background:var(--s-cloud);border:1px solid var(--s-line);border-radius:var(--radius);padding:8px}
.ayar-nav button{text-align:left;background:none;border:none;border-left:3px solid transparent;border-radius:8px;padding:9px 12px;cursor:pointer;
                 color:var(--s-graphite);font-size:13.5px;font-weight:700}
.ayar-nav button:hover{background:var(--s-concrete);color:var(--s-inktext)}
.ayar-nav button.active{background:var(--s-red-bg);border-left-color:var(--s-red);color:var(--s-inktext)}
.ayar-bolum{display:none}
.ayar-bolum.active{display:block}
.ayar-bolum .card-b{max-width:760px}
.ayar-kaydet{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--s-line)}
.ayar-sonuc{font-size:12.5px;color:var(--s-graphite)}
/* Ayar grupları: her bölüm küçük başlıklı gruplardan oluşur */
.ayar-grup{padding:4px 0 18px;margin-bottom:16px;border-bottom:1px solid var(--s-line)}
.ayar-grup:last-child{border-bottom:none;margin-bottom:0;padding-bottom:4px}
.ayar-grup h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--s-inktext);margin:0 0 4px}
.ayar-not{font-size:12.5px;color:var(--s-graphite);margin:0 0 12px}
.ayar-grup h4 + :not(.ayar-not){margin-top:10px}
.ayar-anahtarlar{display:flex;flex-wrap:wrap;gap:6px 28px} .ayar-anahtarlar .anahtar{margin-bottom:0}
.ayar-satir{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .ayar-satir .anahtar{margin-bottom:0}
.ayar-ozet{font-size:13px;margin:0 0 10px}
.ayar-grup .gun-sec{margin-bottom:14px}
.ayar-sonuc.ok{color:#1B6A46} .ayar-sonuc.hata{color:var(--s-red-deep)}
/* Bugünkü İşler penceresi: gün seçici (‹ tarih ›) */
.gun-secici{position:sticky;left:0;top:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--s-line);background:var(--s-concrete)}
.gun-secici .ikon-btn{width:38px;height:38px;font-size:24px;line-height:1;border-radius:50%;background:#fff;border:1px solid var(--s-line)}
.gs-tarih{display:flex;flex-direction:column;align-items:center;width:230px}   /* sabit genişlik: oklar yerinden oynamasın */
.gun-secici .btn{position:absolute;right:16px;top:50%;transform:translateY(-50%)}   /* "Bugün" düğmesi ortadaki düzeni kaydırmaz */
.gs-tarih b{font-size:16px} .gs-tarih span{font-size:12px;color:var(--s-graphite)}
.kst-satir{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--s-line)}
.kst-satir input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--s-line);border-radius:6px;background:#fff}
.kst-onay{display:inline-flex;align-items:center;gap:4px;font-size:12.5px}
.kst-onizleme{flex-basis:100%;font-size:21px;font-weight:700;color:var(--s-ink);padding:4px 2px}
.kst-satir textarea{border:1px solid var(--s-line);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;resize:vertical}
/* Tek seferlik kişi mesajı (yöneticinin yazdığı) */
.kisi-mesaj-bg{position:fixed;inset:0;z-index:500;background:rgba(15,18,24,.45);display:grid;place-items:center;padding:20px}
.kisi-mesaj{background:#fff;border-radius:14px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden;border-top:4px solid var(--s-red-deep)}
.km-h{display:flex;align-items:center;gap:8px;padding:16px 20px 6px;font-size:15px;color:var(--s-red-deep)} .km-h svg.i{width:20px;height:20px}
.od-defter .aktarildi{margin-left:6px;padding:0 6px;border-radius:8px;font-size:11px;background:#f1e7c6;color:#7a5b00}
.km-metin{padding:6px 20px 14px;font-size:15px;line-height:1.55;white-space:pre-line;color:var(--s-ink)}
.km-alt{display:flex;justify-content:flex-end;padding:10px 16px 16px}
@media (max-width:900px){.ayar-duzen{grid-template-columns:1fr}.ayar-nav{position:static;flex-direction:row;flex-wrap:wrap}}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,24,31,.55);z-index:140;overflow:auto;padding:32px 16px;overscroll-behavior:contain}
.modal-bg.show{display:block}
.modal{background:var(--s-cloud);border-radius:var(--radius);max-width:880px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.genis{max-width:1240px}
.modal-h{padding:14px 20px;border-bottom:1px solid var(--s-line);display:flex;align-items:center;gap:12px}
.modal-h h3{flex:1;font-size:15.5px;min-width:0}
.modal-h .no{color:var(--s-graphite);font-weight:600;margin-right:8px}
.modal-b{padding:20px}
.modal-f{padding:12px 20px;border-top:1px solid var(--s-line);display:flex;gap:9px;align-items:center}
.kapat-x{background:none;border:none;cursor:pointer;color:var(--s-graphite);padding:4px;border-radius:6px;display:inline-flex}
.kapat-x:hover{background:var(--s-concrete);color:var(--s-inktext)}
.modal-bg.ust{z-index:150}
.doldur{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:16px;background:var(--s-blue-bg);border-radius:9px}
.doldur span{font-size:12.5px;font-weight:700;color:#2A5A96;margin-right:4px}
.bolum{margin-top:8px;border-top:1px solid var(--s-line);padding-top:14px}
.bolum + .bolum{margin-top:18px}
.bolum-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bolum-h h4{font-size:13.5px}
.posta-satir{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--s-line);border-radius:8px;margin-bottom:6px;font-size:13px}
.posta-satir .ps-konu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posta-satir .ps-ek{font-size:12px;color:var(--s-graphite);white-space:nowrap}
table.aks td{padding:5px 8px;vertical-align:middle}
table.aks th{padding:7px 8px}
table.aks input[type=text],table.aks input[type=date]{width:100%;border:1px solid transparent;border-radius:6px;padding:5px 7px;background:transparent}
table.aks input[type=text]:hover,table.aks input[type=date]:hover{border-color:var(--s-line)}
table.aks input:focus{outline:2px solid var(--s-blue);outline-offset:-1px;background:#fff}
table.aks tr.tamam input[type=text]{color:var(--s-graphite2);text-decoration:line-through}
table.aks tr.yeni td{background:var(--s-concrete)}
table.aks tr.yeni input{border-color:var(--s-line);background:#fff}
table.aks input[type=checkbox]{width:16px;height:16px;cursor:pointer}
table.aks tr.vurgu td{background:var(--s-amber-bg)}
.gecmis{margin-top:18px;font-size:12.5px;color:var(--s-graphite)}
.gecmis summary{cursor:pointer;font-weight:600}
.gecmis ul{list-style:none;margin-top:8px}
.gecmis li{padding:3px 0}
.gecmis li span{color:var(--s-graphite2);margin-right:10px}
/* Posta içe aktarma: solda posta, sağda form */
.aktar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.posta-ust{font-size:12.5px;color:var(--s-graphite);margin-bottom:10px;line-height:1.7}
.posta-ust b{color:var(--s-inktext)}
.posta-ust h4{font-size:15px;color:var(--s-inktext);margin-bottom:6px}
.posta-govde{white-space:pre-wrap;font-size:12.5px;line-height:1.55;background:var(--s-concrete);border-radius:8px;padding:12px 14px;max-height:56vh;overflow:auto}
@media (max-width:900px){.aktar{grid-template-columns:1fr}}

/* Öğrenme rozeti (Hukuk portalıyla aynı) */
.tb-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tb-chip.ogr{border:1px solid rgba(122,140,255,.45);background:rgba(122,140,255,.14);color:#C6CEFF}
.tb-chip.ogr .nabiz{width:7px;height:7px;border-radius:99px;background:currentColor;animation:ogrNabiz 1.2s ease-in-out infinite}
.tb-chip[hidden]{display:none}
@keyframes ogrNabiz{0%,100%{opacity:.25}50%{opacity:1}}
/* Haftalık plan */
.tk-ust{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.tk-ust h1{font-size:21px}
.tk-nav{display:flex;gap:4px}
.tk-nav .btn{padding:5px 11px}
.tk-baslik{font-size:17px;font-weight:700}
.tk-ozet{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--s-graphite);margin-bottom:10px}
.tk-ozet b{color:var(--s-inktext)} .tk-ozet .kirmizi b{color:var(--s-red)} .tk-ozet .sari b{color:#C9831C}
.tk-lejant{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.tk-lejant i{display:inline-block;width:16px;height:11px;box-sizing:border-box;border-radius:2px;margin-left:8px}
.tk-lejant i.is{background:#BFD9F2;border-left:3px solid #0F6CBD} .tk-lejant i.hat{background:#FBEFC9;border-left:3px solid #C9831C}
.tk-lejant i.termin{background:#fff;border:1px solid #E08A8F} .tk-lejant i.kapali{background:#ECEEF1}
.tk-kart{overflow:hidden}
.tk-izgara{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tk-bas{padding:7px 8px;font-size:13px;color:var(--s-graphite);border-bottom:1px solid var(--s-line);border-right:1px solid var(--s-line);background:#fff}
.tk-gun{border-right:1px solid var(--s-line);border-bottom:1px solid var(--s-line);padding:4px 5px 6px;min-height:128px;background:#fff;min-width:0}
.tk-izgara.hafta .tk-gun{min-height:62vh}
.tk-gun.tatil{background:#F7F7F6}
.tk-gun.disi .tk-no{color:var(--s-graphite2)}
.tk-gun.bugun{box-shadow:inset 0 0 0 2px #0F6CBD;background:#F5F9FE}
.tk-gun.bugun .tk-no{font-weight:800;color:#0F6CBD}
.tk-gun-h{display:flex;align-items:center;gap:6px;margin-bottom:3px;min-height:22px}
.tk-no{font-size:13px;color:var(--s-inktext)}
.tk-dolu{flex:1;max-width:80px;height:5px;border-radius:99px;background:var(--s-concrete);overflow:hidden}
.tk-dolu i{display:block;height:100%;background:#0F6CBD}
.tk-arti{margin-left:auto;border:none;background:none;color:var(--s-graphite2);cursor:pointer;opacity:0;padding:2px;border-radius:50%;display:inline-flex}
.tk-arti svg.i{width:15px;height:15px}
.tk-gun:hover .tk-arti{opacity:1} .tk-arti:hover{color:#0F6CBD;background:#E9F1FA}
.tk-ol{font-size:11.5px;line-height:1.3;padding:3px 6px;margin-bottom:3px;border-radius:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-izgara.hafta .tk-ol{white-space:normal}
.tk-ol.is{background:#BFD9F2;border-left:3px solid #0F6CBD;color:#0B3A66}
.tk-ol.is.risk{border-left-color:var(--s-red);background:#F6D6D8;color:#7A1418}
.tk-ol.hat{background:#FBEFC9;border-left:3px solid #C9831C;color:#5E3E08}
.tk-ol.termin{background:#fff;border:1px solid #F1C6C8;color:var(--s-red-deep)}
.tk-ol.termin svg.i{width:11px;height:11px;vertical-align:-1px;margin-right:3px;fill:currentColor}
.tk-ol.kapali{background:#ECEEF1;color:var(--s-graphite2);text-decoration:line-through}
.tk-ol:hover{filter:brightness(.95)}
.tk-ol.outlook{background:#E4E7F6;border-left:3px solid #4B53BC;color:#262B6B}
.tk-ol.outlook.belirsiz{background:repeating-linear-gradient(135deg,#EEF0FA 0 5px,#E2E5F5 5px 10px)}
.tk-ol.not{background:#EFE3F7;border-left:3px solid #7A3FA0;color:#47215E}
.tk-lejant i.outlook{background:#E4E7F6;border-left:3px solid #4B53BC} .tk-lejant i.not{background:#EFE3F7;border-left:3px solid #7A3FA0}
.tk-lejant i.belirsiz{background:repeating-linear-gradient(135deg,#EEF0FA 0 3px,#D5D9F0 3px 6px);border-left:3px solid #4B53BC}
.tk-lejant i.risk{background:#F6D6D8;border-left:3px solid var(--s-red)}
.tk-ekle-menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--s-line);border-radius:9px;box-shadow:0 10px 26px rgba(15,23,32,.16);padding:4px;min-width:150px}
.tk-ekle-menu[hidden]{display:none}
.tk-ekle-menu button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:8px 10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--s-ink)}
.tk-ekle-menu button:hover{background:var(--s-paper)} .tk-ekle-menu svg.i{width:14px;height:14px}
.tk-ol b{font-weight:700}
.tk-daha{border:none;background:none;color:#0F6CBD;font-size:11.5px;font-weight:600;cursor:pointer;padding:1px 4px}
@media (max-width:900px){.tk-izgara{grid-template-columns:1fr}.tk-bas{display:none}.tk-gun{min-height:0}.tk-izgara.hafta .tk-gun{min-height:0}}
/* Notlarım ve Aksiyonlarım: kartın içinde aralıklı iki ayrı çerçeve */
.ana-ikili{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;align-items:start}
.ana-bolme{min-width:0;border:1px solid var(--s-line);border-radius:10px;overflow:hidden;background:#fff}
.ana-bolme-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--s-line);background:var(--s-concrete)}
.ana-bolme-h h4{font-size:13.5px}
.ana-bolme .bos{padding:26px 16px}
@media (max-width:700px){.ana-ikili{grid-template-columns:1fr}}
#anaListe{max-height:60vh;overflow:auto}
.ana-kisa{max-height:52vh;overflow:auto}
.plan-gunler{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:0 16px;align-items:start}
.plan-gun.bugun{border-color:var(--s-ink);box-shadow:0 0 0 1px var(--s-ink),var(--shadow)}
.pg-tarih{font-family:var(--font);font-weight:500;color:var(--s-graphite);font-size:13px;margin-left:4px}
.pg-dolu{font-size:12px;color:var(--s-graphite);font-weight:600}
.pg-cubuk{width:70px;height:6px;border-radius:99px;background:var(--s-concrete);overflow:hidden}
.pg-cubuk i{display:block;height:100%;background:var(--s-ink)}
.efor{font-size:12px;font-weight:700;white-space:nowrap}
.efor.ogrenilen{color:#5B3CC4} .efor.varsayilan{color:var(--s-graphite2)}
.hat-satir td{background:#FBF8EE}
.hat-satir svg.i{width:14px;height:14px;vertical-align:-2px;color:#8A5C12}
.ogr-liste p{font-size:13px;margin-bottom:6px}
.ipucu.ogr{color:#5B3CC4}
/* Hatırlatıcılar */
.yazarak{display:flex;gap:10px}
.yazarak input{flex:1;padding:9px 12px;border:1px solid var(--s-line);border-radius:var(--radius-sm)}
.ek-simge svg.i{width:15px;height:15px;color:var(--s-graphite);margin-right:3px}
/* gg.aa.yyyy tarih kutusu: yazı kutusu + sağda görünmez özgün kutu (takvimi açar) */
.tg{position:relative;display:block}
.tg .tg-yazi{width:100%;padding-right:32px}
.tg.saat .tg-yazi{padding-right:11px}
.tg .tg-yazi.hatali{outline:2px solid var(--s-red);outline-offset:-1px}
.tg-ikon{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--s-graphite);display:inline-flex}
.tg-ikon svg.i{width:15px;height:15px}
.tg > input[type=date]{position:absolute!important;right:0!important;top:0!important;width:34px!important;height:100%!important;opacity:0!important;
  padding:0!important;margin:0!important;border:0!important;cursor:pointer}
.tg > input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
/* Yazıdan doldurulan alanlar kısa süre vurgulanır */
.dolduruldu{background:#FFF6D6!important;transition:background .6s}
.anlasilan .anl-alanlar{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px}
.anlasilan .anl-alanlar em{font-style:normal;font-weight:700;margin-right:6px;color:#1F4C80}
/* Arama paneli onay kutuları + başlık sıralama/süzgeç okları */

.kisi-balon{position:fixed;right:22px;bottom:22px;z-index:120;width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;background:var(--s-ink);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(20,24,31,.35);transition:transform .15s,background .15s}

.arama-pencere{position:fixed;right:90px;bottom:22px;z-index:130;width:290px;background:var(--s-ink);color:#fff;border-radius:14px;

.ap-kim{display:flex;align-items:center;gap:10px;margin:12px 0}

.balon-portal{bottom:22px;text-decoration:none} .balon-oda{bottom:88px} #kisiBalon{bottom:154px} .balon-posta{bottom:220px}
.balon-ad{position:absolute;right:64px;top:50%;transform:translateY(-50%);background:var(--s-ink);color:#fff;font-size:12px;font-weight:700;

.iletisim{display:inline-flex;align-items:center;gap:4px;flex:none;vertical-align:middle}

/* ═══════════════════════════════════════════════════════════════

const $  = (s, k) => (k || document).querySelector(s);
const $$ = (s, k) => [...(k || document).querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
// Türkçe küçük harf: /i bayrağı ve toLowerCase() İ/ı'yı ıskalıyor.
const trK = s => String(s || '').toLocaleLowerCase('tr-TR');
const yerelTarih = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const bugun = () => yerelTarih(new Date());
const simdi = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function tarihNesne(t) { const [y, m, d] = t.split('-').map(Number); return new Date(y, m - 1, d); }
function gunFark(t) {
  if (!t) return null;
  const [y, m, d] = t.split('-').map(Number), b = new Date();
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5);
}
function trTarih(t) { if (!t) return ''; const [y, m, d] = String(t).slice(0, 10).split('-'); return d + '.' + m + '.' + y; }
function trTarihSaat(iso) {

function defterHazirla() {

    delete V.defter;

  if (!V.defterler.length) V.defterler.push({ id: 'd' + Date.now().toString(36), ad: 'Günlük', sayfalar: {} });

/* ═══ TOPLANTI ODALARI ════════════════════════════════════════════
   Odalar ve doluluk Outlook'tan (Exchange "All Rooms", 30 dk dilim). Her oda ayrı sekme.
   Hafta: saat (08:00–19:00) × gün ızgarası, oklarla haftalar arasında gezilir.
   Ay: günler küçük kareler (içinde günün doluluk şeridi); güne tıklanınca o hafta açılır.
   Boş dilime tıklanır → konu + bitiş → Outlook'ta oda eklenmiş davet HAZIR açılır;
   Gönder'e kullanıcı basar (Assist kendisi göndermez). */
const ODA_ILK = 16, ODA_SON = 38;            // dilim no: 16 = 08:00, 38 = 19:00 (hariç)
let ODA_REF = new Date(), ODA_KIP = 'hafta', ODA_SECILI = 0, ODA = null, ODA_SEC = null, ODA_YUK = false;
const odaIso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const odaSaat = n => `${String(Math.floor(n / 2)).padStart(2, '0')}:${n % 2 ? '30' : '00'}`;
const odaKisa = ad => String(ad).replace(/^\s*\d+\.?\s*Kat\s*/i, '').replace(/\s*Toplant[ıi]\s*Odas[ıi]\s*$/i, '') || ad;
const odaKat = ad => { const m = String(ad).match(/(\d+)\.?\s*Kat/i); return m ? `${m[1]}. kat` : ''; };
const odaGunEkle = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const odaPazartesi = d => odaGunEkle(d, -((d.getDay() + 6) % 7));
const ODA_GUNK = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
const ODA_AY = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
// Görünen aralık: hafta = pazartesiden 7 gün; ay = ayın ilk gününün haftasından 42 gün (6 satır)
function odaAralik() {
  if (ODA_KIP === 'hafta') return { bas: odaPazartesi(ODA_REF), n: 7 };
  return { bas: odaPazartesi(new Date(ODA_REF.getFullYear(), ODA_REF.getMonth(), 1)), n: 42 };
}
async function odaYukle() {
  ODA_YUK = true; odaCiz();
  const r = odaAralik();
  try { ODA = await apiJson(`/api/oda?bas=${odaIso(r.bas)}&gunSayi=${r.n}`); ODA.basTarih = r.bas; }
  catch (e) { ODA = { hata: e.message }; }
  ODA_YUK = false; if ($('#odaPanel').classList.contains('acik')) odaCiz();
}
// gün indeksi (0 = aralığın ilk günü) ve dilim no → '0' boş, '1' belirsiz, '2'/'3' dolu
const odaDurum = (o, g, n) => o.dilim[g * 48 + n] || '0';
function odaCiz() {
  const kutu = $('#odaPanelGovde');
  if (!ODA && !ODA_YUK) { odaYukle(); return; }
  const r = odaAralik();
  const baslik = ODA_KIP === 'hafta'
    ? (() => { const s = odaGunEkle(r.bas, 6); return `${r.bas.getDate()} ${r.bas.getMonth() !== s.getMonth() ? ODA_AY[r.bas.getMonth()] + ' ' : ''}– ${s.getDate()} ${ODA_AY[s.getMonth()]} ${s.getFullYear()}`; })()
    : `${ODA_AY[ODA_REF.getMonth()]} ${ODA_REF.getFullYear()}`;
  let govde, sekmeler = '';
  if (ODA_YUK && !ODA) govde = '<div class="yukleniyor">Odaların doluluğu Outlook\'tan alınıyor…</div>';
  else if (ODA && ODA.hata) govde = `<div class="note warn">Odalar alınamadı: ${esc(ODA.hata)}</div>`;
  else if (ODA && !ODA.odalar.length) govde = '<div class="bos">Outlook\'ta toplantı odası listesi ("All Rooms") bulunamadı.</div>';
  else {
    if (ODA_SECILI >= ODA.odalar.length) ODA_SECILI = 0;
    sekmeler = '<div class="not-sekme oda-sekme">' + ODA.odalar.map((o, i) =>
      `<button class="${i === ODA_SECILI ? 'acik' : ''}" data-oda-sec="${i}">${esc(odaKisa(o.ad))}<small>${esc(odaKat(o.ad))}</small></button>`).join('') + '</div>';
    govde = (ODA_YUK ? '<div class="oda-yukleniyor">Güncelleniyor…</div>' : '') + (ODA_KIP === 'hafta' ? odaHaftaHtml() : odaAyHtml());
  }
  kutu.innerHTML = `<div class="op-ust">${sekmeler}</div>
    <div class="card"><div class="oda-ust">
      <button class="btn sm" data-oda-kay="-1" title="${ODA_KIP === 'hafta' ? 'Önceki hafta' : 'Önceki ay'}">‹</button>
      <button class="btn sm" data-oda-kay="0">Bugün</button>
      <button class="btn sm" data-oda-kay="1" title="${ODA_KIP === 'hafta' ? 'Sonraki hafta' : 'Sonraki ay'}">›</button>
      <b class="oda-tarih">${baslik}</b>
      <span class="sp" style="flex:1"></span>
      <div class="not-sekme oda-kip"><button class="${ODA_KIP === 'hafta' ? 'acik' : ''}" data-oda-kip="hafta">Hafta</button><button class="${ODA_KIP === 'ay' ? 'acik' : ''}" data-oda-kip="ay">Ay</button></div>
      <button class="btn sm" data-oda-yenile title="Outlook'tan yeniden al">${svg('yenile')}</button>
    </div>${govde}</div>`;
}
function odaHaftaHtml() {
  const o = ODA.odalar[ODA_SECILI], bugunIso = odaIso(new Date()), simdi = new Date(), simdiDilim = simdi.getHours() * 2 + (simdi.getMinutes() >= 30 ? 1 : 0);
  const gunler = [...Array(7)].map((_, g) => odaGunEkle(ODA.basTarih, g));
  let h = '<div class="oda-tablo-sar"><table class="oda-hafta"><thead><tr><th class="oda-saat-b"></th>' +
    gunler.map((d, g) => `<th class="${odaIso(d) === bugunIso ? 'bugun' : ''}${g >= 5 ? ' hs' : ''}">${ODA_GUNK[g]} <b>${d.getDate()}</b></th>`).join('') + '</tr></thead><tbody>';
  for (let n = ODA_ILK; n < ODA_SON; n++) {
    h += `<tr class="${n % 2 ? 'yarim' : 'tam'}"><td class="oda-saat">${n % 2 ? '' : odaSaat(n)}</td>`;
    gunler.forEach((d, g) => {
      const iso = odaIso(d), gecti = iso < bugunIso || (iso === bugunIso && n < simdiDilim), s = odaDurum(o, g, n);
      const sinif = gecti ? 'od-gecti' : s === '0' ? 'od-bos' : s === '1' ? 'od-bel' : 'od-dolu';
      const sec = ODA_SEC && ODA_SEC.iso === iso && n >= ODA_SEC.bas && n < ODA_SEC.bit ? ' secili' : '';
      const ipucu = `${ODA_GUNK[g]} ${d.getDate()} · ${odaSaat(n)}–${odaSaat(n + 1)} · ` + { 'od-bos': 'Boş', 'od-gecti': 'Geçti', 'od-bel': 'Belirsiz', 'od-dolu': 'Dolu' }[sinif];
      h += `<td class="oda-d ${sinif}${sec}" ${sinif === 'od-bos' ? `data-oda-g="${g}" data-oda-n="${n}"` : ''} title="${ipucu}"></td>`;
    });
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  return h + '<div class="oda-lejant"><span><i class="od-bos"></i>Boş</span><span><i class="od-dolu"></i>Dolu</span><span><i class="od-bel"></i>Belirsiz</span><span><i class="od-sec"></i>Seçili</span></div>' + odaFormHtml();
}
function odaAyHtml() {
  const o = ODA.odalar[ODA_SECILI], bugunIso = odaIso(new Date()), ay = ODA_REF.getMonth();
  let h = '<div class="oda-ay"><div class="oda-ay-bas">' + ODA_GUNK.map(g => `<span>${g}</span>`).join('') + '</div><div class="oda-ay-izgara">';
  for (let g = 0; g < 42; g++) {
    const d = odaGunEkle(ODA.basTarih, g), iso = odaIso(d);
    let dolu = 0, serit = '';
    for (let n = ODA_ILK; n < ODA_SON; n++) { const s = odaDurum(o, g, n); if (s !== '0') dolu++; serit += `<i class="${s === '0' ? 'b' : s === '1' ? 'e' : 'd'}"></i>`; }
    const top = ODA_SON - ODA_ILK, oran = dolu / top;
    const durum = iso < bugunIso ? 'gecti' : oran === 0 ? 'tam-bos' : oran >= .8 ? 'cok-dolu' : '';
    h += `<button class="oda-ay-gun${d.getMonth() !== ay ? ' disari' : ''}${iso === bugunIso ? ' bugun' : ''} ${durum}" data-oda-gun="${iso}" title="${d.getDate()} ${ODA_AY[d.getMonth()]} · ${top - dolu} boş yarım saat">
      <b>${d.getDate()}</b><span class="oda-serit">${serit}</span><small>${iso < bugunIso ? '' : dolu === 0 ? 'Tamamen boş' : `${Math.round((1 - oran) * 100)}% boş`}</small></button>`;
  }
  return h + '</div></div><div class="oda-ipucu">Bir güne tıklayınca o haftanın saatleri açılır.</div>';
}
// Katılımcı önerileri: Kişiler rehberi (MiCollab + şirket rehberi + Outlook) — e-postası olanlar
function odaKisiSecenek() {
  return (REHBER || []).filter(k => k.eposta).map(k => `<option value="${esc(k.ad)} <${esc(k.eposta)}>">`).join('');
}
function odaKatilimEkle(deger) {
  deger = String(deger || '').trim(); if (!deger || !ODA_SEC) return false;
  let k = null;
  const m = deger.match(/^(.*?)\s*<\s*([^<>\s]+@[^<>\s]+)\s*>$/);
  if (m) k = { ad: m[1].trim(), eposta: m[2] };
  else if (/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(deger)) k = { ad: '', eposta: deger };
  else {   // yalnız ad yazıldıysa rehberde tek eşleşme varsa o kişi
    const b = (REHBER || []).filter(r => r.eposta && trK(r.ad).includes(trK(deger)));
    if (b.length === 1) k = { ad: b[0].ad, eposta: b[0].eposta };
  }
  if (!k) { toast('Kişi bulunamadı; listeden seçin ya da e-posta yazın.', true); return false; }
  ODA_SEC.katilim = ODA_SEC.katilim || [];
  if (!ODA_SEC.katilim.some(x => trK(x.eposta) === trK(k.eposta))) ODA_SEC.katilim.push(k);
  ODA_SEC.konu = ($('#odaKonu') || {}).value || ODA_SEC.konu;
  odaCiz(); setTimeout(() => $('#odaKisi') && $('#odaKisi').focus(), 20); return true;
}
document.addEventListener('keydown', e => { if (e.target.id === 'odaKisi' && e.key === 'Enter') { e.preventDefault(); odaKatilimEkle(e.target.value); } });
// Listeden seçilince (datalist) doğrudan eklenir
document.addEventListener('input', e => { if (e.target.id === 'odaKisi' && /<[^<>\s]+@[^<>\s]+>\s*$/.test(e.target.value)) odaKatilimEkle(e.target.value); });
function odaFormHtml() {
  if (!ODA_SEC) return '<div class="oda-ipucu">Rezerve etmek için boş bir saate tıklayın.</div>';
  const o = ODA.odalar[ODA_SECILI], g = ODA_SEC.g;
  let enGec = ODA_SEC.bas + 1;   // seçilen başlangıçtan sonraki ilk dolu dilime kadar
  while (enGec < ODA_SON && odaDurum(o, g, enGec) === '0') enGec++;
  const secenek = []; for (let n = ODA_SEC.bas + 1; n <= enGec; n++) secenek.push(`<option value="${n}" ${n === ODA_SEC.bit ? 'selected' : ''}>${odaSaat(n)}</option>`);
  const d = odaGunEkle(ODA.basTarih, g), K_ = ODA_SEC.katilim || [];
  if (REHBER === null && !REHBER_YUKLENIYOR) rehberYukle().then(() => { if (ODA_SEC) $('#odaKisiDl') && ($('#odaKisiDl').innerHTML = odaKisiSecenek()); });
  return `<div class="oda-form">
    <div class="oda-form-baslik"><b>${esc(odaKisa(o.ad))}</b> · ${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()} ${ODA_GUNK[g]} · ${odaSaat(ODA_SEC.bas)} – <select id="odaBit">${secenek.join('')}</select></div>
    <input id="odaKonu" placeholder="Toplantı konusu" value="${esc(ODA_SEC.konu || '')}">
    <div class="oda-katilim">
      ${K_.map((k, i) => `<span class="oda-cip" title="${esc(k.eposta)}">${esc(k.ad || k.eposta)}<button data-oda-cikar="${i}" title="Çıkar">×</button></span>`).join('')}
      <input id="odaKisi" list="odaKisiDl" placeholder="Katılımcı ekle (ad ya da e-posta)" autocomplete="off">
      <datalist id="odaKisiDl">${odaKisiSecenek()}</datalist></div>
    <button class="btn primary" data-oda-rezerve>Rezerve et ve davet gönder</button>
    <button class="btn" data-oda-vazgec>Vazgeç</button>
    <div class="oda-not">Davet oda${K_.length ? ` ve ${K_.length} katılımcı` : ''} adına Outlook'tan gönderilir; oda daveti kabul edince rezervasyon kesinleşir.</div></div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-oda-g],[data-oda-kay],[data-oda-kip],[data-oda-sec],[data-oda-gun],[data-oda-yenile],[data-oda-rezerve],[data-oda-vazgec],[data-oda-cikar]');
  if (!t || !t.closest('#odaPanel')) return;
  if (t.dataset.odaCikar !== undefined) { ODA_SEC.katilim.splice(+t.dataset.odaCikar, 1); ODA_SEC.konu = $('#odaKonu').value; return odaCiz(); }
  if (t.dataset.odaSec !== undefined) { ODA_SECILI = +t.dataset.odaSec; ODA_SEC = null; return odaCiz(); }   // aynı veri, yalnız oda değişir
  if (t.dataset.odaKip) { if (ODA_KIP !== t.dataset.odaKip) { ODA_KIP = t.dataset.odaKip; ODA_SEC = null; odaYukle(); } return; }
  if (t.dataset.odaKay !== undefined) {
    const k = +t.dataset.odaKay;
    ODA_REF = k === 0 ? new Date() : ODA_KIP === 'hafta' ? odaGunEkle(ODA_REF, 7 * k) : new Date(ODA_REF.getFullYear(), ODA_REF.getMonth() + k, 1);
    ODA_SEC = null; return odaYukle();
  }
  if (t.dataset.odaGun) { const [y, a, g] = t.dataset.odaGun.split('-').map(Number); ODA_REF = new Date(y, a - 1, g); ODA_KIP = 'hafta'; ODA_SEC = null; return odaYukle(); }
  if (t.hasAttribute('data-oda-yenile')) { ODA_SEC = null; return odaYukle(); }
  if (t.hasAttribute('data-oda-vazgec')) { ODA_SEC = null; return odaCiz(); }
  if (t.dataset.odaG !== undefined) {
    const g = +t.dataset.odaG, n = +t.dataset.odaN, o = ODA.odalar[ODA_SECILI];
    const konu = ODA_SEC ? ($('#odaKonu') || {}).value : '', katilim = ODA_SEC ? ODA_SEC.katilim || [] : [];   // saat değişse de yazılanlar kalsın
    // Varsayılan 1 saat; sonraki dilim doluysa yarım saat
    ODA_SEC = { g, iso: odaIso(odaGunEkle(ODA.basTarih, g)), bas: n, bit: (n + 1 < ODA_SON && odaDurum(o, g, n + 1) === '0') ? n + 2 : n + 1, konu, katilim };
    odaCiz(); setTimeout(() => $('#odaKonu') && $('#odaKonu').focus(), 30); return;
  }
  if (t.hasAttribute('data-oda-rezerve')) {
    const o = ODA.odalar[ODA_SECILI], bit = +$('#odaBit').value, konu = $('#odaKonu').value.trim();
    if (!konu) { toast('Toplantı konusunu yazın.', true); return $('#odaKonu').focus(); }
    const saatIso = n => `${ODA_SEC.iso}T${odaSaat(n)}`, katilim = (ODA_SEC.katilim || []).map(k => k.eposta);
    // Kutuda yazılı kalmış ama eklenmemiş kişi varsa önce eklensin
    if ($('#odaKisi') && $('#odaKisi').value.trim()) { odaKatilimEkle($('#odaKisi').value); return; }
    const btn = t; btn.disabled = true;
    apiJson('/api/oda/rezerve', { method: 'POST', body: JSON.stringify({ eposta: o.eposta, bas: saatIso(ODA_SEC.bas), bit: saatIso(bit), konu, katilimcilar: katilim, gonder: true }) })
      .then(j => { toast(`${odaKisa(o.ad)} rezervasyon daveti gönderildi${j.katilimci ? ` (${j.katilimci} katılımcı)` : ''}.`); ODA_SEC = null; setTimeout(odaYukle, 4000); odaCiz(); })
      .catch(er => { btn.disabled = false; toast(er.message, true); });
  }
});
document.addEventListener('change', e => { if (e.target.id === 'odaBit' && ODA_SEC) { ODA_SEC.bit = +e.target.value; ODA_SEC.konu = $('#odaKonu').value; odaCiz(); } });

let DIL = 'tr';
function dilCevir(s) {
  const t = s.trim(); if (!t) return null;
  if (DIL_EN[t] !== undefined) return s.replace(t, DIL_EN[t]);

  for (let n; (n = w.nextNode());) { const c = dilCevir(n.nodeValue); if (c !== null && c !== n.nodeValue) n.nodeValue = c; }
  (kok.querySelectorAll ? kok.querySelectorAll('[placeholder],[title]') : []).forEach(el => {
    for (const a of ['placeholder', 'title']) { const v = el.getAttribute(a); if (v) { const c = dilCevir(v); if (c !== null && c !== v) el.setAttribute(a, c); } }
  });
}
let DIL_GOZCU = null;
function dilUygula() {
  DIL = V.ayar.dil === 'en' ? 'en' : 'tr';

  $$('#dilMenu [data-dil]').forEach(b => b.classList.toggle('acik', b.dataset.dil === DIL));
  if (DIL !== 'en') return;
  dilAgac(document.body);
  if (!DIL_GOZCU) {
    DIL_GOZCU = new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') { const c = dilCevir(m.target.nodeValue); if (c !== null && c !== m.target.nodeValue) m.target.nodeValue = c; } else m.addedNodes.forEach(n => n.nodeType === 3 ? (() => { const c = dilCevir(n.nodeValue); if (c !== null && c !== n.nodeValue) n.nodeValue = c; })() : dilAgac(n)); } });
    DIL_GOZCU.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
}

const HAVA_VARS = { ad: 'İstanbul', lat: 41.0082, lon: 28.9784 };
function havaTur(kod, gunduz) {
  if (kod === 0) return { ad: 'Açık', s: gunduz === 0 ? 'ay' : 'gunes' };
  if (kod <= 2) return { ad: 'Parçalı bulutlu', s: gunduz === 0 ? 'ay' : 'parcali' };
  if (kod === 3) return { ad: 'Kapalı', s: 'bulut' };

  if (kod <= 67 || (kod >= 80 && kod <= 82)) return { ad: kod <= 57 ? 'Çisenti' : 'Yağmurlu', s: 'yagmur' };

}

let HAVA_ZAMAN = 0;

  // Yalnız gecikenler, bugün ve yaklaşanlar (termini olmayan ya da uzak olan Notlar/Aksiyonlar sayfasında)
  const takipte = t => ['gecmis', 'bugun', 'yaklasan'].includes(kova(t));
  const notlar = V.kayitlar.filter(k => k.tur === 'not' && acikMi(k) && takipte(k.termin)).sort((a, b) => terminSira(a, b) || (b.olusturma || '').localeCompare(a.olusturma || ''));
  $('#anaNot').innerHTML = notlar.length ? `<table class="tbl"><tbody>${notlar.map(k =>
    `<tr class="clickable" data-k="${k.id}"><td class="no">${esc(k.no)}</td><td${k.ozet ? ` data-ipucu="${esc(k.ozet.length > 600 ? k.ozet.slice(0, 600) + "…" : k.ozet)}"` : ''}>${esc(k.baslik)}</td>` +   // anasayfada yalnız başlık; içerik üzerine gelince
    `<td class="tarih">${trTarih(k.termin)}</td><td class="dar">${kalanHtml(k.termin)}</td>` +
    `</tr>`).join('')}</tbody></table>` : '<div class="bos">Geciken ya da yaklaşan not yok.</div>';
  // Kişisel takip alanı: sorumlusu kim olursa olsun geciken/yaklaşan açık aksiyonlar (sorumlu satırda yazar)
  const aks = [];
  for (const k of V.kayitlar) if (k.durum !== 'iptal') for (const a of k.aksiyonlar)
    if (a.durum !== 'tamam' && takipte(a.termin)) aks.push({ k, a });
  aks.sort((x, y) => terminSira(x.a, y.a));
  $('#anaAks').innerHTML = aks.length ? `<table class="tbl"><tbody>${aks.map(({ k, a }) =>
    `<tr class="clickable" data-k="${k.id}" data-a="${a.id}"><td class="no">${esc(a.no || '')}</td><td${(() => { const ip = [k.baslik && trK(k.baslik) !== trK(a.metin) ? 'Kayıt: ' + k.baslik : ''].filter(Boolean).join('\n'); return ip ? ` data-ipucu="${esc(ip)}"` : ''; })()}>${esc(a.metin)}${a.onem === 'yuksek' ? '<span class="oncelik" data-ipucu="Yüksek öncelik"></span>' : ''}</td>` +   // bağlı kayıt üzerine gelince
    `<td class="tarih">${trTarih(a.termin)}</td><td class="dar">${kalanHtml(a.termin)}</td></tr>`).join('')}</tbody></table>` : '<div class="bos">Geciken ya da yaklaşan aksiyon yok.</div>';
}
function anaCiz() {

  bayrakliCiz();
  if (Date.now() - BAYRAKLI_ZAMAN > Math.max(5, V.ayar.kontrolDk) * 60000) bayrakliYukle();
  const L = isler(), say = { gecmis: 0, bugun: 0, yaklasan: 0 };
  L.forEach(i => { const k = kova(i.termin); if (k in say) say[k]++; });
  const kap = kapananlar();
  // Anasayfa kartları: Bugünkü İşler · Toplantı (bugün, Outlook) · Bekleyen İşler (tüm açık not + aksiyon) · Bekleyen Talepler
  if (ANA_TOPLANTI === null || Date.now() - ANA_TOPLANTI_ZAMAN > 10 * 60000) anaToplantiYukle();

  let satirlar = '', n = 0;
  if (anaFiltre === 'kapanan') {
    $('#anaBaslik').textContent = 'Bu Ay Kapanan';

    satirlar = kap.map(i => isSatir(i, true)).join('');
  } else {
    $('#anaBaslik').textContent = anaFiltre === 'acik' ? 'Açık İşler' : ((K.find(x => x[0] === anaFiltre) || [, 'Açık İşler'])[1]);
    const gruplar = anaFiltre === 'acik' ? GRUPLAR : GRUPLAR.filter(g => g[0] === anaFiltre);
    for (const [g, ad] of gruplar) {
      const G = L.filter(i => kova(i.termin) === g).sort(terminSira);
      if (!G.length) continue;
      n += G.length;
      satirlar += G.map(i => isSatir(i)).join('');
    }
  }
  $('#anaSay').textContent = n;
  // Varsayılan (Açık İşler) görünümde kartın içi Notlarım | Aksiyonlarım; süzülünce liste
  const ikili = anaFiltre === 'acik';
  $('#anaIkili').style.display = ikili ? '' : 'none';
  $('#anaListe').style.display = ikili ? 'none' : '';
  if (ikili) $('#anaSay').textContent = '';   // bölmelerin kendi sayıları var
  $('#anaListe').innerHTML = n
    ? `<table class="tbl"><thead><tr><th>No</th><th>İş</th><th>Tür</th><th>Kimden</th><th>Sorumlu</th><th>Termin</th><th>${anaFiltre === 'kapanan' ? 'Kapanış' : 'Kalan'}</th><th>Durum</th></tr></thead><tbody>${satirlar}</tbody></table>`
    : `<div class="bos">${anaFiltre === 'acik' ? 'Açık iş yok.' : 'Bu grupta iş yok.'}</div>`;
}
/* Kartlara tıklayınca liste açılır pencerede (kullanıcı istedi): Termini Geçen / Bugün / Yaklaşan /
   Açık İşler (gruplu) / Bu Ay Kapanan. Satıra tıklayınca kayıt bu pencerenin üstünde açılır. */
let ANA_LISTE_F = '';
// Bugünün Outlook toplantıları (Toplantı kartı); 10 dakikada bir tazelenir
let ANA_TOPLANTI = null, ANA_TOPLANTI_ZAMAN = 0, ANA_TOPLANTI_YUK = false;
async function anaToplantiYukle() {
  if (ANA_TOPLANTI_YUK) return; ANA_TOPLANTI_YUK = true; ANA_TOPLANTI_ZAMAN = Date.now();
  try { const j = await apiJson(`/api/takvim?bas=${bugun()}&gunSayi=1`); ANA_TOPLANTI = [].concat(j.olaylar || []).sort((a, b) => (a.bas || '').localeCompare(b.bas || '')); anaToplantiYukle.deneme = 0; }
  catch (e) {
    if (ANA_TOPLANTI === null) ANA_TOPLANTI = [];
    // Açılışta Outlook henüz klasörlerini yüklememiş olabilir: 15 sn arayla en çok 6 kez yeniden denenir
    if ((anaToplantiYukle.deneme = (anaToplantiYukle.deneme || 0) + 1) <= 6) setTimeout(() => { ANA_TOPLANTI_ZAMAN = 0; anaToplantiYukle(); }, 15000);
  }
  ANA_TOPLANTI_YUK = false;
  if (aktif === 'ana') anaCiz();
}
// Bugünkü İşler penceresindeki gün (yyyy-aa-gg); kart her açıldığında bugüne döner
let ANA_GUN = '', ANA_TALEP_YON = 'gelen';   // Bekleyen Talepler penceresi: gelen | giden
document.addEventListener('click', e => {
  if (e.target.closest('[data-talep-kay]')) { ANA_TALEP_YON = ANA_TALEP_YON === 'gelen' ? 'giden' : 'gelen'; return anaListePencere('talep'); }
  const b = e.target.closest('[data-gun-kay]'); if (!b) return;
  const n = +b.dataset.gunKay, d = new Date((ANA_GUN || bugun()) + 'T00:00');

  anaListePencere(ANA_LISTE_F === 'toplanti' ? 'toplanti' : 'bugun');

// Gün seçici (‹ tarih ›, Bugün): Bugünkü İşler ve Toplantı pencereleri
function gunSeciciHtml() {
  const d = new Date(ANA_GUN + 'T00:00'), fark = Math.round((d - new Date(bugun() + 'T00:00')) / 864e5);
  const etiket = fark === 0 ? 'Bugün' : fark === 1 ? 'Yarın' : fark === -1 ? 'Dün' : '';
  return `<div class="gun-secici"><button class="ikon-btn" data-gun-kay="-1" aria-label="Önceki gün">‹</button>
    <div class="gs-tarih"><b>${d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })}</b><span>${d.toLocaleDateString('tr-TR', { weekday: 'long' })}${etiket ? ' · ' + etiket : ''}</span></div>

/* Toplantı penceresi: seçilen günün Outlook takvimi — saat, konu, tür (Teams / toplantı / randevu), yer, düzenleyen.
   Teams toplantısında "Katıl"; satıra tıklayınca Outlook'ta açılır. Gün başına önbellek. */
const TOP_GUN = {};

    const tur = o => o.teams ? 'Teams' : o.tumGun ? 'Tüm gün' : o.toplanti ? 'Toplantı' : 'Randevu';
    $('#mlGovde').innerHTML = gunSeciciHtml() + (L === null ? '<div class="yukleniyor">Outlook takvimi okunuyor…</div>'
