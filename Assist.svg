<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124" width="124" height="124">
  <!-- Assist logosu (15.10.2026): STFA bayrak isareti renklerinde (kirmizi #D23626/#CA2225, beyaz #F6F6F6/#D9D9D9) dortlu parlak disk + SSIST yazisiyla ayni renkte (#C3C5C8) A; A, ASSIST yazisinin yazi tipinden
       (Lexend Exa 300) olculerek cizildi. Ince koyu gri (#5A6472) kontur, yumusak golge. AssistSimge/Assist.ico ve assist_simge.png bundan uretilir. -->
  <defs>
    <linearGradient id="kirmizi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DC4A34"/><stop offset=".55" stop-color="#D23626"/><stop offset="1" stop-color="#BF271F"/></linearGradient><linearGradient id="kirmizi2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D52526"/><stop offset=".6" stop-color="#C82225"/><stop offset="1" stop-color="#B51E21"/></linearGradient>
    <linearGradient id="gri" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEEEED"/><stop offset=".5" stop-color="#F6F6F6"/><stop offset="1" stop-color="#F2F2F1"/></linearGradient><linearGradient id="gri2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5E4E4"/><stop offset=".5" stop-color="#D9D9D9"/><stop offset="1" stop-color="#CDCDCD"/></linearGradient>
    <linearGradient id="parlak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="harf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8DADC"/><stop offset=".5" stop-color="#C3C5C8"/><stop offset="1" stop-color="#ACAFB3"/></linearGradient>
    <linearGradient id="kenar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient>
    <linearGradient id="pah" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset=".6" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="1.8" dy="2.8" stdDeviation="2.2" flood-color="#14181F" flood-opacity=".35"/></filter>
    <clipPath id="disk"><circle cx="62" cy="62" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#disk)">
    <rect x="0" y="0" width="62" height="62" fill="url(#kirmizi)"/>
    <rect x="62" y="0" width="62" height="62" fill="url(#gri)"/>
    <rect x="62" y="62" width="62" height="62" fill="url(#kirmizi2)"/>
    <rect x="0" y="62" width="62" height="62" fill="url(#gri2)"/>
    <circle cx="62" cy="62" r="60" fill="url(#kenar)"/>
    <ellipse cx="62" cy="34" rx="46" ry="30" fill="url(#parlak)"/>
  </g>
  <circle cx="62" cy="62" r="57.6" fill="none" stroke="url(#pah)" stroke-width="3.2"/>
  <circle cx="62" cy="62" r="59.4" fill="none" stroke="#14181F" stroke-opacity=".22" stroke-width="1.2"/>
  <path filter="url(#golge)" fill-rule="evenodd" d="M28.88 97 L57.52 29 L66.68 29 L95.12 97 L87.13 97 L79.34 78.88 L44.07 78.88 L36.48 97 Z M47.39 71.09 L76.03 71.09 L61.81 36.4 Z" fill="url(#harf)" stroke="#5A6472" stroke-width="1.5" stroke-linejoin="round"/>
  
</svg>